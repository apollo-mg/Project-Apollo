<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Pelican riding a bicycle">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#eaf6fb"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef3"/>
    </linearGradient>
  </defs>

  <!-- sky / ground -->
  <rect x="0" y="0" width="600" height="420" fill="url(#skyGrad)"/>
  <ellipse cx="300" cy="398" rx="270" ry="14" fill="#cfd8dc"/>
  <ellipse cx="300" cy="398" rx="250" ry="8" fill="#b0bec5"/>

  <!-- ========== BICYCLE ========== -->
  <g id="bike" stroke-linecap="round" stroke-linejoin="round">
    <!-- rear wheel -->
    <g id="rearWheel">
      <circle cx="150" cy="320" r="74" fill="#2d3436"/>
      <circle cx="150" cy="320" r="60" fill="#b2bec3"/>
      <circle cx="150" cy="320" r="12" fill="#2d3436"/>
      <!-- spokes -->
      <line x1="150" y1="258" x2="150" y2="308" stroke="#636e72" stroke-width="2"/>
      <line x1="150" y1="332" x2="150" y2="382" stroke="#636e72" stroke-width="2"/>
      <line x1="88" y1="320" x2="138" y2="320" stroke="#636e72" stroke-width="2"/>
      <line x1="162" y1="320" x2="212" y2="320" stroke="#636e72" stroke-width="2"/>
      <line x1="106" y1="276" x2="142" y2="312" stroke="#636e72" stroke-width="2"/>
      <line x1="158" y1="328" x2="194" y2="364" stroke="#636e72" stroke-width="2"/>
      <line x1="106" y1="364" x2="142" y2="328" stroke="#636e72" stroke-width="2"/>
      <line x1="158" y1="312" x2="194" y2="276" stroke="#636e72" stroke-width="2"/>
    </g>
    <!-- front wheel -->
    <g id="frontWheel">
      <circle cx="450" cy="320" r="74" fill="#2d3436"/>
      <circle cx="450" cy="320" r="60" fill="#b2bec3"/>
      <circle cx="450" cy="320" r="12" fill="#2d3436"/>
      <line x1="450" y1="258" x2="450" y2="308" stroke="#636e72" stroke-width="2"/>
      <line x1="450" y1="332" x2="450" y2="382" stroke="#636e72" stroke-width="2"/>
      <line x1="388" y1="320" x2="438" y2="320" stroke="#636e72" stroke-width="2"/>
      <line x1="462" y1="320" x2="512" y2="320" stroke="#636e72" stroke-width="2"/>
      <line x1="406" y1="276" x2="442" y2="312" stroke="#636e72" stroke-width="2"/>
      <line x1="458" y1="328" x2="494" y2="364" stroke="#636e72" stroke-width="2"/>
      <line x1="406" y1="364" x2="442" y2="328" stroke="#636e72" stroke-width="2"/>
      <line x1="458" y1="312" x2="494" y2="276" stroke="#636e72" stroke-width="2"/>
    </g>

    <!-- frame tubes -->
    <g stroke="#e74c3c" stroke-width="9" fill="none">
      <line x1="220" y1="200" x2="360" y2="210"/>   <!-- top tube -->
      <line x1="360" y1="210" x2="300" y2="300"/>   <!-- down tube -->
      <line x1="220" y1="200" x2="300" y2="300"/>   <!-- seat tube -->
      <line x1="300" y1="300" x2="150" y2="320"/>   <!-- chain stay -->
      <line x1="220" y1="200" x2="150" y2="320"/>   <!-- seat stay -->
      <line x1="360" y1="210" x2="450" y2="320"/>   <!-- fork -->
    </g>
    <!-- bottom bracket -->
    <circle cx="300" cy="300" r="11" fill="#2d3436"/>
    <!-- crank arms + pedals -->
    <g stroke="#2d3436" stroke-width="6" fill="none">
      <line x1="300" y1="300" x2="284" y2="316"/>
      <line x1="300" y1="300" x2="316" y2="284"/>
    </g>
    <rect x="276" y="310" width="18" height="7" rx="3" fill="#636e72" stroke="#2d3436" stroke-width="1"/>
    <rect x="308" y="278" width="18" height="7" rx="3" fill="#636e72" stroke="#2d3436" stroke-width="1"/>
    <!-- saddle -->
    <rect x="205" y="190" width="40" height="12" rx="6" fill="#8b4513" stroke="#5d2e0e" stroke-width="2"/>
    <line x1="220" y1="202" x2="220" y2="190" stroke="#5d2e0e" stroke-width="3"/>
    <!-- seat post -->
    <line x1="220" y1="202" x2="220" y2="240" stroke="#2d3436" stroke-width="6"/>
    <!-- handlebars -->
    <g stroke="#2d3436" stroke-width="7" fill="none">
      <line x1="360" y1="210" x2="360" y2="185"/>
      <path d="M 360 195 Q 340 200 325 210" />
      <path d="M 360 195 Q 380 200 395 210" />
    </g>
    <circle cx="325" cy="210" r="6" fill="#636e72"/>
    <circle cx="395" cy="210" r="6" fill="#636e72"/>
    <!-- stem cap -->
    <circle cx="360" cy="210" r="5" fill="#636e72"/>
  </g>

  <!-- ========== PELICAN ========== -->
  <g id="pelican">
    <!-- tail feathers -->
    <path d="M 188 162 Q 150 138 142 172 Q 162 186 196 176 Z" fill="url(#bodyGrad)" stroke="#c9d6e0" stroke-width="1.5"/>
    <!-- body -->
    <ellipse cx="232" cy="162" rx="52" ry="38" fill="url(#bodyGrad)" stroke="#c9d6e0" stroke-width="1.5" transform="rotate(-14 232 162)"/>
    <!-- wing (left, reaching to left grip) -->
    <path d="M 198 148 C 245 122, 295 160, 325 210 L 302 216 C 262 196, 222 182, 192 166 Z" fill="#f1f5f9" stroke="#c9d6e0" stroke-width="1.5"/>
    <!-- wing feathers lines -->
    <g stroke="#c9d6e0" stroke-width="1" fill="none">
      <path d="M 210 160 Q 250 150 290 185"/>
      <path d="M 205 172 Q 245 162 285 195"/>
    </g>
    <!-- wing (right, reaching to right grip) -->
    <path d="M 252 142 C 305 118, 365 152, 395 210 L 372 216 C 335 196, 290 182, 250 162 Z" fill="#f1f5f9" stroke="#c9d6e0" stroke-width="1.5"/>
    <g stroke="#c9d6e0" stroke-width="1" fill="none">
      <path d="M 265 158 Q 310 148 355 188"/>
      <path d="M 260 170 Q 305 160 350 198"/>
    </g>
    <!-- neck -->
    <path d="M 260 132 Q 282 112 300 114" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 260 132 Q 282 112 300 114" stroke="#c9d6e0" stroke-width="1.5" fill="none"/>
    <!-- head -->
    <ellipse cx="300" cy="114" rx="22" ry="18" fill="#ffffff" stroke="#c9d6e0" stroke-width="1.5"/>
    <!-- beak upper -->
    <line x1="300" y1="110" x2="402" y2="92" stroke="#f9ca24" stroke-width="6" stroke-linecap="round"/>
    <!-- beak pouch -->
    <path d="M 300 116 Q 322 166 366 152 Q 390 128 400 96 Q 362 108 300 116 Z" fill="#f9ca24" stroke="#e1a100" stroke-width="1.5"/>
    <path d="M 302 118 Q 324 140 350 130" stroke="#e1a100" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- eye -->
    <circle cx="312" cy="108" r="4.5" fill="#2d3436"/>
    <circle cx="313.5" cy="106.5" r="1.6" fill="#ffffff"/>
    <!-- legs -->
    <g stroke="#2d3436" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 224 192 Q 250 242 284 316"/>
      <path d="M 246 188 Q 276 232 316 284"/>
    </g>
    <!-- feet on pedals -->
    <ellipse cx="284" cy="316" rx="13" ry="6" fill="#2d3436"/>
    <ellipse cx="316" cy="284" rx="13" ry="6" fill="#2d3436"/>
    <path d="M 274 316 L 294 316" stroke="#636e72" stroke-width="1"/>
    <path d="M 306 284 L 326 284" stroke="#636e72" stroke-width="1"/>
  </g>

  <!-- small motion lines -->
  <g stroke="#90a4ae" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="300" x2="80" y2="300"/>
    <line x1="40" y1="330" x2="75" y2="330"/>
    <line x1="55" y1="360" x2="85" y2="360"/>
  </g>
</svg>