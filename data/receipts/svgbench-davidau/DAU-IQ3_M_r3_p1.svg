<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <style>
      .sky { fill: #E3F2FD; }
      .ground { fill: #A5D6A7; }
      .tire { fill: #333; stroke: #222; stroke-width: 2; }
      .rim { fill: none; stroke: #888; stroke-width: 2; }
      .spoke { stroke: #AAA; stroke-width: 1.5; }
      .frame { fill: none; stroke: #D32F2F; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .pedal { fill: #333; }
      .seat { fill: #333; }
      .handlebar { fill: none; stroke: #333; stroke-width: 4; stroke-linecap: round; }
      .pelican-body { fill: #FFF8E1; stroke: #D4C5A0; stroke-width: 2; }
      .pelican-neck { fill: #FFF8E1; stroke: #D4C5A0; stroke-width: 2; }
      .pelican-head { fill: #FFF8E1; stroke: #D4C5A0; stroke-width: 2; }
      .beak-upper { fill: #FF9800; stroke: #E65100; stroke-width: 1.5; }
      .beak-lower { fill: #FFB74D; stroke: #E65100; stroke-width: 1.5; }
      .eye { fill: #FFF; }
      .pupil { fill: #111; }
      .wing { fill: #F5F0DC; stroke: #D4C5A0; stroke-width: 2; }
      .foot { fill: #FF9800; stroke: #E65100; stroke-width: 1.5; }
      .feather { fill: #FFF; stroke: #E0D5C0; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="sky" x="0" y="0" width="500" height="340"/>
  <rect class="ground" x="0" y="340" width="500" height="60"/>
  
  <!-- Motion lines -->
  <g stroke="#BBDEFB" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="100" x2="70" y2="100"/>
    <line x1="10" y1="140" x2="55" y2="140"/>
    <line x1="30" y1="180" x2="80" y2="180"/>
    <line x1="15" y1="220" x2="60" y2="220"/>
  </g>

  <!-- BICYCLE -->
  <!-- Rear Wheel -->
  <circle class="tire" cx="100" cy="300" r="55"/>
  <circle class="tire" cx="100" cy="300" r="48" fill="#FFF"/>
  <circle class="rim" cx="100" cy="300" r="48"/>
  <circle class="tire" cx="100" cy="300" r="8"/>
  <!-- Rear Spokes -->
  <g class="spoke">
    <line x1="100" y1="252" x2="100" y2="292"/>
    <line x1="100" y1="308" x2="100" y2="348"/>
    <line x1="52" y1="300" x2="92" y2="300"/>
    <line x1="108" y1="300" x2="148" y2="300"/>
    <line x1="66" y1="266" x2="92" y2="292"/>
    <line x1="108" y1="308" x2="134" y2="334"/>
    <line x1="66" y1="334" x2="92" y2="308"/>
    <line x1="108" y1="292" x2="134" y2="266"/>
  </g>

  <!-- Front Wheel -->
  <circle class="tire" cx="380" cy="300" r="55"/>
  <circle class="tire" cx="380" cy="300" r="48" fill="#FFF"/>
  <circle class="rim" cx="380" cy="300" r="48"/>
  <circle class="tire" cx="380" cy="300" r="8"/>
  <!-- Front Spokes -->
  <g class="spoke">
    <line x1="380" y1="252" x2="380" y2="292"/>
    <line x1="380" y1="308" x2="380" y2="348"/>
    <line x1="332" y1="300" x2="372" y2="300"/>
    <line x1="388" y1="300" x2="428" y2="300"/>
    <line x1="346" y1="266" x2="372" y2="292"/>
    <line x1="388" y1="308" x2="414" y2="334"/>
    <line x1="346" y1="334" x2="372" y2="308"/>
    <line x1="388" y1="292" x2="414" y2="266"/>
  </g>

  <!-- Bicycle Frame -->
  <g class="frame">
    <!-- Rear wheel to seat tube bottom -->
    <line x1="100" y1="300" x2="180" y2="300"/>
    <!-- Seat tube -->
    <line x1="180" y1="300" x2="150" y2="190"/>
    <!-- Top tube -->
    <line x1="150" y1="190" x2="350" y2="190"/>
    <!-- Down tube -->
    <line x1="180" y1="300" x2="350" y2="190"/>
    <!-- Front fork -->
    <line x1="350" y1="190" x2="380" y2="300"/>
    <!-- Rear dropouts -->
    <line x1="100" y1="300" x2="180" y2="300"/>
  </g>

  <!-- Seat Post and Seat -->
  <line x1="150" y1="190" x2="145" y2="170" stroke="#555" stroke-width="5"/>
  <ellipse class="seat" cx="145" cy="168" rx="18" ry="8"/>

  <!-- Handlebars -->
  <line x1="350" y1="190" x2="360" y2="165" stroke="#555" stroke-width="4"/>
  <path class="handlebar" d="M 345,165 Q 360,155 375,165"/>

  <!-- Crankset and Pedals -->
  <circle cx="180" cy="300" r="12" fill="#555"/>
  <line x1="180" y1="300" x2="200" y2="320" stroke="#555" stroke-width="4"/>
  <rect class="pedal" x="195" y="318" width="14" height="6" rx="2"/>
  <line x1="180" y1="300" x2="160" y2="280" stroke="#555" stroke-width="4"/>
  <rect class="pedal" x="152" y="274" width="14" height="6" rx="2"/>

  <!-- Chain -->
  <path d="M 192,300 Q 200,320 200,330 Q 200,345 180,348 Q 120,348 100,308" 
        fill="none" stroke="#666" stroke-width="3" stroke-dasharray="4,3"/>

  <!-- PELICAN -->
  <!-- Pelican's legs (behind seat) -->
  <g class="foot">
    <!-- Left leg to far pedal -->
    <path d="M 165,200 Q 155,240 160,278" fill="none" stroke="#FF9800" stroke-width="6"/>
    <ellipse cx="160" cy="278" rx="8" ry="5" transform="rotate(-15,160,278)"/>
    <!-- Right leg to near pedal -->
    <path d="M 175,200 Q 185,260 198,316" fill="none" stroke="#FF9800" stroke-width="6"/>
    <ellipse cx="202" cy="322" rx="8" ry="5" transform="rotate(15,202,322)"/>
  </g>

  <!-- Tail feathers -->
  <g>
    <path class="feather" d="M 115,180 Q 95,165 85,175 Q 100,185 115,185 Z"/>
    <path class="feather" d="M 112,190 Q 90,180 80,190 Q 95,198 112,195 Z"/>
    <path class="feather" d="M 115,200 Q 98,195 90,205 Q 105,210 115,205 Z"/>
  </g>

  <!-- Body -->
  <ellipse class="pelican-body" cx="155" cy="195" rx="55" ry="45" transform="rotate(-5,155,195)"/>

  <!-- Wing -->
  <ellipse class="wing" cx="160" cy="205" rx="40" ry="25" transform="rotate(-8,160,205)"/>
  <!-- Wing feather details -->
  <path d="M 125,205 Q 140,195 155,195" fill="none" stroke="#D4C5A0" stroke-width="1.5"/>
  <path d="M 128,215 Q 145,205 160,205" fill="none" stroke="#D4C5A0" stroke-width="1.5"/>
  <path d="M 132,225 Q 148,218 163,218" fill="none" stroke="#D4C5A0" stroke-width="1.5"/>

  <!-- Neck -->
  <path class="pelican-neck" d="M 195,170 Q 210,140 220,110 Q 228,85 240,80 Q 255,75 265,85" 
        fill="none" stroke="#FFF8E1" stroke-width="28" stroke-linecap="round"/>
  <!-- Neck outline -->
  <path d="M 195,170 Q 210,140 220,110 Q 228,85 240,80" 
        fill="none" stroke="#D4C5A0" stroke-width="2"/>

  <!-- Head -->
  <ellipse class="pelican-head" cx="260" cy="82" rx="22" ry="18"/>

  <!-- Upper beak -->
  <path class="beak-upper" d="M 272,78 Q 300,75 325,85 Q 300,88 272,85 Z"/>
  
  <!-- Lower beak with pouch -->
  <path class="beak-lower" d="M 272,85 Q 295,88 310,100 Q 300,118 285,115 Q 275,108 272,95 Z"/>
  
  <!-- Eye -->
  <circle class="eye" cx="268" cy="76" r="5"/>
  <circle class="pupil" cx="270" cy="76" r="2.5"/>
  <circle cx="271" cy="75" r="1" fill="#FFF"/>

  <!-- Handlebar grip (pelican's wing tip grabbing it) -->
  <ellipse class="pelican-body" cx="360" cy="162" rx="8" ry="6" transform="rotate(20,360,162)"/>

</svg>