<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Sky background -->
  <rect width="600" height="400" fill="#E8F4FD"/>
  
  <!-- Ground -->
  <rect x="0" y="340" width="600" height="60" fill="#7CB342"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#558B2F" stroke-width="3"/>
  
  <!-- Road/path -->
  <rect x="0" y="340" width="600" height="15" fill="#9E9E9E"/>
  
  <!-- Bicycle rear wheel -->
  <circle cx="180" cy="290" r="55" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="180" cy="290" r="55" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="8,8"/>
  <circle cx="180" cy="290" r="6" fill="#444"/>
  <!-- Spokes rear -->
  <line x1="180" y1="235" x2="180" y2="345" stroke="#888" stroke-width="1.5"/>
  <line x1="125" y1="290" x2="235" y2="290" stroke="#888" stroke-width="1.5"/>
  <line x1="141" y1="251" x2="219" y2="329" stroke="#888" stroke-width="1.5"/>
  <line x1="141" y1="329" x2="219" y2="251" stroke="#888" stroke-width="1.5"/>
  
  <!-- Bicycle front wheel -->
  <circle cx="430" cy="290" r="55" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="430" cy="290" r="55" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="8,8"/>
  <circle cx="430" cy="290" r="6" fill="#444"/>
  <!-- Spokes front -->
  <line x1="430" y1="235" x2="430" y2="345" stroke="#888" stroke-width="1.5"/>
  <line x1="375" y1="290" x2="485" y2="290" stroke="#888" stroke-width="1.5"/>
  <line x1="391" y1="251" x2="469" y2="329" stroke="#888" stroke-width="1.5"/>
  <line x1="391" y1="329" x2="469" y2="251" stroke="#888" stroke-width="1.5"/>
  
  <!-- Bicycle frame -->
  <line x1="180" y1="290" x2="260" y2="200" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="200" x2="430" y2="200" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
  <line x1="430" y1="200" x2="430" y2="290" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="290" x2="260" y2="290" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="200" x2="180" y2="290" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Seat post and seat -->
  <line x1="260" y1="200" x2="240" y2="140" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="240" cy="135" rx="22" ry="8" fill="#222"/>
  
  <!-- Handlebars -->
  <line x1="430" y1="200" x2="450" y2="130" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="435" y1="135" x2="470" y2="130" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <circle cx="435" cy="135" r="5" fill="#555"/>
  <circle cx="470" cy="130" r="5" fill="#555"/>
  
  <!-- Chain and gears -->
  <circle cx="180" cy="290" r="12" fill="#555"/>
  <circle cx="180" cy="290" r="8" fill="#333"/>
  
  <!-- Pedals -->
  <circle cx="210" cy="270" r="4" fill="#333"/>
  <line x1="210" y1="270" x2="225" y2="265" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pelican body -->
  <ellipse cx="270" cy="130" rx="65" ry="50" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  
  <!-- Pelican tail feathers -->
  <path d="M210,140 L180,130 L190,145 L185,155 L210,150 Z" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  
  <!-- Pelican neck -->
  <path d="M320,110 Q340,80 335,50 Q333,35 345,30" fill="none" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round"/>
  <path d="M320,110 Q340,80 335,50 Q333,35 345,30" fill="none" stroke="#DDD" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pelican head -->
  <circle cx="348" cy="28" r="20" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  
  <!-- Pelican eye -->
  <circle cx="355" cy="24" r="5" fill="#FFF"/>
  <circle cx="356" cy="23" r="3" fill="#222"/>
  <circle cx="357" cy="22" r="1" fill="#FFF"/>
  
  <!-- Pelican beak (upper) -->
  <path d="M360,30 L415,38 L360,42 Z" fill="#F5A623" stroke="#D4891A" stroke-width="1.5"/>
  
  <!-- Pelican beak (lower with throat pouch) -->
  <path d="M360,42 Q390,65 415,38" fill="#FFB74D" stroke="#D4891A" stroke-width="1.5"/>
  
  <!-- Wing reaching to handlebars -->
  <path d="M300,140 Q360,120 440,135 Q450,138 445,145 Q400,135 340,155 Q320,160 300,140 Z" fill="#F5F5F5" stroke="#CCC" stroke-width="1.5"/>
  <!-- Wing feather details -->
  <path d="M340,135 Q370,128 410,133" fill="none" stroke="#DDD" stroke-width="1"/>
  <path d="M330,142 Q365,135 400,138" fill="none" stroke="#DDD" stroke-width="1"/>
  
  <!-- Wing tip on handlebar -->
  <ellipse cx="448" cy="138" rx="8" ry="6" fill="#F5F5F5" stroke="#CCC" stroke-width="1.5"/>
  
  <!-- Pelican legs -->
  <line x1="240" y1="165" x2="220" y2="240" stroke="#F5A623" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="240" x2="215" y2="268" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Pelican foot on pedal -->
  <ellipse cx="218" cy="270" rx="10" ry="5" fill="#F5A623"/>
  
  <!-- Second leg (far side, partially visible) -->
  <line x1="250" y1="168" x2="235" y2="235" stroke="#E0901E" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Motion lines -->
  <line x1="80" y1="180" x2="120" y2="180" stroke="#AAA" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="220" x2="100" y2="220" stroke="#AAA" stroke-width="2" opacity="0.4"/>
  <line x1="90" y1="260" x2="130" y2="260" stroke="#AAA" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  
  <!-- Simple cloud -->
  <ellipse cx="480" cy="60" rx="40" ry="18" fill="#FFF" opacity="0.8"/>
  <ellipse cx="510" cy="55" rx="30" ry="15" fill="#FFF" opacity="0.8"/>
  
  <!-- Sun -->
  <circle cx="550" cy="50" r="25" fill="#FFE082" opacity="0.9"/>
</svg>