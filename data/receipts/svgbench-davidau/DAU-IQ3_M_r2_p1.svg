<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground -->
  <line x1="0" y1="290" x2="500" y2="290" stroke="#8B7355" stroke-width="3"/>
  
  <!-- Bicycle frame -->
  <!-- Main triangle -->
  <line x1="120" y1="250" x2="220" y2="160" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="220" y1="160" x2="340" y2="160" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="160" x2="220" y2="260" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="250" x2="220" y2="260" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Seat post -->
  <line x1="220" y1="160" x2="220" y2="110" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Seat -->
  <ellipse cx="220" cy="105" rx="22" ry="8" fill="#222"/>
  
  <!-- Handlebar post -->
  <line x1="340" y1="160" x2="350" y2="100" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Handlebars -->
  <path d="M 330 100 Q 350 85 370 100" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Crank and pedals -->
  <line x1="220" y1="260" x2="200" y2="290" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="260" x2="240" y2="230" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="290" rx="12" ry="4" fill="#222" transform="rotate(-10 200 290)"/>
  <ellipse cx="240" cy="230" rx="12" ry="4" fill="#222" transform="rotate(10 240 230)"/>
  
  <!-- Back wheel -->
  <circle cx="120" cy="260" r="60" stroke="#333" stroke-width="5" fill="none"/>
  <circle cx="120" cy="260" r="55" stroke="#aaa" stroke-width="1" fill="none"/>
  <!-- Spokes -->
  <line x1="120" y1="200" x2="120" y2="320" stroke="#999" stroke-width="1"/>
  <line x1="60" y1="260" x2="180" y2="260" stroke="#999" stroke-width="1"/>
  <line x1="78" y1="218" x2="162" y2="302" stroke="#999" stroke-width="1"/>
  <line x1="78" y1="302" x2="162" y2="218" stroke="#999" stroke-width="1"/>
  
  <!-- Front wheel -->
  <circle cx="360" cy="260" r="60" stroke="#333" stroke-width="5" fill="none"/>
  <circle cx="360" cy="260" r="55" stroke="#aaa" stroke-width="1" fill="none"/>
  <!-- Spokes -->
  <line x1="360" y1="200" x2="360" y2="320" stroke="#999" stroke-width="1"/>
  <line x1="300" y1="260" x2="420" y2="260" stroke="#999" stroke-width="1"/>
  <line x1="318" y1="218" x2="402" y2="302" stroke="#999" stroke-width="1"/>
  <line x1="318" y1="302" x2="402" y2="218" stroke="#999" stroke-width="1"/>
  
  <!-- Pelican body -->
  <ellipse cx="240" cy="140" rx="35" ry="45" fill="#F5F5F0" transform="rotate(10 240 140)"/>
  
  <!-- Pelican neck -->
  <path d="M 265 110 Q 270 70 290 55 Q 300 48 310 55" stroke="#F5F5F0" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Pelican head -->
  <circle cx="315" cy="50" r="22" fill="#F5F5F0"/>
  
  <!-- Pelican eye -->
  <circle cx="322" cy="44" r="5" fill="#333"/>
  <circle cx="324" cy="42" r="2" fill="#fff"/>
  
  <!-- Pelican beak -->
  <path d="M 335 48 Q 360 50 390 55 Q 395 60 392 68 Q 370 75 340 68 Q 335 65 335 55 Z" fill="#FFA500"/>
  <path d="M 335 55 Q 365 55 390 58" stroke="#FF8C00" stroke-width="1" fill="none"/>
  
  <!-- Pelican wing -->
  <path d="M 220 125 Q 200 140 205 165 Q 210 180 230 175 Q 245 170 245 150 Q 245 130 220 125 Z" fill="#E8E8E0"/>
  
  <!-- Pelican leg front (on top pedal) -->
  <line x1="230" y1="175" x2="240" y2="230" stroke="#FFA500" stroke-width="6" stroke-linecap="round"/>
  <!-- Pelican leg back (on bottom pedal) -->
  <line x1="235" y1="180" x2="200" y2="290" stroke="#FFA500" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Webbed feet -->
  <path d="M 232 230 Q 240 240 248 235 Q 245 230 240 225 Q 236 228 232 230 Z" fill="#FFA500"/>
  <path d="M 192 290 Q 200 300 208 295 Q 205 290 200 285 Q 196 288 192 290 Z" fill="#FFA500"/>
  
  <!-- Wing on handlebar -->
  <path d="M 255 130 Q 290 110 330 100 Q 335 105 330 110 Q 295 120 260 140 Z" fill="#E8E8E0"/>
</svg>