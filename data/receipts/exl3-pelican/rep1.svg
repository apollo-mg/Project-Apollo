<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="350" width="600" height="50" fill="#8B4513"/>
  
  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="150" cy="280" r="50" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="150" cy="280" r="3" fill="#333"/>
  <!-- Rear spokes -->
  <line x1="150" y1="230" x2="150" y2="330" stroke="#333" stroke-width="1"/>
  <line x1="100" y1="280" x2="200" y2="280" stroke="#333" stroke-width="1"/>
  <line x1="115" y1="245" x2="185" y2="315" stroke="#333" stroke-width="1"/>
  <line x1="185" y1="245" x2="115" y2="315" stroke="#333" stroke-width="1"/>
  
  <!-- Front wheel -->
  <circle cx="400" cy="280" r="50" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="400" cy="280" r="3" fill="#333"/>
  <!-- Front spokes -->
  <line x1="400" y1="230" x2="400" y2="330" stroke="#333" stroke-width="1"/>
  <line x1="350" y1="280" x2="450" y2="280" stroke="#333" stroke-width="1"/>
  <line x1="365" y1="245" x2="435" y2="315" stroke="#333" stroke-width="1"/>
  <line x1="435" y1="245" x2="365" y2="315" stroke="#333" stroke-width="1"/>
  
  <!-- Frame -->
  <!-- Main triangle -->
  <line x1="150" y1="280" x2="280" y2="200" stroke="#CC0000" stroke-width="4"/>
  <line x1="280" y1="200" x2="400" y2="280" stroke="#CC0000" stroke-width="4"/>
  <line x1="150" y1="280" x2="400" y2="280" stroke="#CC0000" stroke-width="4"/>
  
  <!-- Seat post -->
  <line x1="280" y1="200" x2="280" y2="170" stroke="#333" stroke-width="3"/>
  <!-- Seat -->
  <ellipse cx="280" cy="168" rx="15" ry="5" fill="#333"/>
  
  <!-- Handlebar -->
  <line x1="400" y1="280" x2="400" y2="220" stroke="#333" stroke-width="3"/>
  <!-- Handlebar grips -->
  <line x1="385" y1="220" x2="415" y2="220" stroke="#333" stroke-width="4"/>
  
  <!-- Pedals and crank -->
  <circle cx="280" cy="280" r="8" fill="#666"/>
  <!-- Crank arm -->
  <line x1="280" y1="280" x2="295" y2="295" stroke="#333" stroke-width="3"/>
  <line x1="280" y1="280" x2="265" y2="265" stroke="#333" stroke-width="3"/>
  <!-- Pedal -->
  <rect x="290" y="292" width="15" height="4" fill="#333"/>
  <rect x="260" y="262" width="15" height="4" fill="#333"/>
  
  <!-- Pelican body -->
  <!-- Body (sitting on seat) -->
  <ellipse cx="280" cy="150" rx="35" ry="25" fill="#FFFFFF" stroke="#CCC" stroke-width="1"/>
  
  <!-- Neck -->
  <path d="M 265 140 Q 240 120 230 90 Q 225 70 240 65" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="242" cy="62" r="12" fill="#FFFFFF"/>
  
  <!-- Beak -->
  <path d="M 252 60 Q 280 55 310 65 Q 315 68 310 72 Q 280 70 252 68 Z" fill="#FFB300" stroke="#CC8800" stroke-width="1"/>
  <!-- Lower beak -->
  <path d="M 252 68 Q 275 72 300 75 Q 305 77 300 80 Q 275 78 252 72 Z" fill="#FFB300" stroke="#CC8800" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="245" cy="58" r="3" fill="#333"/>
  <circle cx="246" cy="57" r="1" fill="white"/>
  
  <!-- Wings -->
  <path d="M 290 140 Q 310 130 320 145 Q 315 155 295 150 Z" fill="#FFFFFF" stroke="#CCC" stroke-width="1"/>
  
  <!-- Tail feathers -->
  <path d="M 250 155 Q 230 160 220 165 Q 225 155 250 148 Z" fill="#FFFFFF" stroke="#CCC" stroke-width="1"/>
  
  <!-- Legs (reaching to pedals) -->
  <!-- Left leg -->
  <line x1="270" y1="170" x2="265" y2="265" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="290" y1="170" x2="295" y2="295" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="265" cy="265" rx="6" ry="4" fill="#FFB300"/>
  <ellipse cx="295" cy="295" rx="6" ry="4" fill="#FFB300"/>
  
  <!-- Motion lines -->
  <line x1="80" y1="250" x2="120" y2="250" stroke="#FFF" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="270" x2="110" y2="270" stroke="#FFF" stroke-width="2" opacity="0.6"/>
  <line x1="85" y1="290" x2="125" y2="290" stroke="#FFF" stroke-width="2" opacity="0.6"/>
</svg>