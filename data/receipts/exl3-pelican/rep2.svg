<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect width="500" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="500" height="80" fill="#4CAF50"/>
  
  <!-- Bicycle Frame -->
  <!-- Rear wheel -->
  <circle cx="150" cy="320" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="150" cy="320" r="5" fill="#333"/>
  
  <!-- Front wheel -->
  <circle cx="350" cy="320" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="350" cy="320" r="5" fill="#333"/>
  
  <!-- Frame tubes -->
  <!-- Bottom bracket to rear axle -->
  <line x1="250" y1="300" x2="150" y2="320" stroke="#C0392B" stroke-width="4"/>
  <!-- Bottom bracket to top of seat tube -->
  <line x1="250" y1="300" x2="230" y2="240" stroke="#C0392B" stroke-width="4"/>
  <!-- Seat tube top to rear axle -->
  <line x1="230" y1="240" x2="150" y2="320" stroke="#C0392B" stroke-width="4"/>
  <!-- Seat tube top to head tube top -->
  <line x1="230" y1="240" x2="310" y2="240" stroke="#C0392B" stroke-width="4"/>
  <!-- Head tube top to front axle -->
  <line x1="310" y1="240" x2="350" y2="320" stroke="#C0392B" stroke-width="4"/>
  <!-- Head tube (fork) -->
  <line x1="310" y1="240" x2="330" y2="280" stroke="#C0392B" stroke-width="4"/>
  <line x1="330" y1="280" x2="350" y2="320" stroke="#C0392B" stroke-width="4"/>
  
  <!-- Seat -->
  <ellipse cx="230" cy="238" rx="12" ry="6" fill="#333"/>
  
  <!-- Handlebars -->
  <line x1="330" y1="280" x2="345" y2="275" stroke="#333" stroke-width="4"/>
  <circle cx="345" cy="275" r="3" fill="#333"/>
  
  <!-- Pedals -->
  <line x1="250" y1="300" x2="265" y2="310" stroke="#333" stroke-width="3"/>
  <rect x="260" y="308" width="12" height="4" fill="#333" rx="1"/>
  <line x1="250" y1="300" x2="235" y2="310" stroke="#333" stroke-width="3"/>
  <rect x="228" y="308" width="12" height="4" fill="#333" rx="1"/>
  
  <!-- Chainring -->
  <circle cx="250" cy="300" r="8" fill="none" stroke="#666" stroke-width="2"/>
  
  <!-- Pelican body -->
  <!-- Body (white ellipse) -->
  <ellipse cx="230" cy="210" rx="50" ry="35" fill="white" stroke="#ccc" stroke-width="2"/>
  
  <!-- Tail -->
  <ellipse cx="185" cy="215" rx="20" ry="12" fill="white" stroke="#ccc" stroke-width="2"/>
  
  <!-- Wings -->
  <path d="M 200 200 Q 220 190 250 205 Q 230 215 210 210 Z" fill="#E8E8E8" stroke="#ccc" stroke-width="1"/>
  
  <!-- Neck -->
  <path d="M 255 195 Q 280 170 295 150" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <path d="M 255 195 Q 280 170 295 150" fill="none" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="298" cy="145" r="12" fill="white" stroke="#ccc" stroke-width="2"/>
  
  <!-- Beak -->
  <path d="M 305 140 L 340 148 Q 345 150 340 155 L 308 152 Z" fill="#F4A460" stroke="#D2691E" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="302" cy="142" r="3" fill="#333"/>
  <circle cx="303" cy="141" r="1" fill="white"/>
  
  <!-- Legs -->
  <!-- Left leg (on pedal) -->
  <line x1="220" y1="245" x2="262" y2="308" stroke="#F4A460" stroke-width="5" stroke-linecap="round"/>
  <!-- Right leg (on pedal) -->
  <line x1="225" y1="245" x2="232" y2="308" stroke="#F4A460" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="264" cy="310" rx="6" ry="3" fill="#F4A460"/>
  <ellipse cx="231" cy="310" rx="6" ry="3" fill="#F4A460"/>
  
  <!-- Sun -->
  <circle cx="450" cy="50" r="30" fill="#FFD700"/>
  <line x1="450" y1="15" x2="450" y2="25" stroke="#FFD700" stroke-width="3"/>
  <line x1="450" y1="75" x2="450" y2="85" stroke="#FFD700" stroke-width="3"/>
  <line x1="420" y1="50" x2="410" y2="50" stroke="#FFD700" stroke-width="3"/>
  <line x1="480" y1="50" x2="490" y2="50" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="60" rx="30" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="80" cy="55" rx="20" ry="12" fill="white" opacity="0.8"/>
  <ellipse cx="120" cy="55" rx="25" ry="13" fill="white" opacity="0.8"/>
  
  <ellipse cx="350" cy="80" rx="25" ry="12" fill="white" opacity="0.8"/>
  <ellipse cx="335" cy="75" rx="18" ry="10" fill="white" opacity="0.8"/>
  <ellipse cx="365" cy="75" rx="20" ry="11" fill="white" opacity="0.8"/>
</svg>