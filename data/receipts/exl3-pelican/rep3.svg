<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="400" height="80" fill="#8B4513"/>
  
  <!-- Bicycle Frame -->
  <!-- Rear wheel -->
  <circle cx="120" cy="280" r="50" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="120" cy="280" r="4" fill="#333"/>
  <!-- Spokes rear -->
  <line x1="120" y1="230" x2="120" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="280" x2="170" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="85" y1="245" x2="155" y2="315" stroke="#333" stroke-width="2"/>
  <line x1="155" y1="245" x2="85" y2="315" stroke="#333" stroke-width="2"/>
  
  <!-- Front wheel -->
  <circle cx="280" cy="280" r="50" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="280" cy="280" r="4" fill="#333"/>
  <!-- Spokes front -->
  <line x1="280" y1="230" x2="280" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="280" x2="330" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="245" y1="245" x2="315" y2="315" stroke="#333" stroke-width="2"/>
  <line x1="315" y1="245" x2="245" y2="315" stroke="#333" stroke-width="2"/>
  
  <!-- Frame -->
  <!-- Bottom bracket to rear wheel -->
  <line x1="180" y1="260" x2="120" y2="280" stroke="#CC3333" stroke-width="6"/>
  <!-- Bottom bracket to seat tube -->
  <line x1="180" y1="260" x2="190" y2="200" stroke="#CC3333" stroke-width="6"/>
  <!-- Seat tube to top tube -->
  <line x1="190" y1="200" x2="260" y2="220" stroke="#CC3333" stroke-width="6"/>
  <!-- Top tube to head tube -->
  <line x1="260" y1="220" x2="280" y2="240" stroke="#CC3333" stroke-width="6"/>
  <!-- Head tube down -->
  <line x1="260" y1="220" x2="280" y2="280" stroke="#CC3333" stroke-width="6"/>
  <!-- Seat tube to seat -->
  <line x1="190" y1="200" x2="185" y2="185" stroke="#CC3333" stroke-width="4"/>
  <!-- Seat -->
  <ellipse cx="185" cy="183" rx="15" ry="5" fill="#333"/>
  
  <!-- Handlebars -->
  <line x1="280" y1="240" x2="290" y2="220" stroke="#333" stroke-width="4"/>
  <line x1="285" y1="220" x2="300" y2="225" stroke="#333" stroke-width="4"/>
  
  <!-- Chainring -->
  <circle cx="180" cy="260" r="12" fill="none" stroke="#333" stroke-width="3"/>
  
  <!-- Pedals -->
  <line x1="180" y1="260" x2="195" y2="270" stroke="#333" stroke-width="3"/>
  <rect x="190" y="268" width="15" height="4" fill="#333"/>
  
  <!-- Pelican body -->
  <!-- Body - white/cream -->
  <ellipse cx="195" cy="175" rx="35" ry="25" fill="#F5F5DC" stroke="#333" stroke-width="2"/>
  
  <!-- Wing -->
  <path d="M 175 165 Q 160 155, 155 170 Q 158 185, 175 180 Z" fill="#DDD" stroke="#333" stroke-width="1.5"/>
  
  <!-- Tail -->
  <path d="M 220 170 Q 240 165, 235 175 Q 230 180, 220 178 Z" fill="#F5F5DC" stroke="#333" stroke-width="1.5"/>
  
  <!-- Neck -->
  <path d="M 220 165 Q 240 140, 235 125" fill="none" stroke="#F5F5DC" stroke-width="12" stroke-linecap="round"/>
  <path d="M 220 165 Q 240 140, 235 125" fill="none" stroke="#333" stroke-width="1" opacity="0"/>
  
  <!-- Head -->
  <ellipse cx="237" cy="120" rx="12" ry="10" fill="#F5F5DC" stroke="#333" stroke-width="2"/>
  
  <!-- Eye -->
  <circle cx="240" cy="117" r="2.5" fill="#333"/>
  <circle cx="241" cy="116" r="1" fill="white"/>
  
  <!-- Beak -->
  <path d="M 248 118 L 270 122 L 248 126 Z" fill="#FF8C00" stroke="#333" stroke-width="1.5"/>
  <!-- Beak pouch -->
  <path d="M 248 122 Q 265 135, 248 128 Z" fill="#FF8C00" stroke="#333" stroke-width="1"/>
  
  <!-- Legs on pedals -->
  <!-- Left leg (visible) -->
  <line x1="195" y1="195" x2="195" y2="268" stroke="#FF8C00" stroke-width="4" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="200" y1="195" x2="193" y2="265" stroke="#FF8C00" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Feet on pedals -->
  <ellipse cx="197" cy="270" rx="8" ry="4" fill="#FF8C00" stroke="#333" stroke-width="1"/>
  
  <!-- Helmet -->
  <path d="M 228 110 Q 237 100, 246 110 Q 245 115, 237 115 Q 229 115, 228 110 Z" fill="#FF4444" stroke="#333" stroke-width="1.5"/>
  
  <!-- Motion lines -->
  <line x1="50" y1="260" x2="80" y2="260" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="40" y1="275" x2="75" y2="275" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="60" y1="290" x2="90" y2="290" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
</svg>