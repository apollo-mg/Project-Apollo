<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Rear Wheel -->
  <circle cx="80" cy="200" r="40" fill="none" stroke="black" stroke-width="3"/>
  <line x1="80" y1="160" x2="80" y2="240" stroke="black" stroke-width="1"/>
  <line x1="40" y1="200" x2="120" y2="200" stroke="black" stroke-width="1"/>

  <!-- Front Wheel -->
  <circle cx="260" cy="200" r="40" fill="none" stroke="black" stroke-width="3"/>
  <line x1="260" y1="160" x2="260" y2="240" stroke="black" stroke-width="1"/>
  <line x1="220" y1="200" x2="300" y2="200" stroke="black" stroke-width="1"/>

  <!-- Bike Frame -->
  <line x1="100" y1="195" x2="100" y2="150" stroke="#d62728" stroke-width="3"/>
  <line x1="100" y1="150" x2="220" y2="150" stroke="#d62728" stroke-width="3"/>
  <line x1="220" y1="150" x2="240" y2="190" stroke="#d62728" stroke-width="3"/>
  <line x1="240" y1="190" x2="150" y2="210" stroke="#d62728" stroke-width="3"/>
  <line x1="150" y1="210" x2="80" y2="200" stroke="#d62728" stroke-width="3"/>

  <!-- Handlebar -->
  <line x1="240" y1="190" x2="240" y2="130" stroke="#d62728" stroke-width="3"/>
  <line x1="240" y1="130" x2="180" y2="130" stroke="#d62728" stroke-width="3"/>

  <!-- Seat -->
  <ellipse cx="100" cy="145" rx="12" ry="6" fill="#333"/>

  <!-- Crank / Pedal -->
  <circle cx="150" cy="210" r="6" fill="#333"/>

  <!-- Chain -->
  <path d="M 80 195 Q 150 210 260 195" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Pelican Body -->
  <ellipse cx="150" cy="190" rx="42" ry="26" fill="white"/>

  <!-- Wing -->
  <ellipse cx="160" cy="192" rx="22" ry="16" fill="#E6E6E6"/>

  <!-- Tail -->
  <path d="M 115 205 L 105 215 L 125 210 Z" fill="white"/>

  <!-- Neck -->
  <path d="M 170 180 Q 185 170 200 175" fill="none" stroke="white" stroke-width="13" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="200" cy="175" r="18" fill="white"/>

  <!-- Beak Upper -->
  <path d="M 215 172 L 285 162 L 295 178 L 215 192 Z" fill="#FFA500"/>

  <!-- Beak Lower / Pouch -->
  <path d="M 215 192 L 285 198 L 295 225 L 215 215 Z" fill="#FFD700"/>

  <!-- Eye -->
  <circle cx="216" cy="170" r="3" fill="black"/>

  <!-- Legs -->
  <line x1="135" y1="212" x2="140" y2="208" stroke="#FFA500" stroke-width="3"/>
  <line x1="155" y1="212" x2="150" y2="208" stroke="#FFA500" stroke-width="3"/>

  <!-- Feet -->
  <circle cx="140" cy="208" r="3" fill="#FFA500"/>
  <circle cx="150" cy="208" r="3" fill="#FFA500"/>
</svg>