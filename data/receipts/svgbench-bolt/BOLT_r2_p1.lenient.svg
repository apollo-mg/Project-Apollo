<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white" />

  <!-- Bicycle Wheels -->
  <circle cx="100" cy="220" r="35" fill="none" stroke="#333" stroke-width="4" />
  <circle cx="300" cy="220" r="35" fill="none" stroke="#333" stroke-width="4" />
  
  <!-- Wheel Hubs -->
  <circle cx="100" cy="220" r="5" fill="#333" />
  <circle cx="300" cy="220" r="5" fill="#333" />

  <!-- Bicycle Frame -->
  <path d="M 100 185 L 200 150 L 300 185" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" />
  <path d="M 200 150 L 200 200" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" /> <!-- Seat post -->
  
  <!-- Seat -->
  <rect x="190" y="140" width="20" height="10" rx="5" fill="#555" />
  
  <!-- Handlebar -->
  <line x1="100" y1="185" x2="130" stroke="#333" stroke-width="4" stroke-linecap="round" />

  <!-- Pelican Body -->
  <ellipse cx="210" cy="150" rx="55" ry="35" fill="#D3D3D3" />
  <!-- Belly White -->
  <ellipse cx="210" cy="160" rx="30" ry="25" fill="white" />
  
  <!-- Wing Detail -->
  <path d="M 180 145 Q 200 130 230 145" fill="none" stroke="#B0B0B0" stroke-width="2" />

  <!-- Pelican Neck -->
  <path d="M 170 140 Q 150 120 150 110" fill="none" stroke="#D3D3D3" stroke-width="25" stroke-linecap="round" />

  <!-- Pelican Head -->
  <circle cx="150" cy="110" r="22" fill="#D3D3D3" />
  
  <!-- Eye -->
  <circle cx="140" cy="105" r="4" fill="black" />
  <circle cx="142" cy="103" r="1.5" fill="white" />

  <!-- Beak (Upper) -->
  <path d="M 130 110 L 80 100 L 90 125 Z" fill="#FFD700" stroke="#DAA520" stroke-width="1" />
  
  <!-- Beak (Lower Pouch) -->
  <path d="M 130 125 L 85 135 L 100 140 Z" fill="#FFD700" stroke="#DAA520" stroke-width="1" />
  <!-- Beak Line -->
  <line x1="130" y1="110" x2="130" y2="125" stroke="#DAA520" stroke-width="1" />

  <!-- Pelican Feet (on handlebars) -->
  <circle cx="125" cy="185" r="6" fill="#FFD700" />
  <circle cx="135" cy="185" r="6" fill="#FFD700" />

</svg>