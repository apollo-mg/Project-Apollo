<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="210" cy="265" rx="90" ry="18" fill="#eee" opacity="0.6"/>
  
  <!-- Bicycle Wheels -->
  <circle cx="130" cy="220" r="42" stroke="#333" stroke-width="4" fill="none"/>
  <circle cx="290" cy="220" r="42" stroke="#333" stroke-width="4" fill="none"/>
  <circle cx="130" cy="220" r="32" stroke="#666" stroke-width="2" fill="none"/>
  <circle cx="290" cy="220" r="32" stroke="#666" stroke-width="2" fill="none"/>
  
  <!-- Bicycle Frame -->
  <path d="M 130 220 L 170 200 L 220 180 L 270 165 L 290 220" stroke="#333" stroke-width="4" fill="none"/>
  <line x1="130" y1="220" x2="170" y2="200" stroke="#333" stroke-width="3"/>
  
  <!-- Seat -->
  <line x1="220" y1="180" x2="220" y2="155" stroke="#333" stroke-width="3"/>
  <ellipse cx="220" cy="150" rx="18" ry="9" fill="#666"/>
  
  <!-- Handlebar -->
  <line x1="270" y1="165" x2="330" stroke="#333" stroke-width="4"/>
  <circle cx="330" cy="155" r="8" fill="#333"/>
  
  <!-- Crank and Pedals -->
  <circle cx="170" cy="200" r="9" fill="#333"/>
  <line x1="170" y1="200" x2="145" y2="225" stroke="#333" stroke-width="3"/>
  <line x1="170" y1="200" x2="195" y2="175" stroke="#333" stroke-width="3"/>
  
  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="215" cy="185" rx="52" ry="34" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Wing -->
  <path d="M 170 195 Q 140 210 175 230 Q 210 210 220 195" fill="#eee" stroke="#333" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="265" cy="165" r="26" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Eye -->
  <circle cx="270" cy="160" r="5" fill="black"/>
  <circle cx="273" cy="158" r="2" fill="white"/>
  
  <!-- Beak -->
  <path d="M 282 162 L 360 150 L 370 185 L 340 195 L 292 190 Z" fill="#ffcc00" stroke="#333" stroke-width="2"/>
  
  <!-- Neck -->
  <path d="M 245 182 Q 255 175 260 170" stroke="#333" stroke-width="3" fill="none"/>
  
  <!-- Legs -->
  <line x1="200" y1="218" x2="150" y2="230" stroke="#333" stroke-width="3"/>
  <line x1="230" y1="218" x2="200" y2="185" stroke="#333" stroke-width="3"/>
  
  <!-- Feet -->
  <circle cx="150" cy="230" r="6" fill="#333"/>
  <circle cx="200" cy="185" r="6" fill="#333"/>
</svg>