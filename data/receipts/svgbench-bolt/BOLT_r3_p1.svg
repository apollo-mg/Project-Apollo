<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0f8ff"/>
  
  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="110" cy="290" r="40" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="110" cy="290" r="8" fill="#eee"/>
  
  <!-- Front wheel -->
  <circle cx="210" cy="290" r="40" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="210" cy="290" r="8" fill="#eee"/>
  
  <!-- Frame -->
  <path d="M 110 250 L 125 210 L 205 230 L 170 275 Z" 
        fill="none" stroke="#2c3e50" stroke-width="4" 
        stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Handlebar -->
  <line x1="210" y1="250" x2="240" y2="240" stroke="#2c3e50" stroke-width="3"/>
  <line x1="210" y1="250" x2="190" y2="245" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Seat -->
  <ellipse cx="125" cy="205" rx="15" ry="8" fill="#2c3e50"/>
  
  <!-- Crank -->
  <circle cx="170" cy="275" r="8" fill="#2c3e50"/>
  
  <!-- Pedals -->
  <line x1="170" y1="275" x2="150" y2="295" stroke="#2c3e50" stroke-width="3"/>
  <line x1="170" y1="275" x2="190" y2="255" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Chain -->
  <line x1="170" y1="285" x2="110" y2="285" stroke="#555" stroke-width="2"/>
  
  <!-- Pelican -->
  <!-- Tail -->
  <path d="M 110 200 Q 90 200 100 230" 
        fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Body -->
  <ellipse cx="150" cy="200" rx="40" ry="30" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Wing -->
  <path d="M 120 200 Q 100 190 110 220" 
        fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="190" cy="185" r="22" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Eye -->
  <circle cx="200" cy="178" r="4" fill="black"/>
  <circle cx="200" cy="178" r="1.5" fill="white"/>
  
  <!-- Beak (upper) -->
  <path d="M 212 185 L 265 170 L 255 190 L 212 190 Z" 
        fill="#fde08a" stroke="#333" stroke-width="2"/>
  
  <!-- Beak (lower pouch) -->
  <path d="M 212 190 Q 240 215 255 200 L 212 195 Z" 
        fill="#ffcc00" stroke="#333" stroke-width="2"/>
  
  <!-- Beak detail line -->
  <line x1="212" y1="185" x2="212" y2="195" stroke="#333" stroke-width="1"/>
  
  <!-- Legs -->
  <line x1="145" y1="220" x2="150" y2="290" stroke="#ff8c00" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="220" x2="190" y2="255" stroke="#ff8c00" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Feet -->
  <circle cx="150" cy="290" r="4" fill="#ff8c00"/>
  <circle cx="190" cy="255" r="4" fill="#ff8c00"/>
</svg>