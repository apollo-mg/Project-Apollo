<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#cfeafc"/>
  <circle cx="690" cy="80" r="45" fill="#ffd93b"/>
  <ellipse cx="180" cy="90" rx="60" ry="22" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="240" cy="75" rx="45" ry="18" fill="#ffffff" opacity="0.9"/>
  <rect y="505" width="800" height="95" fill="#95cf6a"/>
  <rect y="498" width="800" height="10" fill="#7fb855"/>

  <!-- ================= BICYCLE ================= -->
  <!-- Rear wheel -->
  <circle cx="180" cy="420" r="90" fill="none" stroke="#333" stroke-width="10"/>
  <circle cx="180" cy="420" r="82" fill="none" stroke="#888" stroke-width="3"/>
  <g stroke="#999" stroke-width="2.5">
    <line x1="180" y1="340" x2="180" y2="500"/>
    <line x1="100" y1="420" x2="260" y2="420"/>
    <line x1="124" y1="364" x2="236" y2="476"/>
    <line x1="236" y1="364" x2="124" y2="476"/>
  </g>
  <circle cx="180" cy="420" r="10" fill="#555"/>

  <!-- Front wheel -->
  <circle cx="560" cy="420" r="90" fill="none" stroke="#333" stroke-width="10"/>
  <circle cx="560" cy="420" r="82" fill="none" stroke="#888" stroke-width="3"/>
  <g stroke="#999" stroke-width="2.5">
    <line x1="560" y1="340" x2="560" y2="500"/>
    <line x1="480" y1="420" x2="640" y2="420"/>
    <line x1="504" y1="364" x2="616" y2="476"/>
    <line x1="616" y1="364" x2="504" y2="476"/>
  </g>
  <circle cx="560" cy="420" r="10" fill="#555"/>

  <!-- Chain -->
  <line x1="180" y1="420" x2="340" y2="420" stroke="#777" stroke-width="5"/>

  <!-- Frame (fork now meets top/down tube at y=300) -->
  <g stroke="#d84a4a" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="180" y1="420" x2="340" y2="420"/>  <!-- chainstay -->
    <line x1="180" y1="420" x2="300" y2="290"/>  <!-- seat stay -->
    <line x1="340" y1="420" x2="300" y2="290"/>  <!-- seat tube -->
    <line x1="340" y1="420" x2="495" y2="300"/>  <!-- down tube -->
    <line x1="300" y1="290" x2="495" y2="300"/>  <!-- top tube -->
    <line x1="495" y1="300" x2="560" y2="420"/>  <!-- fork -->
    <line x1="495" y1="300" x2="482" y2="252"/>  <!-- head tube / stem -->
  </g>

  <!-- Handlebars -->
  <path d="M 482 252 L 452 258 Q 440 260 436 272" fill="none" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  <circle cx="436" cy="272" r="7" fill="#222"/>

  <!-- Seat post and saddle -->
  <line x1="300" y1="290" x2="300" y2="270" stroke="#444" stroke-width="8"/>
  <rect x="264" y="260" width="76" height="15" rx="7" fill="#333"/>

  <!-- Crank, chainring and pedals -->
  <circle cx="340" cy="420" r="16" fill="none" stroke="#555" stroke-width="5"/>
  <line x1="340" y1="420" x2="313" y2="448" stroke="#444" stroke-width="6"/>
  <line x1="340" y1="420" x2="367" y2="400" stroke="#444" stroke-width="6"/>
  <rect x="293" y="446" width="38" height="10" rx="3" fill="#222"/>
  <rect x="350" y="396" width="38" height="10" rx="3" fill="#222"/>

  <!-- ================= PELICAN ================= -->
  <!-- Legs (paddles reaching to pedals) -->
  <g stroke="#f2a03c" stroke-width="13" stroke-linecap="round">
    <line x1="305" y1="255" x2="312" y2="446"/>
    <line x1="330" y1="250" x2="366" y2="400"/>
  </g>

  <!-- Tail -->
  <path d="M 232 200 L 186 178 L 204 228 Z" fill="#efe3cd" stroke="#d8c9a8" stroke-width="3"/>

  <!-- Body -->
  <ellipse cx="300" cy="213" rx="88" ry="62" fill="#fdf6ec" stroke="#d8c9a8" stroke-width="4"/>

  <!-- Wing (feathered, resting on body) -->
  <path d="M 245 198 Q 298 162 355 196 Q 335 248 268 252 Q 232 230 245 198 Z"
        fill="#efe3cd" stroke="#d8c9a8" stroke-width="3"/>

  <!-- Wing-arm reaching forward to grip handlebars -->
  <path d="M 352 192 Q 395 178 425 220 Q 438 248 436 268
           L 430 272 Q 415 268 405 245 Q 385 210 352 208 Z"
        fill="#efe3cd" stroke="#d8c9a8" stroke-width="3"/>

  <!-- Neck (S-curve, drawn as thick stroked path) -->
  <path d="M 358 185 Q 375 155 388 130 Q 400 108 402 82"
        fill="none" stroke="#d8c9a8" stroke-width="22" stroke-linecap="round"/>
  <path d="M 358 185 Q 375 155 388 130 Q 400 108 402 82"
        fill="none" stroke="#fdf6ec" stroke-width="17" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="404" cy="78" r="27" fill="#fdf6ec" stroke="#d8c9a8" stroke-width="4"/>

  <!-- Beak -->
  <path d="M 422 72 L 548 90 L 422 104 Z" fill="#f2a03c" stroke="#d1822a" stroke-width="3"/>
  <!-- Pouch -->
  <path d="M 420 100 Q 480 152 546 100 Z" fill="#e8892f" stroke="#d1822a" stroke-width="3"/>

  <!-- Eye -->
  <circle cx="410" cy="72" r="5" fill="#222"/>
  <circle cx="412" cy="70" r="1.6" fill="#fff"/>

  <!-- Cheek blush -->
  <ellipse cx="418" cy="88" rx="7" ry="4.5" fill="#f7c8b0" opacity="0.8"/>
</svg>