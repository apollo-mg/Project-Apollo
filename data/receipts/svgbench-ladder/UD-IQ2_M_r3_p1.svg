<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Sky -->
  <rect width="800" height="500" fill="#DFF2FF"/>

  <!-- Ground -->
  <line x1="60" y1="455" x2="740" y2="455" stroke="#9AA5A1" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== Bicycle ===== -->
  <!-- Wheels -->
  <g stroke="#333" stroke-width="8" fill="none">
    <circle cx="240" cy="390" r="65"/>
    <circle cx="560" cy="390" r="65"/>
  </g>
  <!-- Spokes -->
  <g stroke="#666" stroke-width="3">
    <line x1="240" y1="325" x2="240" y2="455"/>
    <line x1="175" y1="390" x2="305" y2="390"/>
    <line x1="195" y1="345" x2="285" y2="435"/>
    <line x1="285" y1="345" x2="195" y2="435"/>
    <line x1="560" y1="325" x2="560" y2="455"/>
    <line x1="495" y1="390" x2="625" y2="390"/>
    <line x1="515" y1="345" x2="605" y2="435"/>
    <line x1="605" y1="345" x2="515" y2="435"/>
  </g>
  <!-- Hubs -->
  <circle cx="240" cy="390" r="9" fill="#333"/>
  <circle cx="560" cy="390" r="9" fill="#333"/>

  <!-- Frame -->
  <g stroke="#D62828" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M240 390 L400 390 L360 275 Z"/>
    <path d="M360 275 L530 270"/>
    <path d="M400 390 L530 270"/>
    <path d="M530 270 L560 390"/>
  </g>

  <!-- Seat post and saddle -->
  <line x1="355" y1="268" x2="350" y2="252" stroke="#333" stroke-width="6"/>
  <ellipse cx="347" cy="250" rx="22" ry="8" fill="#333"/>

  <!-- Handlebar -->
  <path d="M530 270 L528 245 Q 528 234 542 234" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Crank, pedal arm and pedal -->
  <circle cx="400" cy="390" r="14" fill="#444"/>
  <line x1="400" y1="390" x2="414" y2="399" stroke="#333" stroke-width="6"/>
  <line x1="402" y1="399" x2="428" y2="399" stroke="#222" stroke-width="5"/>

  <!-- ===== Pelican ===== -->
  <!-- Tail -->
  <polygon points="285,200 250,180 288,225" fill="#FDF3E7"/>

  <!-- Body -->
  <ellipse cx="345" cy="215" rx="62" ry="48" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>

  <!-- Wing -->
  <path d="M300 200 Q 355 185 400 215 Q 360 245 300 228 Z" fill="#B8C4CC"/>

  <!-- Neck -->
  <path d="M365 200 Q 372 150 388 132 L 408 142 Q 398 165 392 205 Z" fill="#FFFFFF"/>

  <!-- Head -->
  <circle cx="395" cy="115" r="30" fill="#FFFFFF"/>

  <!-- Upper beak -->
  <polygon points="413,105 540,120 415,120" fill="#F4A261"/>
  <!-- Beak pouch -->
  <path d="M540 120 C 500 170 440 170 415 120 Z" fill="#E76F51"/>

  <!-- Eye -->
  <circle cx="390" cy="108" r="6" fill="#111"/>
  <circle cx="392" cy="106" r="2" fill="#FFF"/>

  <!-- Arm reaching to handlebar -->
  <path d="M380 190 Q 450 228 518 240" stroke="#F4A261" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="520" cy="240" r="7" fill="#E76F51"/>

  <!-- Leg to pedal -->
  <path d="M355 255 L 395 335 L 405 390" stroke="#E76F51" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Webbed foot on pedal -->
  <ellipse cx="408" cy="394" rx="18" ry="7" fill="#E76F51"/>
</svg>