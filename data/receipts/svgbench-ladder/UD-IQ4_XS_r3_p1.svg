<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>

  <!-- background -->
  <rect width="800" height="600" fill="#EAF6FB"/>
  <!-- ground -->
  <line x1="60" y1="542" x2="740" y2="542" stroke="#B8C7CF" stroke-width="4"/>

  <!-- ================= WHEELS ================= -->
  <!-- rear wheel -->
  <g stroke="#4A4A4A" fill="none">
    <circle cx="250" cy="450" r="90" stroke-width="8"/>
    <circle cx="250" cy="450" r="78" stroke-width="3"/>
    <g stroke-width="2">
      <line x1="250" y1="360" x2="250" y2="540"/>
      <line x1="160" y1="450" x2="340" y2="450"/>
      <line x1="186" y1="386" x2="314" y2="514"/>
      <line x1="314" y1="386" x2="186" y2="514"/>
    </g>
    <circle cx="250" cy="450" r="8" fill="#4A4A4A" stroke="none"/>
  </g>
  <!-- front wheel -->
  <g stroke="#4A4A4A" fill="none">
    <circle cx="550" cy="450" r="90" stroke-width="8"/>
    <circle cx="550" cy="450" r="78" stroke-width="3"/>
    <g stroke-width="2">
      <line x1="550" y1="360" x2="550" y2="540"/>
      <line x1="460" y1="450" x2="640" y2="450"/>
      <line x1="486" y1="386" x2="614" y2="514"/>
      <line x1="614" y1="386" x2="486" y2="514"/>
    </g>
    <circle cx="550" cy="450" r="8" fill="#4A4A4A" stroke="none"/>
  </g>

  <!-- ================= FRAME ================= -->
  <g stroke="#D93B2B" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="250" y1="450" x2="400" y2="450"/> <!-- chainstay -->
    <line x1="250" y1="450" x2="355" y2="332"/> <!-- seatstay -->
    <line x1="400" y1="450" x2="355" y2="332"/> <!-- seat tube -->
    <line x1="400" y1="450" x2="530" y2="352"/> <!-- down tube -->
    <line x1="355" y1="332" x2="530" y2="352"/> <!-- top tube -->
    <line x1="550" y1="450" x2="530" y2="352"/> <!-- fork -->
    <line x1="530" y1="352" x2="539" y2="316"/> <!-- stem -->
  </g>
  <!-- handlebar -->
  <path d="M 539 316 Q 539 296 508 300" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <!-- saddle -->
  <line x1="322" y1="320" x2="380" y2="320" stroke="#333" stroke-width="11" stroke-linecap="round"/>
  <!-- crank and pedals -->
  <line x1="372" y1="480" x2="428" y2="420" stroke="#666" stroke-width="6"/>
  <circle cx="400" cy="450" r="9" fill="#666"/>
  <rect x="352" y="475" width="38" height="10" rx="3" fill="#333"/>
  <rect x="409" y="415" width="38" height="10" rx="3" fill="#333"/>

  <!-- ================= PELICAN ================= -->
  <!-- legs (behind body) -->
  <g stroke="#F5A623" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="340" y1="290" x2="372" y2="472"/>
    <line x1="330" y1="292" x2="428" y2="412"/>
  </g>
  <!-- feet -->
  <g stroke="#F5A623" stroke-width="9" stroke-linecap="round">
    <line x1="358" y1="476" x2="390" y2="476"/>
    <line x1="414" y1="416" x2="446" y2="416"/>
  </g>

  <!-- tail -->
  <path d="M 235 230 L 175 214 L 202 258 L 238 264 Z" fill="#CFC8BC"/>
  <!-- body -->
  <ellipse cx="318" cy="248" rx="96" ry="62" fill="#E8E4DC"/>
  <!-- neck -->
  <path d="M 380 238 C 428 232 442 200 445 162 C 446 142 448 132 451 122"
        fill="none" stroke="#E8E4DC" stroke-width="26" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="452" cy="118" r="23" fill="#E8E4DC"/>
  <!-- pouch -->
  <path d="M 583 146 Q 548 205 482 199 Q 462 196 462 170 L 462 146 Z" fill="#E8871A"/>
  <!-- upper beak -->
  <path d="M 466 103 Q 540 112 585 138 L 587 150 L 466 142 Z" fill="#F5A623"/>
  <!-- beak mouth line -->
  <line x1="468" y1="140" x2="583" y2="146" stroke="#C96E12" stroke-width="3"/>
  <!-- eye -->
  <circle cx="448" cy="110" r="7" fill="#FFFFFF"/>
  <circle cx="450" cy="110" r="3.5" fill="#222"/>
  <!-- wing reaching to the handlebars -->
  <path d="M 312 214 C 392 202 462 244 502 300 C 508 310 498 320 488 313
           C 442 276 382 252 318 248 C 306 245 304 217 312 214 Z" fill="#CFC8BC"/>
</svg>