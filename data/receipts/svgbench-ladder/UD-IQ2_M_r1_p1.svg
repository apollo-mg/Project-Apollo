<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- ground -->
  <line x1="30" y1="277" x2="370" y2="277" stroke="#cfc9c0" stroke-width="4" stroke-linecap="round"/>

  <!-- wheels -->
  <g stroke="#37474f" stroke-width="2">
    <line x1="65" y1="230" x2="155" y2="230"/>
    <line x1="87.5" y1="191" x2="132.5" y2="269"/>
    <line x1="132.5" y1="191" x2="87.5" y2="269"/>
    <line x1="245" y1="230" x2="335" y2="230"/>
    <line x1="267.5" y1="191" x2="312.5" y2="269"/>
    <line x1="312.5" y1="191" x2="267.5" y2="269"/>
  </g>
  <circle cx="110" cy="230" r="45" fill="none" stroke="#37474f" stroke-width="6"/>
  <circle cx="290" cy="230" r="45" fill="none" stroke="#37474f" stroke-width="6"/>
  <circle cx="110" cy="230" r="5" fill="#37474f"/>
  <circle cx="290" cy="230" r="5" fill="#37474f"/>

  <!-- frame -->
  <g stroke="#e15554" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M110 230 L148 138 L190 225 Z"/>
    <path d="M190 225 L272 148"/>
    <path d="M290 230 L272 148"/>
    <path d="M272 148 L266 118"/>
    <path d="M266 118 Q250 112 244 122"/>
  </g>
  <line x1="150" y1="156" x2="148" y2="138" stroke="#37474f" stroke-width="5"/>
  <ellipse cx="148" cy="134" rx="14" ry="6" fill="#37474f"/>

  <!-- crank and pedals -->
  <circle cx="190" cy="225" r="9" fill="#37474f"/>
  <line x1="190" y1="225" x2="202" y2="212" stroke="#37474f" stroke-width="5"/>
  <line x1="190" y1="225" x2="178" y2="237" stroke="#37474f" stroke-width="5"/>
  <rect x="194" y="208" width="17" height="6" rx="2" fill="#37474f"/>
  <rect x="170" y="232" width="17" height="6" rx="2" fill="#37474f"/>

  <!-- pelican far leg -->
  <path d="M168 128 L178 232" stroke="#5a4634" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M168 228 L194 234 L176 242 Z" fill="#5a4634"/>

  <!-- pelican body -->
  <path d="M110 118 L80 108 L104 134 Z" fill="#fdf6e3" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="165" cy="100" rx="58" ry="42" fill="#fdf6e3" stroke="#333" stroke-width="2.5"/>

  <!-- pelican near leg -->
  <path d="M182 130 L198 210" stroke="#5a4634" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M190 205 L216 211 L198 217 Z" fill="#5a4634"/>

  <!-- wing reaching to the handlebars -->
  <path d="M195 82 Q250 70 262 116 L246 123 Q235 88 188 100 Z" fill="#f3ede4" stroke="#333" stroke-width="2.5"/>

  <!-- neck -->
  <path d="M205 92 Q235 80 243 52" stroke="#333" stroke-width="29" fill="none" stroke-linecap="round"/>
  <path d="M205 92 Q235 80 243 52" stroke="#fdf6e3" stroke-width="24" fill="none" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="248" cy="50" r="17" fill="#fdf6e3" stroke="#333" stroke-width="2.5"/>

  <!-- beak and pouch -->
  <path d="M254 52 L320 55 Q285 92 236 74 Q250 62 254 52 Z" fill="#f6a13b" stroke="#333" stroke-width="2.5"/>
  <path d="M256 40 L352 50 Q356 54 352 56 L258 52 Z" fill="#f6a13b" stroke="#333" stroke-width="2.5"/>

  <!-- eye -->
  <circle cx="250" cy="43" r="3.5" fill="#333"/>
</svg>