<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky -->
  <rect width="800" height="600" fill="#a8d8f0"/>

  <!-- Sun -->
  <circle cx="710" cy="75" r="36" fill="#ffd54d"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.88">
    <ellipse cx="120" cy="88" rx="44" ry="17"/>
    <ellipse cx="158" cy="80" rx="34" ry="14"/>
    <ellipse cx="610" cy="60" rx="40" ry="16"/>
    <ellipse cx="648" cy="68" rx="30" ry="13"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#7aa86a"/>
  <rect x="0" y="517" width="800" height="5" fill="#5a5a5a"/>

  <!-- ============ BICYCLE ============ -->
  <!-- Rear wheel -->
  <circle cx="260" cy="450" r="65" fill="none" stroke="#333" stroke-width="9"/>
  <circle cx="260" cy="450" r="57" fill="none" stroke="#888" stroke-width="2.5"/>
  <g stroke="#666" stroke-width="2.5">
    <line x1="260" y1="450" x2="260" y2="383"/>
    <line x1="260" y1="450" x2="327" y2="450"/>
    <line x1="260" y1="450" x2="193" y2="450"/>
    <line x1="260" y1="450" x2="260" y2="517"/>
    <line x1="260" y1="450" x2="308" y2="402"/>
    <line x1="260" y1="450" x2="308" y2="498"/>
    <line x1="260" y1="450" x2="212" y2="402"/>
    <line x1="260" y1="450" x2="212" y2="498"/>
  </g>
  <circle cx="260" cy="450" r="5" fill="#333"/>

  <!-- Front wheel -->
  <circle cx="560" cy="450" r="65" fill="none" stroke="#333" stroke-width="9"/>
  <circle cx="560" cy="450" r="57" fill="none" stroke="#888" stroke-width="2.5"/>
  <g stroke="#666" stroke-width="2.5">
    <line x1="560" y1="450" x2="560" y2="383"/>
    <line x1="560" y1="450" x2="627" y2="450"/>
    <line x1="560" y1="450" x2="493" y2="450"/>
    <line x1="560" y1="450" x2="560" y2="517"/>
    <line x1="560" y1="450" x2="608" y2="402"/>
    <line x1="560" y1="450" x2="608" y2="498"/>
    <line x1="560" y1="450" x2="512" y2="402"/>
    <line x1="560" y1="450" x2="512" y2="498"/>
  </g>
  <circle cx="560" cy="450" r="5" fill="#333"/>

  <!-- Frame -->
  <g stroke="#cc2222" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="260" y1="450" x2="395" y2="450"/>
    <line x1="260" y1="450" x2="340" y2="308"/>
    <line x1="395" y1="450" x2="340" y2="308"/>
    <line x1="340" y1="308" x2="510" y2="308"/>
    <line x1="395" y1="450" x2="510" y2="308"/>
    <line x1="510" y1="308" x2="560" y2="450"/>
  </g>

  <!-- Handlebar -->
  <path d="M510 308 Q516 292 532 282 Q542 276 546 284"
        fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>

  <!-- Saddle -->
  <ellipse cx="336" cy="300" rx="26" ry="10" fill="#222" transform="rotate(-5 336 300)"/>

  <!-- Crank & pedals -->
  <line x1="395" y1="450" x2="395" y2="478" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <line x1="395" y1="450" x2="375" y2="430" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <rect x="384" y="474" width="22" height="7" rx="2" fill="#444"/>
  <rect x="363" y="426" width="22" height="7" rx="2" fill="#444"/>

  <!-- ============ PELICAN ============ -->
  <!-- Tail feathers -->
  <polygon points="295,255 258,282 302,288" fill="#e5e0d4"/>

  <!-- Body (pear-shape) -->
  <ellipse cx="360" cy="228" rx="70" ry="50" fill="#fafaf5"/>

  <!-- Wing fold -->
  <ellipse cx="342" cy="238" rx="42" ry="32" fill="#ddd9cc" transform="rotate(-14 342 238)"/>

  <!-- Legs (orange) -->
  <path d="M378 272 L385 345 L395 475"
        fill="none" stroke="#e89030" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 278 L425 335 L378 432"
        fill="none" stroke="#e89030" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Webbed feet on pedals -->
  <ellipse cx="396" cy="477" rx="15" ry="6" fill="#e89030"/>
  <ellipse cx="377" cy="432" rx="13" ry="6" fill="#e89030"/>

  <!-- Neck -->
  <path d="M405 210 Q435 178 450 158"
        fill="none" stroke="#fafaf5" stroke-width="22" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="456" cy="150" r="28" fill="#fafaf5"/>

  <!-- Upper beak (long, pointed) -->
  <path d="M468 140 L600 148 L468 154 Z" fill="#f0a030"/>

  <!-- Throat pouch (defining pelican feature) -->
  <path d="M466 154 L595 150 Q588 202 518 214 Q474 210 466 154 Z" fill="#e07820"/>

  <!-- Eye -->
  <circle cx="462" cy="140" r="4" fill="#111"/>

  <!-- Forelimb gripping handlebar -->
  <path d="M432 192 Q465 220 534 282"
        fill="none" stroke="#fafaf5" stroke-width="14" stroke-linecap="round"/>
  <circle cx="535" cy="284" r="9" fill="#8a9098"/>

  <!-- Motion lines -->
  <g stroke="#7cb8e0" stroke-width="3.5" stroke-linecap="round">
    <line x1="100" y1="435" x2="172" y2="435"/>
    <line x1="88"  y1="462" x2="162" y2="462"/>
  </g>
</svg>