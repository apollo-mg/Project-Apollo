<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky -->
  <rect width="800" height="600" fill="#7EC8E3"/>

  <!-- Sun -->
  <circle cx="720" cy="65" r="42" fill="#FFD700"/>

  <!-- Clouds -->
  <g fill="#ffffff">
    <ellipse cx="130" cy="75" rx="55" ry="20"/>
    <ellipse cx="175" cy="65" rx="40" ry="15"/>
    <ellipse cx="620" cy="50" rx="48" ry="17"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="510" width="800" height="90" fill="#3E7B27"/>
  <rect x="0" y="506" width="800" height="8" fill="#2a2a2a"/>

  <!-- === BICYCLE === -->
  <!-- Rear wheel -->
  <circle cx="250" cy="435" r="72" fill="none" stroke="#1a1a1a" stroke-width="14"/>
  <g stroke="#555" stroke-width="3">
    <line x1="250" y1="435" x2="250" y2="363"/>
    <line x1="250" y1="435" x2="322" y2="435"/>
    <line x1="250" y1="435" x2="178" y2="435"/>
    <line x1="250" y1="435" x2="250" y2="507"/>
    <line x1="250" y1="435" x2="301" y2="384"/>
    <line x1="250" y1="435" x2="301" y2="486"/>
    <line x1="250" y1="435" x2="199" y2="384"/>
    <line x1="250" y1="435" x2="199" y2="486"/>
  </g>
  <circle cx="250" cy="435" r="9" fill="#1a1a1a"/>

  <!-- Front wheel -->
  <circle cx="555" cy="435" r="72" fill="none" stroke="#1a1a1a" stroke-width="14"/>
  <g stroke="#555" stroke-width="3">
    <line x1="555" y1="435" x2="555" y2="363"/>
    <line x1="555" y1="435" x2="627" y2="435"/>
    <line x1="555" y1="435" x2="483" y2="435"/>
    <line x1="555" y1="435" x2="555" y2="507"/>
    <line x1="555" y1="435" x2="606" y2="384"/>
    <line x1="555" y1="435" x2="606" y2="486"/>
    <line x1="555" y1="435" x2="504" y2="384"/>
    <line x1="555" y1="435" x2="504" y2="486"/>
  </g>
  <circle cx="555" cy="435" r="9" fill="#1a1a1a"/>

  <!-- Frame -->
  <g stroke="#CC1111" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="250" y1="435" x2="400" y2="435"/>
    <line x1="250" y1="435" x2="325" y2="280"/>
    <line x1="400" y1="435" x2="325" y2="280"/>
    <line x1="325" y1="280" x2="505" y2="280"/>
    <line x1="400" y1="435" x2="505" y2="280"/>
    <line x1="505" y1="280" x2="555" y2="435"/>
  </g>

  <!-- Handlebar -->
  <path d="M505 280 Q515 262 532 252 Q542 246 548 256"
        fill="none" stroke="#333" stroke-width="9" stroke-linecap="round"/>

  <!-- Saddle -->
  <ellipse cx="320" cy="272" rx="30" ry="13" fill="#1a1a1a"/>

  <!-- Crank & pedals -->
  <line x1="400" y1="435" x2="400" y2="468" stroke="#333" stroke-width="8"/>
  <rect x="382" y="464" width="36" height="10" rx="3" fill="#333"/>
  <line x1="400" y1="435" x2="372" y2="408" stroke="#333" stroke-width="8"/>
  <rect x="354" y="404" width="36" height="10" rx="3" fill="#333"/>

  <!-- === PELICAN === -->
  <!-- Tail feathers -->
  <polygon points="275,238 230,268 290,272" fill="#e2ddd0"/>

  <!-- Body -->
  <ellipse cx="355" cy="210" rx="82" ry="58" fill="#f9f9f2"/>

  <!-- Wing fold -->
  <ellipse cx="332" cy="222" rx="48" ry="38" fill="#d8d3c5" transform="rotate(-12 332 222)"/>

  <!-- Legs (orange) -->
  <path d="M372 262 L382 355 L400 465"
        fill="none" stroke="#E07C00" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 268 L435 340 L375 408"
        fill="none" stroke="#E07C00" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Webbed feet on pedals -->
  <ellipse cx="400" cy="466" rx="20" ry="8" fill="#E07C00"/>
  <ellipse cx="375" cy="408" rx="18" ry="8" fill="#E07C00"/>

  <!-- Neck -->
  <path d="M408 198 Q442 162 458 132"
        fill="none" stroke="#f9f9f2" stroke-width="28" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="462" cy="125" r="34" fill="#f9f9f2"/>

  <!-- Upper beak -->
  <path d="M480 115 L630 122 L480 132 Z" fill="#FF8C00"/>

  <!-- Throat pouch (gular pouch – key pelican trait) -->
  <path d="M480 132 L620 126 Q610 192 530 205 Q488 198 480 132 Z" fill="#CC5500"/>

  <!-- Eye -->
  <circle cx="468" cy="115" r="6" fill="#111"/>

  <!-- Forelimb gripping handlebar -->
  <path d="M435 182 Q465 215 545 254"
        fill="none" stroke="#f9f9f2" stroke-width="18" stroke-linecap="round"/>
  <circle cx="547" cy="256" r="12" fill="#888"/>

  <!-- Motion lines -->
  <g stroke="#4a90c0" stroke-width="5" stroke-linecap="round">
    <line x1="80" y1="420" x2="170" y2="420"/>
    <line x1="60"  y1="452" x2="160" y2="452"/>
  </g>
</svg>