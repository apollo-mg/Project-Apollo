<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#cde8f5"/>

  <!-- Ground -->
  <ellipse cx="200" cy="288" rx="195" ry="14" fill="#a8c66c"/>

  <!-- ===== Bicycle ===== -->
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Wheels -->
    <circle cx="90" cy="222" r="42"/>
    <circle cx="290" cy="222" r="42"/>
    <!-- Frame -->
    <line x1="90"  y1="222" x2="180" y2="222"/>
    <line x1="180" y1="222" x2="152" y2="132"/>
    <line x1="180" y1="222" x2="268" y2="122"/>
    <line x1="152" y1="132" x2="268" y2="122"/>
    <line x1="268" y1="122" x2="290" y2="222"/>
    <line x1="152" y1="132" x2="148" y2="112"/>
  </g>

  <!-- Spokes -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="58"  y1="222" x2="122" y2="222"/>
    <line x1="90"  y1="192" x2="90"  y2="252"/>
    <line x1="258" y1="222" x2="322" y2="222"/>
    <line x1="290" y1="192" x2="290" y2="252"/>
  </g>

  <!-- Hubs -->
  <circle cx="90"  cy="222" r="4" fill="#333"/>
  <circle cx="290" cy="222" r="4" fill="#333"/>

  <!-- Handlebar -->
  <path d="M268 122 L264 106 Q264 96 274 96" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>

  <!-- Seat -->
  <ellipse cx="148" cy="120" rx="14" ry="5" fill="#222"/>

  <!-- Crank & pedals (both sides) -->
  <circle cx="180" cy="222" r="6" fill="none" stroke="#555" stroke-width="3"/>
  <!-- Near-side crank arm & pedal -->
  <line x1="180" y1="222" x2="194" y2="238" stroke="#555" stroke-width="3"/>
  <line x1="187" y1="238" x2="202" y2="238" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Far-side crank arm & pedal -->
  <line x1="180" y1="222" x2="166" y2="206" stroke="#555" stroke-width="3"/>
  <line x1="159" y1="206" x2="173" y2="206" stroke="#333" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== Pelican ===== -->

  <!-- Tail feathers (fanned, more visible) -->
  <path d="M124 104 Q102 92 92 80 Q104 94 114 104 Z" fill="#e4e9ed" stroke="#333" stroke-width="1"/>
  <path d="M124 108 Q104 100 96 90 Q106 102 118 109 Z" fill="#dfe6ea" stroke="#333" stroke-width="1"/>
  <path d="M124 112 Q108 108 100 100 Q108 110 120 113 Z" fill="#d8dfe4" stroke="#333" stroke-width="1"/>

  <!-- Body – pear / bird silhouette -->
  <path d="M165 148 Q130 142 122 112 Q118 82 140 62 Q162 50 182 62 Q194 74 192 100 Q190 128 175 148 Z"
        fill="#f9fafb" stroke="#333" stroke-width="1.5"/>

  <!-- Folded wing -->
  <path d="M148 78 Q130 82 126 102 Q128 118 148 118 Q160 112 158 92 Q156 80 148 78 Z"
        fill="#cfd8de" stroke="#333" stroke-width="1.5"/>

  <!-- Neck (filled, connecting body to head) -->
  <path d="M172 70 Q180 60 190 55 Q194 53 196 54 L196 62 Q192 58 186 62 Q178 67 174 74 Z"
        fill="#f9fafb" stroke="#333" stroke-width="1.5"/>

  <!-- Head -->
  <circle cx="202" cy="52" r="15" fill="#f9fafb" stroke="#333" stroke-width="1.5"/>

  <!-- Beak: upper mandible -->
  <path d="M216 47 L268 49 L216 53 Z" fill="#f2a93b" stroke="#333" stroke-width="1"/>

  <!-- Beak: lower gular pouch (prominent rounded sac) -->
  <path d="M216 53 Q224 78 254 74 Q268 66 268 50 L216 53 Z"
        fill="#e8952c" stroke="#333" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="200" cy="47" r="2.5" fill="#111"/>
  <circle cx="201" cy="46" r="0.8" fill="#fff"/>

  <!-- Legs (both reaching pedals) -->
  <g stroke="#e8952c" stroke-width="5" fill="none" stroke-linecap="round">
    <!-- Near leg → near pedal -->
    <path d="M165 145 Q174 178 186 215 Q189 228 193 236"/>
    <!-- Far leg → far pedal -->
    <path d="M157 146 Q153 168 162 192 Q164 200 166 205"/>
  </g>

  <!-- Feet on pedals -->
  <ellipse cx="195" cy="237" rx="9" ry="4" fill="#e8952c" stroke="#c47a1d" stroke-width="1.5"/>
  <ellipse cx="166" cy="206" rx="8" ry="4" fill="#e8952c" stroke="#c47a1d" stroke-width="1.5" transform="rotate(-20 166 206)"/>

  <!-- Motion lines (bolder) -->
  <g stroke="#7aa" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M18 200 q15 -8 30 0"/>
    <path d="M8 225 q20 -8 40 0"/>
  </g>
</svg>