<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="800" height="600" fill="#cfeef7"/>
  <!-- Sun -->
  <circle cx="690" cy="90" r="45" fill="#ffd93d"/>
  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="60" ry="22"/>
    <ellipse cx="200" cy="75" rx="45" ry="20"/>
    <ellipse cx="480" cy="60" rx="55" ry="20"/>
  </g>
  <!-- Ground -->
  <rect y="540" width="800" height="60" fill="#8fd14f"/>
  <!-- Motion lines -->
  <g stroke="#9adbe9" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="300" x2="120" y2="300"/>
    <line x1="20" y1="340" x2="100" y2="340"/>
    <line x1="45" y1="380" x2="115" y2="380"/>
  </g>

  <!-- ============ BICYCLE ============ -->
  <g stroke="#d1495b" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- Wheels -->
    <circle cx="230" cy="440" r="100" stroke="#333" stroke-width="12"/>
    <circle cx="570" cy="440" r="100" stroke="#333" stroke-width="12"/>
    <!-- Spokes -->
    <g stroke="#999" stroke-width="3">
      <line x1="230" y1="345" x2="230" y2="535"/>
      <line x1="135" y1="440" x2="325" y2="440"/>
      <line x1="163" y1="373" x2="297" y2="507"/>
      <line x1="297" y1="373" x2="163" y2="507"/>
      <line x1="570" y1="345" x2="570" y2="535"/>
      <line x1="475" y1="440" x2="665" y2="440"/>
      <line x1="503" y1="373" x2="637" y2="507"/>
      <line x1="637" y1="373" x2="503" y2="507"/>
    </g>
    <!-- Frame -->
    <line x1="230" y1="440" x2="400" y2="440"/>
    <line x1="230" y1="440" x2="360" y2="310"/>
    <line x1="400" y1="440" x2="360" y2="310"/>
    <line x1="360" y1="310" x2="520" y2="310"/>
    <line x1="400" y1="440" x2="520" y2="310"/>
    <line x1="570" y1="440" x2="520" y2="310"/>
    <!-- Handlebar stem & bars -->
    <line x1="520" y1="310" x2="520" y2="265"/>
    <path d="M520 265 C550 265 560 278 558 292"/>
    <!-- Seat post -->
    <line x1="360" y1="310" x2="355" y2="285" stroke="#555"/>
  </g>
  <!-- Saddle -->
  <ellipse cx="355" cy="280" rx="30" ry="9" fill="#333"/>
  <!-- Crank & pedals -->
  <circle cx="400" cy="440" r="14" fill="#555"/>
  <line x1="400" y1="440" x2="440" y2="462" stroke="#555" stroke-width="8"/>
  <line x1="400" y1="440" x2="360" y2="418" stroke="#555" stroke-width="8"/>
  <rect x="428" y="456" width="28" height="9" rx="4" fill="#333"/>
  <rect x="345" y="412" width="28" height="9" rx="4" fill="#333"/>

  <!-- ============ PELICAN ============ -->
  <!-- Tail feathers (behind body) -->
  <g fill="#e8e8ee" stroke="#b9b9c7" stroke-width="3">
    <path d="M270 210 C230 195 210 205 205 225 C235 225 255 220 275 218 Z"/>
    <path d="M268 225 C225 222 205 238 202 258 C235 250 258 240 275 232 Z"/>
  </g>

  <!-- Neck -->
  <path d="M345 195 C350 170 360 150 375 135 C385 148 380 165 370 185 C365 195 358 200 350 200 Z"
        fill="#ffffff" stroke="#b9b9c7" stroke-width="3"/>

  <!-- Body (sitting on seat, smaller) -->
  <ellipse cx="335" cy="225" rx="62" ry="42" fill="#ffffff" stroke="#b9b9c7" stroke-width="4"/>

  <!-- Head -->
  <circle cx="378" cy="118" r="30" fill="#ffffff" stroke="#b9b9c7" stroke-width="4"/>
  <!-- Head crest -->
  <path d="M362 92 C366 80 378 78 382 88 C388 78 398 82 396 94 Z" fill="#b9b9c7"/>

  <!-- Beak with pouch (shorter) -->
  <path d="M400 112 L488 128 C484 152 462 170 436 165 C414 160 402 142 398 128 Z"
        fill="#f5a623" stroke="#d9821a" stroke-width="3"/>
  <!-- Upper beak line -->
  <path d="M400 112 C430 118 460 124 488 128" fill="none" stroke="#d9821a" stroke-width="3"/>
  <!-- Eye -->
  <circle cx="372" cy="108" r="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="374" cy="108" r="4" fill="#333"/>

  <!-- Wing (tucked on body) -->
  <path d="M295 215 C320 198 355 198 372 215 C355 228 318 230 295 215 Z"
        fill="#e8e8ee" stroke="#b9b9c7" stroke-width="3"/>

  <!-- Wings as arms to handlebar -->
  <path d="M370 210 C420 225 480 240 518 262" fill="none"
        stroke="#e8e8ee" stroke-width="12" stroke-linecap="round"/>
  <path d="M370 210 C420 225 480 240 518 262" fill="none"
        stroke="#b9b9c7" stroke-width="12" stroke-linecap="round" opacity="0.2"/>
  <!-- Wing tip / hand on bar -->
  <circle cx="518" cy="262" r="8" fill="#e8e8ee" stroke="#b9b9c7" stroke-width="2"/>

  <!-- Legs (orange, clearly visible) -->
  <g stroke="#f5a623" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M320 260 C315 310 330 370 355 415"/>
    <path d="M355 262 C370 320 410 400 438 458"/>
  </g>
  <!-- Webbed feet on pedals -->
  <path d="M340 412 L372 416 L362 404 Z" fill="#f5a623"/>
  <path d="M424 456 L456 460 L448 448 Z" fill="#f5a623"/>
</svg>