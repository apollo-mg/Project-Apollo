<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460">
  <title>Pelican riding a bicycle</title>

  <!-- ground -->
  <line x1="30" y1="416" x2="570" y2="416" stroke="#9e9e9e" stroke-width="4" stroke-linecap="round"/>

  <!-- rear wheel -->
  <g stroke="#333" fill="none">
    <circle cx="170" cy="350" r="62" stroke-width="6"/>
    <circle cx="170" cy="350" r="53" stroke-width="2"/>
    <g stroke-width="2">
      <line x1="170" y1="297" x2="170" y2="403"/>
      <line x1="117" y1="350" x2="223" y2="350"/>
      <line x1="133" y1="313" x2="207" y2="387"/>
      <line x1="207" y1="313" x2="133" y2="387"/>
    </g>
    <circle cx="170" cy="350" r="7" fill="#333" stroke="none"/>
  </g>

  <!-- front wheel -->
  <g stroke="#333" fill="none">
    <circle cx="430" cy="350" r="62" stroke-width="6"/>
    <circle cx="430" cy="350" r="53" stroke-width="2"/>
    <g stroke-width="2">
      <line x1="430" y1="297" x2="430" y2="403"/>
      <line x1="377" y1="350" x2="483" y2="350"/>
      <line x1="393" y1="313" x2="467" y2="387"/>
      <line x1="467" y1="313" x2="393" y2="387"/>
    </g>
    <circle cx="430" cy="350" r="7" fill="#333" stroke="none"/>
  </g>

  <!-- frame -->
  <g stroke="#c0392b" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M170 350 L300 350 L270 215"/>
    <path d="M300 350 L398 232 L270 215"/>
    <path d="M398 232 L430 350"/>
  </g>

  <!-- seat post + saddle -->
  <line x1="270" y1="215" x2="264" y2="194" stroke="#555" stroke-width="6"/>
  <rect x="232" y="186" width="60" height="12" rx="6" fill="#222"/>

  <!-- handlebars -->
  <line x1="398" y1="232" x2="404" y2="186" stroke="#555" stroke-width="6"/>
  <path d="M404 186 q 12 -15 27 -8" stroke="#222" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- chainring, cranks, pedals -->
  <circle cx="300" cy="350" r="13" fill="#444"/>
  <line x1="300" y1="350" x2="328" y2="366" stroke="#444" stroke-width="6"/>
  <line x1="300" y1="350" x2="272" y2="334" stroke="#444" stroke-width="6"/>
  <rect x="314" y="361" width="30" height="10" rx="3" fill="#222"/>
  <rect x="256" y="329" width="30" height="10" rx="3" fill="#222"/>

  <!-- pelican legs (curved, organic) -->
  <path d="M240 190 Q 244 250 258 290 Q 264 310 272 332" stroke="#e0952a" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M258 192 Q 280 260 300 310 Q 314 340 326 362" stroke="#f5a623" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- feet on pedals -->
  <ellipse cx="272" cy="333" rx="14" ry="6" fill="#d4822a"/>
  <ellipse cx="326" cy="363" rx="14" ry="6" fill="#d4822a"/>

  <!-- tail (larger, more visible) -->
  <path d="M168 118 Q 130 98 112 78 Q 140 90 165 105 Z" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="2"/>
  <path d="M170 128 Q 138 118 118 100 Q 145 110 170 120 Z" fill="#e4e4e4" stroke="#9e9e9e" stroke-width="1.5"/>
  <path d="M165 138 Q 140 134 122 122 Q 146 128 166 134 Z" fill="#ddd" stroke="#9e9e9e" stroke-width="1.5"/>

  <!-- body -->
  <ellipse cx="242" cy="148" rx="72" ry="50" fill="#ffffff" stroke="#9e9e9e" stroke-width="2.5"/>

  <!-- wing reaching to handlebar -->
  <path d="M268 112 Q 305 102 340 116 Q 372 134 398 180 L 392 192 Q 368 152 336 136 Q 304 124 266 132 Z"
        fill="#ececec" stroke="#9e9e9e" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- feather detail -->
  <path d="M296 120 Q 334 128 370 158" stroke="#d0d0d0" stroke-width="1.5" fill="none"/>
  <path d="M282 128 Q 320 138 358 164" stroke="#d0d0d0" stroke-width="1.5" fill="none"/>

  <!-- neck -->
  <path d="M294 138 Q 328 112 344 76" stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M294 138 Q 328 112 344 76" stroke="#9e9e9e" stroke-width="1" fill="none" opacity="0.25"/>

  <!-- head -->
  <circle cx="348" cy="68" r="19" fill="#ffffff" stroke="#9e9e9e" stroke-width="2.5"/>

  <!-- beak (shorter, balanced) -->
  <path d="M362 58 L 448 70 L 448 78 L 362 80 Z" fill="#f39c12"/>
  <!-- pouch -->
  <path d="M362 80 Q 392 128 446 80 Z" fill="#e67e22" stroke="#d35400" stroke-width="1"/>

  <!-- eye -->
  <circle cx="352" cy="61" r="5" fill="#222"/>
  <circle cx="354" cy="59" r="2" fill="#fff"/>
</svg>