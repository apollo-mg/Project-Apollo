<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Sky -->
  <rect width="800" height="500" fill="#DFF2FF"/>

  <!-- Ground -->
  <line x1="60" y1="455" x2="740" y2="455" stroke="#9AA5A1" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== Bicycle ===== -->
  <!-- Wheels -->
  <g stroke="#333" stroke-width="8" fill="none">
    <circle cx="240" cy="390" r="65"/>
    <circle cx="560" cy="390" r="65"/>
  </g>
  <!-- Spokes -->
  <g stroke="#888" stroke-width="2.5">
    <line x1="240" y1="325" x2="240" y2="455"/>
    <line x1="175" y1="390" x2="305" y2="390"/>
    <line x1="195" y1="345" x2="285" y2="435"/>
    <line x1="285" y1="345" x2="195" y2="435"/>
    <line x1="560" y1="325" x2="560" y2="455"/>
    <line x1="495" y1="390" x2="625" y2="390"/>
    <line x1="515" y1="345" x2="605" y2="435"/>
    <line x1="605" y1="345" x2="515" y2="435"/>
  </g>
  <!-- Hubs -->
  <circle cx="240" cy="390" r="9" fill="#333"/>
  <circle cx="560" cy="390" r="9" fill="#333"/>

  <!-- Frame (thicker, full diamond) -->
  <g stroke="#D62828" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M240 390 L400 390"/>
    <path d="M400 390 L360 275"/>
    <path d="M400 390 L530 270"/>
    <path d="M360 275 L530 270"/>
    <path d="M530 270 L560 390"/>
    <path d="M240 390 L360 275"/>
  </g>

  <!-- Seat post and saddle -->
  <line x1="358" y1="272" x2="352" y2="250" stroke="#333" stroke-width="7"/>
  <ellipse cx="350" cy="248" rx="26" ry="10" fill="#333"/>

  <!-- Handlebar -->
  <path d="M530 270 L528 242 Q 528 230 548 230" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Crank, pedal arm and pedal -->
  <circle cx="400" cy="390" r="14" fill="#444"/>
  <line x1="400" y1="390" x2="414" y2="400" stroke="#333" stroke-width="6"/>
  <line x1="404" y1="400" x2="430" y2="400" stroke="#222" stroke-width="5"/>

  <!-- ===== Pelican ===== -->
  <!-- Tail (more visible) -->
  <polygon points="285,190 235,165 255,210 290,215" fill="#FDF3E7" stroke="#DDD" stroke-width="1.5"/>

  <!-- Body (larger) -->
  <ellipse cx="350" cy="208" rx="75" ry="58" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>

  <!-- Wing -->
  <path d="M295 190 Q 365 168 415 208 Q 375 248 300 232 Z" fill="#B8C4CC"/>

  <!-- Neck (broader, connects body to head seamlessly) -->
  <path d="M368 192 Q 372 140 388 115 L 418 125 Q 408 155 402 192 Z" fill="#FFFFFF"/>

  <!-- Head -->
  <circle cx="400" cy="105" r="32" fill="#FFFFFF"/>

  <!-- Upper beak (shortened) -->
  <polygon points="425,95 505,108 427,116" fill="#F4A261"/>
  <!-- Beak pouch -->
  <path d="M505 108 C 478 152 445 152 427 116 Z" fill="#E76F51"/>

  <!-- Eye -->
  <circle cx="394" cy="98" r="6" fill="#111"/>
  <circle cx="396" cy="96" r="2" fill="#FFF"/>

  <!-- Arm reaching to handlebar -->
  <path d="M385 185 Q 455 218 530 233" stroke="#F4A261" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="532" cy="233" r="7" fill="#E76F51"/>

  <!-- Leg to pedal (starts from lower body, clearly on saddle) -->
  <path d="M355 252 L 395 330 L 405 390" stroke="#E76F51" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Webbed foot on pedal -->
  <ellipse cx="410" cy="394" rx="19" ry="8" fill="#E76F51"/>
</svg>