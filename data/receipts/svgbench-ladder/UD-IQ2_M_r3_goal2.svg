<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Sky -->
  <rect width="800" height="500" fill="#DFF2FF"/>

  <!-- Ground -->
  <line x1="50" y1="462" x2="750" y2="462" stroke="#9AA5A1" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== Bicycle ===== -->
  <!-- Wheels -->
  <g stroke="#333" stroke-width="8" fill="none">
    <circle cx="200" cy="400" r="60"/>
    <circle cx="500" cy="400" r="60"/>
  </g>
  <!-- Spokes -->
  <g stroke="#666" stroke-width="3">
    <line x1="200" y1="340" x2="200" y2="460"/>
    <line x1="140" y1="400" x2="260" y2="400"/>
    <line x1="158" y1="358" x2="242" y2="442"/>
    <line x1="242" y1="358" x2="158" y2="442"/>
    <line x1="500" y1="340" x2="500" y2="460"/>
    <line x1="440" y1="400" x2="560" y2="400"/>
    <line x1="458" y1="358" x2="542" y2="442"/>
    <line x1="542" y1="358" x2="458" y2="442"/>
  </g>
  <!-- Hubs -->
  <circle cx="200" cy="400" r="9" fill="#333"/>
  <circle cx="500" cy="400" r="9" fill="#333"/>

  <!-- Frame -->
  <g stroke="#D62828" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M200 400 L350 400 L310 275 Z"/>
    <path d="M310 275 L460 265"/>
    <path d="M350 400 L460 265"/>
    <path d="M460 265 L500 400"/>
  </g>

  <!-- Seat post and saddle -->
  <line x1="308" y1="270" x2="303" y2="252" stroke="#333" stroke-width="6"/>
  <ellipse cx="300" cy="249" rx="24" ry="9" fill="#333"/>

  <!-- Handlebar -->
  <path d="M460 265 L458 240 Q 458 228 472 228" stroke="#333" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- Crank and pedal -->
  <circle cx="350" cy="400" r="13" fill="#444"/>
  <line x1="350" y1="400" x2="362" y2="412" stroke="#333" stroke-width="6"/>
  <line x1="358" y1="412" x2="382" y2="412" stroke="#222" stroke-width="5"/>

  <!-- ===== Pelican ===== -->
  <!-- Tail feathers -->
  <polygon points="260,195 222,168 265,222" fill="#FDF3E7"/>
  <polygon points="255,205 218,188 258,228" fill="#F0E0CC"/>

  <!-- Body (sitting on the saddle) -->
  <ellipse cx="310" cy="205" rx="55" ry="44" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>

  <!-- Wing reaching to the handlebar -->
  <path d="M300 190 Q 395 172 458 232 Q 400 258 298 228 Z"
        fill="#B8C4CC" stroke="#99A5AD" stroke-width="1"/>
  <!-- Wing-tip / webbed foot on handlebar -->
  <ellipse cx="462" cy="234" rx="10" ry="7" fill="#E76F51"/>

  <!-- Neck -->
  <path d="M335 185 Q 345 140 358 115 L 378 126 Q 370 155 355 192 Z"
        fill="#FFFFFF" stroke="#EEE" stroke-width="1"/>

  <!-- Head -->
  <circle cx="365" cy="105" r="25" fill="#FFFFFF" stroke="#EEE" stroke-width="1"/>

  <!-- Beak (shortened to ~72 px) -->
  <polygon points="382,95 455,110 384,116" fill="#F4A261"/>
  <!-- Beak pouch (smaller) -->
  <path d="M455 110 Q 432 142 384 116" fill="#E76F51"/>

  <!-- Eye -->
  <circle cx="360" cy="97" r="5" fill="#111"/>
  <circle cx="362" cy="95" r="2" fill="#FFF"/>

  <!-- Leg to pedal -->
  <path d="M328 242 Q 342 330 364 405" stroke="#E76F51" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- Webbed foot on pedal -->
  <ellipse cx="366" cy="408" rx="18" ry="7" fill="#E76F51"/>
</svg>