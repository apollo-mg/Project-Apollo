<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#cde8f5"/>

  <!-- Ground -->
  <ellipse cx="200" cy="288" rx="195" ry="14" fill="#a8c66c"/>

  <!-- ===== Bicycle ===== -->
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Wheels -->
    <circle cx="90" cy="222" r="42"/>
    <circle cx="290" cy="222" r="42"/>
    <!-- Frame -->
    <line x1="90"  y1="222" x2="180" y2="222"/>   <!-- chain stay -->
    <line x1="180" y1="222" x2="152" y2="132"/>   <!-- seat stay -->
    <line x1="180" y1="222" x2="268" y2="122"/>   <!-- down tube -->
    <line x1="152" y1="132" x2="268" y2="122"/>   <!-- top tube -->
    <line x1="268" y1="122" x2="290" y2="222"/>   <!-- fork -->
    <line x1="152" y1="132" x2="148" y2="112"/>   <!-- seat post -->
  </g>

  <!-- Spokes -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="58"  y1="222" x2="122" y2="222"/>
    <line x1="90"  y1="192" x2="90"  y2="252"/>
    <line x1="258" y1="222" x2="322" y2="222"/>
    <line x1="290" y1="192" x2="290" y2="252"/>
  </g>

  <!-- Hubs -->
  <circle cx="90"  cy="222" r="4" fill="#333"/>
  <circle cx="290" cy="222" r="4" fill="#333"/>

  <!-- Handlebar -->
  <path d="M268 122 L264 106 Q264 96 274 96" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>

  <!-- Seat -->
  <ellipse cx="148" cy="120" rx="14" ry="5" fill="#222"/>

  <!-- Crank & pedal -->
  <circle cx="180" cy="222" r="6" fill="none" stroke="#555" stroke-width="3"/>
  <line x1="180" y1="222" x2="194" y2="238" stroke="#555" stroke-width="3"/>
  <line x1="187" y1="238" x2="202" y2="238" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== Pelican ===== -->

  <!-- Tail feathers (fanned) -->
  <path d="M125 100 Q108 88 100 78 Q112 92 118 98 Q110 90 104 80 Q114 94 122 100 Z" fill="#e4e9ed"/>
  <path d="M125 102 Q106 96 98 88 Q110 98 120 103 Z" fill="#dfe6ea"/>

  <!-- Body – pear / bird silhouette -->
  <path d="M165 148 Q130 142 122 112 Q118 82 140 62 Q162 50 182 62 Q194 74 192 100 Q190 128 175 148 Z"
        fill="#f9fafb" stroke="#333" stroke-width="1.5"/>

  <!-- Folded wing -->
  <path d="M148 78 Q130 82 126 102 Q128 118 148 118 Q160 112 158 92 Q156 80 148 78 Z"
        fill="#cfd8de" stroke="#333" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M178 68 Q188 60 196 54 Q204 52 208 56" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Head (slightly larger, positioned forward of body top) -->
  <circle cx="206" cy="54" r="15" fill="#f9fafb" stroke="#333" stroke-width="1.5"/>

  <!-- Beak: upper mandible (shorter, ~55 px) -->
  <path d="M218 48 L270 52 L218 54 Z" fill="#f2a93b" stroke="#333" stroke-width="1"/>

  <!-- Beak: lower gular pouch (rounded) -->
  <path d="M218 54 Q232 72 270 56 Q250 60 218 56 Z" fill="#e8952c" stroke="#333" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="206" cy="49" r="2.5" fill="#111"/>
  <circle cx="207" cy="48" r="0.8" fill="#fff"/>

  <!-- Legs (thicker, with knee bend, clearly reaching pedals) -->
  <g stroke="#e8952c" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M170 145 Q176 175 188 210 Q190 225 194 236"/>   <!-- far leg → pedal -->
    <path d="M160 147 Q164 175 172 200"/>                      <!-- near leg (mid-stroke) -->
  </g>

  <!-- Feet -->
  <ellipse cx="195" cy="237" rx="9" ry="4" fill="#e8952c" stroke="#c47a1d" stroke-width="1.5"/>
  <ellipse cx="173" cy="201" rx="8" ry="4" fill="#e8952c" stroke="#c47a1d" stroke-width="1.5" transform="rotate(-25 173 201)"/>

  <!-- Motion lines -->
  <g stroke="#8ab" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M20 205 q10 -6 20 0"/>
    <path d="M10 230 q12 -6 24 0"/>
  </g>
</svg>