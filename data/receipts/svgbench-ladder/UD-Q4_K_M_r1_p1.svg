<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="800" height="600" fill="#cfeef7"/>
  <!-- Sun -->
  <circle cx="690" cy="90" r="45" fill="#ffd93d"/>
  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="60" ry="22"/>
    <ellipse cx="200" cy="75" rx="45" ry="20"/>
    <ellipse cx="480" cy="60" rx="55" ry="20"/>
  </g>
  <!-- Ground -->
  <rect y="540" width="800" height="60" fill="#8fd14f"/>
  <!-- Motion lines -->
  <g stroke="#9adbe9" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="300" x2="120" y2="300"/>
    <line x1="20" y1="340" x2="100" y2="340"/>
    <line x1="45" y1="380" x2="115" y2="380"/>
  </g>

  <!-- ============ BICYCLE ============ -->
  <g stroke="#d1495b" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- Wheels -->
    <circle cx="230" cy="440" r="100" stroke="#333" stroke-width="12"/>
    <circle cx="570" cy="440" r="100" stroke="#333" stroke-width="12"/>
    <!-- Spokes -->
    <g stroke="#999" stroke-width="3">
      <line x1="230" y1="345" x2="230" y2="535"/>
      <line x1="135" y1="440" x2="325" y2="440"/>
      <line x1="163" y1="373" x2="297" y2="507"/>
      <line x1="297" y1="373" x2="163" y2="507"/>
      <line x1="570" y1="345" x2="570" y2="535"/>
      <line x1="475" y1="440" x2="665" y2="440"/>
      <line x1="503" y1="373" x2="637" y2="507"/>
      <line x1="637" y1="373" x2="503" y2="507"/>
    </g>
    <!-- Frame -->
    <line x1="230" y1="440" x2="400" y2="440"/>  <!-- chainstay -->
    <line x1="230" y1="440" x2="360" y2="300"/>  <!-- seat stay -->
    <line x1="400" y1="440" x2="360" y2="300"/>  <!-- seat tube -->
    <line x1="360" y1="300" x2="525" y2="310"/>  <!-- top tube -->
    <line x1="400" y1="440" x2="525" y2="310"/>  <!-- down tube -->
    <line x1="570" y1="440" x2="530" y2="300"/>  <!-- fork -->
    <!-- Handlebar stem & bars -->
    <line x1="530" y1="300" x2="530" y2="255"/>
    <path d="M530 255 C560 255 570 270 568 288"/>
    <!-- Seat post & saddle -->
    <line x1="360" y1="300" x2="355" y2="278" stroke="#555"/>
  </g>
  <ellipse cx="355" cy="272" rx="35" ry="10" fill="#333"/>
  <!-- Crank & pedals -->
  <circle cx="400" cy="440" r="14" fill="#555"/>
  <line x1="400" y1="440" x2="447" y2="466" stroke="#555" stroke-width="8"/>
  <line x1="400" y1="440" x2="353" y2="414" stroke="#555" stroke-width="8"/>
  <rect x="432" y="460" width="30" height="9" rx="4" fill="#333"/>
  <rect x="338" y="408" width="30" height="9" rx="4" fill="#333"/>

  <!-- ============ PELICAN ============ -->
  <!-- Legs (orange) -->
  <g stroke="#f5a623" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M345 285 C340 340 350 380 353 411"/>
    <path d="M370 285 C385 340 420 410 446 462"/>
  </g>
  <!-- Webbed feet on pedals -->
  <path d="M335 411 L370 414 L362 402 Z" fill="#f5a623"/>
  <path d="M430 462 L466 466 L456 452 Z" fill="#f5a623"/>

  <!-- Tail feathers -->
  <g fill="#e8e8ee" stroke="#b9b9c7" stroke-width="3">
    <path d="M250 235 C210 220 190 235 185 255 C215 255 240 250 258 250 Z"/>
    <path d="M250 250 C205 248 185 265 182 285 C215 278 242 268 258 262 Z"/>
  </g>

  <!-- Body -->
  <ellipse cx="330" cy="230" rx="95" ry="68" fill="#ffffff" stroke="#b9b9c7" stroke-width="4"/>
  <!-- Head -->
  <circle cx="352" cy="132" r="40" fill="#ffffff" stroke="#b9b9c7" stroke-width="4"/>
  <!-- Head crest -->
  <path d="M330 96 C335 82 352 80 358 92 C364 80 378 84 376 98 Z" fill="#b9b9c7"/>
  <!-- Beak with big pouch -->
  <path d="M382 118 L520 142 C512 178 478 206 435 199 C402 192 384 168 380 142 Z"
        fill="#f5a623" stroke="#d9821a" stroke-width="3"/>
  <!-- Upper beak line -->
  <path d="M382 118 C430 130 480 138 520 142" fill="none" stroke="#d9821a" stroke-width="3"/>
  <!-- Eye -->
  <circle cx="345" cy="118" r="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="347" cy="118" r="5" fill="#333"/>
  <!-- Eye patch (pelican eye ring) -->
  <path d="M338 100 C330 108 330 128 340 134" fill="none" stroke="#b9b9c7" stroke-width="2"/>

  <!-- Wing (one tucked, one raised for style) -->
  <path d="M285 220 C320 195 370 195 395 225 C370 240 320 245 285 220 Z"
        fill="#e8e8ee" stroke="#b9b9c7" stroke-width="3"/>
  <path d="M270 235 C230 200 230 160 255 130 C270 165 285 200 292 225 Z"
        fill="#e8e8ee" stroke="#b9b9c7" stroke-width="3"/>

  <!-- Arm to handlebar -->
  <path d="M390 220 C440 240 500 245 532 258" fill="none"
        stroke="#e8e8ee" stroke-width="14" stroke-linecap="round"/>
  <path d="M390 220 C440 240 500 245 532 258" fill="none"
        stroke="#b9b9c7" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
</svg>