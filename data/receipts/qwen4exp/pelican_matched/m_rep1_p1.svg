<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#cdeafb"/>
  <circle cx="690" cy="90" r="45" fill="#ffd95e"/>
  <ellipse cx="140" cy="95" rx="60" ry="22" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="205" cy="118" rx="45" ry="17" fill="#ffffff" opacity="0.85"/>
  <rect y="500" width="800" height="100" fill="#9bd47a"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#7cb55d" stroke-width="4"/>

  <!-- ===== BICYCLE ===== -->
  <!-- Rear wheel -->
  <g stroke="#333" fill="none">
    <circle cx="250" cy="420" r="80" stroke-width="9"/>
    <circle cx="250" cy="420" r="66" stroke-width="3"/>
    <!-- Front wheel -->
    <circle cx="530" cy="420" r="80" stroke-width="9"/>
    <circle cx="530" cy="420" r="66" stroke-width="3"/>
    <!-- Spokes -->
    <g stroke-width="2.5">
      <line x1="250" y1="354" x2="250" y2="486"/><line x1="184" y1="420" x2="316" y2="420"/>
      <line x1="203" y1="373" x2="297" y2="467"/><line x1="203" y1="467" x2="297" y2="373"/>
      <line x1="530" y1="354" x2="530" y2="486"/><line x1="464" y1="420" x2="596" y2="420"/>
      <line x1="483" y1="373" x2="577" y2="467"/><line x1="483" y1="467" x2="577" y2="373"/>
    </g>
    <!-- Frame -->
    <g stroke="#e63946" stroke-width="9" stroke-linecap="round">
      <line x1="250" y1="420" x2="370" y2="420"/>   <!-- chainstay -->
      <line x1="370" y1="420" x2="332" y2="295"/>   <!-- seat tube -->
      <line x1="345" y1="308" x2="492" y2="318"/>   <!-- top tube -->
      <line x1="370" y1="420" x2="492" y2="318"/>   <!-- down tube -->
      <line x1="492" y1="318" x2="505" y2="350"/>   <!-- head tube -->
      <line x1="505" y1="350" x2="530" y2="420"/>   <!-- fork -->
      <line x1="338" y1="305" x2="250" y2="420"/>   <!-- seat stay -->
      <!-- Handlebar -->
      <path d="M 495 312 L 500 272 Q 502 258 520 258 L 545 260" stroke-width="8" fill="none"/>
    </g>
    <!-- Chainring & crank -->
    <circle cx="370" cy="420" r="20" stroke="#555" stroke-width="5"/>
    <line x1="370" y1="420" x2="402" y2="438" stroke="#555" stroke-width="6"/>
    <line x1="370" y1="420" x2="338" y2="402" stroke="#555" stroke-width="6"/>
    <circle cx="250" cy="420" r="9" fill="#555"/>
    <circle cx="530" cy="420" r="9" fill="#555"/>
  </g>
  <rect x="390" y="434" width="26" height="9" rx="3" fill="#333"/>
  <rect x="322" y="394" width="26" height="9" rx="3" fill="#333"/>
  <!-- Seat -->
  <path d="M 300 292 Q 332 282 362 293 Q 340 302 330 301 Q 312 301 300 292 Z" fill="#333"/>

  <!-- ===== PELICAN ===== -->
  <!-- Legs (behind body) -->
  <g stroke="#f08c1e" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 312 268 L 340 340 L 336 398"/>
    <path d="M 340 272 L 372 345 L 400 436"/>
  </g>
  <!-- Webbed feet on pedals -->
  <path d="M 322 398 L 350 398 L 344 412 Q 336 418 328 412 Z" fill="#f08c1e"/>
  <path d="M 388 436 L 416 436 L 410 450 Q 402 456 394 450 Z" fill="#f08c1e"/>

  <!-- Tail feathers -->
  <path d="M 258 205 L 205 185 L 225 215 L 200 222 L 250 240 Z" fill="#e8e8ee" stroke="#9aa0ae" stroke-width="3" stroke-linejoin="round"/>

  <!-- Body -->
  <ellipse cx="322" cy="222" rx="72" ry="58" fill="#ffffff" stroke="#9aa0ae" stroke-width="4"/>

  <!-- Neck and head -->
  <path d="M 360 250 Q 340 190 372 150 Q 385 122 415 122 L 430 135 Q 400 155 392 190 Q 388 225 396 250 Z"
        fill="#ffffff" stroke="#9aa0ae" stroke-width="4"/>
  <circle cx="418" cy="128" r="27" fill="#ffffff" stroke="#9aa0ae" stroke-width="4"/>

  <!-- Beak with pouch -->
  <path d="M 438 118 L 556 140 Q 560 148 552 152 L 460 148 Z" fill="#ffb03a" stroke="#d97e12" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 440 140 Q 500 210 552 149 Q 505 172 452 158 Z" fill="#ff9730" stroke="#d97e12" stroke-width="3" stroke-linejoin="round"/>

  <!-- Eye -->
  <circle cx="424" cy="120" r="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="425" cy="119" r="3" fill="#222"/>

  <!-- Wing reaching to handlebar -->
  <path d="M 320 200 Q 380 218 440 248 Q 480 266 512 266 Q 520 278 508 284 Q 460 286 415 264 Q 360 240 315 230 Z"
        fill="#eef0f4" stroke="#9aa0ae" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 350 232 Q 400 250 450 268" stroke="#c3c8d2" stroke-width="3" fill="none"/>

  <!-- Small bow / flair -->
  <path d="M 396 98 Q 386 86 396 80 Q 406 86 400 96 Q 412 84 420 90 Q 416 102 402 102 Z" fill="#e63946"/>
</svg>