<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#cdeafb"/>
  <circle cx="690" cy="90" r="45" fill="#ffd95e"/>
  <ellipse cx="140" cy="95" rx="60" ry="22" fill="#fff" opacity="0.85"/>
  <ellipse cx="205" cy="118" rx="45" ry="17" fill="#fff" opacity="0.85"/>
  <rect y="510" width="800" height="90" fill="#9bd47a"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#7cb55d" stroke-width="4"/>

  <!-- ===== BICYCLE ===== -->
  <g stroke="#333" fill="none">
    <!-- Rear wheel -->
    <circle cx="230" cy="430" r="78" stroke-width="9"/>
    <circle cx="230" cy="430" r="64" stroke-width="3"/>
    <!-- Front wheel -->
    <circle cx="540" cy="430" r="78" stroke-width="9"/>
    <circle cx="540" cy="430" r="64" stroke-width="3"/>
    <!-- Spokes -->
    <g stroke-width="2.2">
      <line x1="230" y1="366" x2="230" y2="494"/>
      <line x1="166" y1="430" x2="294" y2="430"/>
      <line x1="184" y1="384" x2="276" y2="476"/>
      <line x1="184" y1="476" x2="276" y2="384"/>
      <line x1="540" y1="366" x2="540" y2="494"/>
      <line x1="476" y1="430" x2="604" y2="430"/>
      <line x1="494" y1="384" x2="586" y2="476"/>
      <line x1="494" y1="476" x2="586" y2="384"/>
    </g>
    <!-- Frame -->
    <g stroke="#e63946" stroke-width="9" stroke-linecap="round">
      <line x1="230" y1="430" x2="370" y2="430"/>
      <line x1="370" y1="430" x2="348" y2="295"/>
      <line x1="348" y1="295" x2="498" y2="305"/>
      <line x1="370" y1="430" x2="498" y2="305"/>
      <line x1="498" y1="305" x2="510" y2="340"/>
      <line x1="510" y1="340" x2="540" y2="430"/>
      <line x1="352" y1="300" x2="230" y2="430"/>
    </g>
    <!-- Handlebar -->
    <path d="M 498 300 L 505 265 Q 508 250 530 250 L 558 254" stroke="#e63946" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Crank & chainring -->
    <circle cx="370" cy="430" r="22" stroke="#555" stroke-width="5"/>
    <line x1="370" y1="430" x2="404" y2="448" stroke="#555" stroke-width="7"/>
    <line x1="370" y1="430" x2="336" y2="412" stroke="#555" stroke-width="7"/>
    <circle cx="230" cy="430" r="9" fill="#555"/>
    <circle cx="540" cy="430" r="9" fill="#555"/>
  </g>
  <!-- Pedals -->
  <rect x="392" y="444" width="26" height="9" rx="3" fill="#333"/>
  <rect x="324" y="404" width="26" height="9" rx="3" fill="#333"/>
  <!-- Seat -->
  <path d="M 310 288 Q 348 276 386 289 Q 370 298 348 299 Q 326 298 310 288 Z" fill="#333"/>

  <!-- ===== PELICAN ===== -->
  <!-- Legs -->
  <g stroke="#f08c1e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 325 278 Q 330 330 340 370 L 338 410"/>
    <path d="M 355 280 Q 375 340 395 390 L 404 442"/>
  </g>
  <!-- Webbed feet -->
  <path d="M 324 410 L 352 410 Q 348 424 338 426 Q 328 424 324 410 Z" fill="#f08c1e"/>
  <path d="M 390 442 L 418 442 Q 414 456 404 458 Q 394 456 390 442 Z" fill="#f08c1e"/>

  <!-- Tail -->
  <path d="M 262 210 L 210 192 L 230 218 L 206 226 L 255 245 Z" fill="#e8e8ee" stroke="#9aa0ae" stroke-width="3" stroke-linejoin="round"/>

  <!-- Body -->
  <ellipse cx="330" cy="232" rx="72" ry="56" fill="#ffffff" stroke="#9aa0ae" stroke-width="4"/>

  <!-- Neck -->
  <path d="M 358 215 Q 350 175 365 148 Q 378 120 405 115 Q 425 112 435 122 Q 418 130 405 148 Q 392 172 390 215 Z"
        fill="#ffffff" stroke="#9aa0ae" stroke-width="4" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="420" cy="118" r="26" fill="#ffffff" stroke="#9aa0ae" stroke-width="4"/>

  <!-- Beak (upper) -->
  <path d="M 440 112 L 565 138 Q 568 144 562 148 L 448 140 Z" fill="#ffb03a" stroke="#d97e12" stroke-width="3" stroke-linejoin="round"/>
  <!-- Pouch (lower beak) -->
  <path d="M 444 140 Q 470 195 530 170 Q 555 158 560 148 Q 520 178 470 168 Q 450 160 444 140 Z"
        fill="#ff9730" stroke="#d97e12" stroke-width="3" stroke-linejoin="round"/>

  <!-- Eye -->
  <circle cx="425" cy="112" r="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="426" cy="111" r="2.8" fill="#222"/>

  <!-- Wing reaching to handlebar -->
  <path d="M 330 210 Q 380 230 440 255 Q 480 268 510 262 Q 522 272 512 280 Q 470 284 430 268 Q 370 245 325 235 Z"
        fill="#eef0f4" stroke="#9aa0ae" stroke-width="4" stroke-linejoin="round"/>
  <!-- Wing feather lines -->
  <path d="M 360 235 Q 410 255 460 268" stroke="#c3c8d2" stroke-width="2.5" fill="none"/>
  <path d="M 375 242 Q 420 260 470 272" stroke="#c3c8d2" stroke-width="2" fill="none"/>

  <!-- Small red bow on head -->
  <path d="M 412 92 Q 402 82 410 76 Q 420 82 416 92 Q 426 80 432 86 Q 428 96 418 97 Z" fill="#e63946" stroke="#c0303a" stroke-width="1"/>
</svg>