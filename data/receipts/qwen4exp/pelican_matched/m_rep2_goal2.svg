<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky & ground -->
  <rect width="400" height="300" fill="#bfe6f5"/>
  <circle cx="350" cy="38" r="18" fill="#ffd94d"/>
  <ellipse cx="60" cy="50" rx="26" ry="10" fill="#fff" opacity="0.9"/>
  <rect y="262" width="400" height="38" fill="#8fc98f"/>

  <!-- Rear wheel -->
  <circle cx="105" cy="218" r="46" fill="none" stroke="#333" stroke-width="5"/>
  <g stroke="#aaa" stroke-width="1.5">
    <line x1="105" y1="174" x2="105" y2="262"/>
    <line x1="61" y1="218" x2="149" y2="218"/>
    <line x1="72" y1="185" x2="138" y2="251"/>
    <line x1="138" y1="185" x2="72" y2="251"/>
  </g>
  <circle cx="105" cy="218" r="5" fill="#333"/>

  <!-- Front wheel -->
  <circle cx="282" cy="218" r="46" fill="none" stroke="#333" stroke-width="5"/>
  <g stroke="#aaa" stroke-width="1.5">
    <line x1="282" y1="174" x2="282" y2="262"/>
    <line x1="238" y1="218" x2="326" y2="218"/>
    <line x1="249" y1="185" x2="315" y2="251"/>
    <line x1="315" y1="185" x2="249" y2="251"/>
  </g>
  <circle cx="282" cy="218" r="5" fill="#333"/>

  <!-- Bicycle frame -->
  <g stroke="#c0392b" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="105" y1="218" x2="192" y2="218"/><!-- chainstay -->
    <line x1="105" y1="218" x2="152" y2="142"/><!-- seat stay -->
    <line x1="152" y1="142" x2="192" y2="218"/><!-- seat tube -->
    <line x1="152" y1="142" x2="258" y2="132"/><!-- top tube -->
    <line x1="192" y1="218" x2="258" y2="132"/><!-- down tube -->
    <line x1="258" y1="132" x2="282" y2="218"/><!-- fork -->
  </g>

  <!-- Chainring -->
  <circle cx="192" cy="218" r="13" fill="none" stroke="#333" stroke-width="3"/>
  <!-- Crank arms & pedals -->
  <line x1="192" y1="218" x2="210" y2="202" stroke="#333" stroke-width="3"/>
  <line x1="192" y1="218" x2="174" y2="234" stroke="#333" stroke-width="3"/>
  <rect x="206" y="198" width="14" height="5" rx="2" fill="#333"/>
  <rect x="166" y="232" width="14" height="5" rx="2" fill="#333"/>

  <!-- Seat post & saddle -->
  <line x1="152" y1="142" x2="150" y2="128" stroke="#333" stroke-width="4"/>
  <ellipse cx="150" cy="125" rx="15" ry="5" fill="#333"/>

  <!-- Handlebar -->
  <path d="M258 132 L260 114 Q262 108 270 108" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Pelican legs (from body to pedals) -->
  <g stroke="#e67e22" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M142 118 Q160 165 207 199"/>
    <path d="M136 120 Q148 178 172 231"/>
  </g>
  <path d="M207 199 l13 -2 l-5 8 z" fill="#e67e22"/>
  <path d="M172 231 l13 -2 l-5 8 z" fill="#e67e22"/>

  <!-- Pelican body -->
  <ellipse cx="138" cy="90" rx="40" ry="30" fill="#fff" stroke="#bbb" stroke-width="1.5"/>

  <!-- Tail feathers -->
  <path d="M100 80 L76 70 L88 85 L74 92 L100 98 Z" fill="#fff" stroke="#bbb" stroke-width="1.5"/>

  <!-- Neck (smooth S-curve up and forward) -->
  <path d="M166 72 Q192 38 216 50" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="222" cy="50" r="11" fill="#fff" stroke="#bbb" stroke-width="1.5"/>

  <!-- Beak (long, narrow, with small pouch) -->
  <path d="M231 46 L278 53 Q268 57 260 56 Q254 63 234 57 Z" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
  <!-- Pouch line -->
  <path d="M234 54 Q252 64 270 55" stroke="#d68910" stroke-width="1" fill="none"/>

  <!-- Eye -->
  <circle cx="225" cy="47" r="2.8" fill="#222"/>
  <circle cx="226" cy="46" r="1" fill="#fff"/>

  <!-- Wing (gripping handlebar, kept compact) -->
  <path d="M158 82 Q200 92 254 110 Q260 114 252 118 Q224 120 192 112 Q162 104 156 92 Z"
        fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>
  <path d="M175 96 Q205 105 232 110" stroke="#bbb" stroke-width="1" fill="none"/>
</svg>