<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- sky/background -->
  <rect width="400" height="350" fill="#dff1f7"/>
  <circle cx="350" cy="45" r="22" fill="#ffd94d"/>
  <line x1="0" y1="322" x2="400" y2="322" stroke="#9b8f7a" stroke-width="4"/>

  <!-- ===== BICYCLE ===== -->
  <g stroke="#333" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- wheels -->
    <circle cx="105" cy="265" r="52" stroke-width="7"/>
    <circle cx="305" cy="265" r="52" stroke-width="7"/>
    <!-- spokes -->
    <g stroke-width="2" stroke="#777">
      <line x1="105" y1="215" x2="105" y2="315"/><line x1="55" y1="265" x2="155" y2="265"/>
      <line x1="70" y1="230" x2="140" y2="300"/><line x1="140" y1="230" x2="70" y2="300"/>
      <line x1="305" y1="215" x2="305" y2="315"/><line x1="255" y1="265" x2="355" y2="265"/>
      <line x1="270" y1="230" x2="340" y2="300"/><line x1="340" y1="230" x2="270" y2="300"/>
    </g>
  </g>

  <!-- frame -->
  <g stroke="#e63946" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="160" y1="162" x2="197" y2="262"/>   <!-- seat tube -->
    <line x1="262" y1="170" x2="197" y2="262"/>   <!-- down tube -->
    <line x1="162" y1="165" x2="258" y2="165"/>   <!-- top tube -->
    <line x1="162" y1="170" x2="105" y2="265"/>   <!-- seat stay -->
    <line x1="197" y1="262" x2="105" y2="265"/>   <!-- chain stay -->
    <line x1="262" y1="150" x2="266" y2="182"/>   <!-- head tube -->
    <line x1="264" y1="162" x2="305" y2="265"/>   <!-- fork -->
    <line x1="158" y1="160" x2="152" y2="140"/>   <!-- seat post -->
  </g>

  <!-- saddle -->
  <path d="M132 138 Q152 128 172 138 Q152 148 132 138 Z" fill="#333"/>

  <!-- handlebar -->
  <path d="M262 150 Q250 132 268 126 Q284 122 286 136" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- crank & pedals -->
  <circle cx="197" cy="263" r="16" fill="none" stroke="#333" stroke-width="4"/>
  <line x1="178" y1="246" x2="216" y2="280" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="168" y1="246" x2="184" y2="246" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="210" y1="286" x2="226" y2="286" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== PELICAN ===== -->
  <!-- legs -->
  <g stroke="#e07b39" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M158 142 Q150 200 176 244"/>
    <path d="M176 142 Q200 210 218 282"/>
  </g>
  <path d="M168 246 l14 -4 l2 8 l-16 2 Z" fill="#e07b39"/>
  <path d="M212 284 l14 -4 l2 8 l-16 2 Z" fill="#e07b39"/>

  <!-- tail feathers -->
  <path d="M124 108 L82 88 L96 112 L78 118 L122 128 Z" fill="#e8e8ee" stroke="#9aa" stroke-width="2"/>

  <!-- body -->
  <ellipse cx="165" cy="115" rx="48" ry="36" fill="#f7f7fb" stroke="#9aa" stroke-width="2.5"/>

  <!-- neck -->
  <path d="M196 92 Q214 62 236 60 L248 78 Q224 88 208 112 Z" fill="#f7f7fb" stroke="#9aa" stroke-width="2.5"/>

  <!-- head -->
  <circle cx="241" cy="64" r="16" fill="#f7f7fb" stroke="#9aa" stroke-width="2.5"/>

  <!-- beak with pouch -->
  <path d="M252 55 Q292 55 330 72 Q296 82 254 76 Z" fill="#f4a259" stroke="#c97b35" stroke-width="2"/>
  <path d="M254 76 Q292 82 328 73 Q300 112 258 82 Z" fill="#e76f51" stroke="#c97b35" stroke-width="2"/>

  <!-- eye -->
  <circle cx="245" cy="60" r="3.5" fill="#222"/>
  <circle cx="246" cy="59" r="1.2" fill="#fff"/>

  <!-- wing reaching to handlebar -->
  <path d="M168 100 Q210 96 258 130 Q268 138 258 144 Q212 128 172 124 Q160 112 168 100 Z"
        fill="#dfe0e8" stroke="#9aa" stroke-width="2.5"/>
  <path d="M186 112 Q216 116 244 132" stroke="#9aa" stroke-width="1.5" fill="none"/>

  <!-- little scarf flapping in the wind -->
  <path d="M214 88 Q196 84 178 92 Q188 98 200 96 Q190 104 176 106 Q192 112 208 100 Z"
        fill="#2a9d8f" stroke="#1f7a6f" stroke-width="1.5"/>
</svg>