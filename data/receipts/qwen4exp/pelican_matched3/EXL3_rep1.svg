<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky background -->
  <rect width="800" height="600" fill="#bde3f5"/>
  <circle cx="700" cy="90" r="45" fill="#ffd75e"/>
  <!-- Ground -->
  <rect x="0" y="540" width="800" height="60" fill="#8fce8f"/>

  <!-- ===== BICYCLE ===== -->
  <g stroke-linecap="round">
    <!-- Rear wheel -->
    <circle cx="220" cy="450" r="90" fill="none" stroke="#222" stroke-width="8"/>
    <circle cx="220" cy="450" r="10" fill="#555"/>
    <g stroke="#888" stroke-width="2.5">
      <line x1="220" y1="365" x2="220" y2="535"/>
      <line x1="135" y1="450" x2="305" y2="450"/>
      <line x1="160" y1="390" x2="280" y2="510"/>
      <line x1="280" y1="390" x2="160" y2="510"/>
    </g>
    <!-- Front wheel -->
    <circle cx="560" cy="450" r="90" fill="none" stroke="#222" stroke-width="8"/>
    <circle cx="560" cy="450" r="10" fill="#555"/>
    <g stroke="#888" stroke-width="2.5">
      <line x1="560" y1="365" x2="560" y2="535"/>
      <line x1="475" y1="450" x2="645" y2="450"/>
      <line x1="500" y1="390" x2="620" y2="510"/>
      <line x1="620" y1="390" x2="500" y2="510"/>
    </g>

    <!-- Frame -->
    <g stroke="#d33" stroke-width="9" fill="none">
      <line x1="220" y1="450" x2="330" y2="320"/>  <!-- seat stay -->
      <line x1="220" y1="450" x2="390" y2="450"/>  <!-- chain stay -->
      <line x1="390" y1="450" x2="330" y2="320"/>  <!-- seat tube -->
      <line x1="330" y1="320" x2="520" y2="300"/>  <!-- top tube -->
      <line x1="390" y1="450" x2="525" y2="305"/>  <!-- down tube -->
      <line x1="522" y1="302" x2="560" y2="450"/>  <!-- fork -->
    </g>

    <!-- Handlebar -->
    <path d="M 522 300 Q 530 265 560 265" fill="none" stroke="#333" stroke-width="8"/>
    <!-- Seat -->
    <path d="M 300 315 Q 330 300 362 315 Q 340 328 300 315" fill="#333"/>
    <!-- Chainring and pedals -->
    <circle cx="390" cy="450" r="26" fill="none" stroke="#333" stroke-width="5"/>
    <line x1="390" y1="450" x2="425" y2="478" stroke="#333" stroke-width="6"/>
    <line x1="390" y1="450" x2="355" y2="422" stroke="#333" stroke-width="6"/>
    <rect x="410" y="474" width="32" height="9" rx="3" fill="#555"/>
    <rect x="340" y="413" width="32" height="9" rx="3" fill="#555"/>
  </g>

  <!-- ===== PELICAN ===== -->
  <g>
    <!-- Back leg (pedaling up) -->
    <path d="M 340 330 L 360 380 L 356 415" fill="none" stroke="#e8912d" stroke-width="7" stroke-linecap="round"/>
    <path d="M 356 415 l -16 4 l 20 6 l 14 -6 z" fill="#e8912d"/>

    <!-- Tail feathers -->
    <path d="M 245 275 L 195 255 L 215 285 L 190 295 L 250 305 Z" fill="#e8e8e8" stroke="#bbb" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="320" cy="290" rx="82" ry="55" fill="#fff" stroke="#bbb" stroke-width="3"/>

    <!-- Wing -->
    <path d="M 265 265 Q 340 240 385 290 Q 340 330 275 315 Q 300 290 265 265 Z"
          fill="#dfe6ec" stroke="#aab4be" stroke-width="3"/>
    <path d="M 290 285 Q 330 275 360 292 M 285 300 Q 325 295 350 305" fill="none" stroke="#aab4be" stroke-width="2"/>

    <!-- Neck -->
    <path d="M 355 255 Q 370 200 405 175 L 445 185 Q 420 215 405 262 Z" fill="#fff" stroke="#bbb" stroke-width="3"/>

    <!-- Head -->
    <circle cx="428" cy="172" r="28" fill="#fff" stroke="#bbb" stroke-width="3"/>

    <!-- Beak with pouch -->
    <path d="M 448 158 Q 520 152 575 168 Q 520 178 470 180 Z" fill="#f0a830" stroke="#c77f1a" stroke-width="2"/>
    <path d="M 450 178 Q 500 235 560 172 Q 520 190 470 188 Z" fill="#f6bd52" stroke="#c77f1a" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="438" cy="163" r="5.5" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="439.5" cy="162.5" r="2.5" fill="#222"/>

    <!-- Crest tuft -->
    <path d="M 415 146 Q 408 130 418 124 Q 420 136 428 142" fill="#fff" stroke="#bbb" stroke-width="2.5"/>

    <!-- Front leg (pedaling down) -->
    <path d="M 355 335 L 395 400 L 418 468" fill="none" stroke="#e8912d" stroke-width="8" stroke-linecap="round"/>
    <path d="M 418 468 l -16 6 l 24 8 l 16 -8 z" fill="#e8912d"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#7ab" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="80" y1="380" x2="130" y2="380"/>
    <line x1="60" y1="420" x2="120" y2="420"/>
    <line x1="85" y1="460" x2="125" y2="460"/>
  </g>
</svg>