<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <!-- sky & ground -->
  <rect width="600" height="420" fill="#cfeaf5"/>
  <line x1="0" y1="362" x2="600" y2="362" stroke="#7a8a6f" stroke-width="4"/>
  <circle cx="530" cy="60" r="30" fill="#ffd94a"/>

  <!-- ===== BICYCLE ===== -->
  <g stroke="#333" stroke-width="8" fill="none" stroke-linecap="round">
    <!-- wheels -->
    <circle cx="150" cy="300" r="58"/>
    <circle cx="450" cy="300" r="58"/>
    <!-- spokes -->
    <g stroke-width="3">
      <line x1="150" y1="245" x2="150" y2="355"/>
      <line x1="95" y1="300" x2="205" y2="300"/>
      <line x1="111" y1="261" x2="189" y2="339"/>
      <line x1="189" y1="261" x2="111" y2="339"/>
      <line x1="450" y1="245" x2="450" y2="355"/>
      <line x1="395" y1="300" x2="505" y2="300"/>
      <line x1="411" y1="261" x2="489" y2="339"/>
      <line x1="489" y1="261" x2="411" y2="339"/>
    </g>
    <!-- frame -->
    <g stroke="#c0392b" stroke-width="9">
      <line x1="150" y1="300" x2="222" y2="205"/>
      <line x1="222" y1="205" x2="290" y2="300"/>
      <line x1="222" y1="205" x2="412" y2="200"/>
      <line x1="290" y1="300" x2="412" y2="200"/>
      <line x1="150" y1="300" x2="290" y2="300"/>
      <line x1="412" y1="200" x2="450" y2="300"/>
    </g>
    <!-- handlebar -->
    <path d="M 412 200 L 408 175 Q 406 165 392 168 L 378 172"/>
    <!-- chain ring & chain -->
    <circle cx="290" cy="300" r="16" stroke="#333" stroke-width="5"/>
    <line x1="150" y1="292" x2="290" y2="290" stroke-width="3"/>
    <line x1="150" y1="308" x2="290" y2="310" stroke-width="3"/>
  </g>
  <!-- seat -->
  <ellipse cx="222" cy="199" rx="26" ry="8" fill="#333"/>
  <!-- crank & pedals -->
  <g stroke="#333" stroke-width="6" stroke-linecap="round">
    <line x1="290" y1="300" x2="330" y2="325"/>
    <line x1="290" y1="300" x2="250" y2="275"/>
    <line x1="320" y1="330" x2="345" y2="330" stroke-width="8"/>
    <line x1="240" y1="270" x2="262" y2="270" stroke-width="8"/>
  </g>

  <!-- ===== PELICAN ===== -->
  <!-- legs (behind body) -->
  <g stroke="#e76f51" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="235,210 252,250 250,268"/>
    <polyline points="262,212 300,265 328,322"/>
    <path d="M 250 268 l -14 4 M 250 268 l 2 8" stroke-width="5"/>
    <path d="M 328 322 l -12 6 M 328 322 l 4 8" stroke-width="5"/>
  </g>

  <!-- tail -->
  <path d="M 195 155 L 140 138 L 165 170 L 142 180 L 200 190 Z"
        fill="#f5f5f5" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/>

  <!-- neck -->
  <path d="M 285 165 Q 292 115 322 92 Q 342 78 360 78"
        fill="none" stroke="#8a8a8a" stroke-width="30" stroke-linecap="round"/>
  <path d="M 285 165 Q 292 115 322 92 Q 342 78 360 78"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="255" cy="172" rx="72" ry="46" fill="#ffffff" stroke="#8a8a8a" stroke-width="3"/>

  <!-- head -->
  <circle cx="362" cy="82" r="21" fill="#ffffff" stroke="#8a8a8a" stroke-width="3"/>

  <!-- beak with pouch -->
  <path d="M 378 72 Q 440 76 478 88 Q 460 96 452 98 Q 455 132 420 138 Q 392 140 376 100 Z"
        fill="#f4a261" stroke="#c65d3b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 380 78 Q 435 82 470 90" fill="none" stroke="#c65d3b" stroke-width="3"/>

  <!-- eye -->
  <circle cx="360" cy="76" r="4" fill="#222"/>

  <!-- wing reaching to handlebar -->
  <path d="M 245 152 Q 305 122 352 155 Q 378 168 380 172 Q 372 180 340 186 Q 285 194 250 172 Q 240 162 245 152 Z"
        fill="#f0f0f0" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#8a8a8a" stroke-width="2">
    <path d="M 275 150 Q 300 170 335 176"/>
    <path d="M 300 143 Q 322 162 352 168"/>
  </g>
</svg>