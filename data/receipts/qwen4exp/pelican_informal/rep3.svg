<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect width="500" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="500" height="80" fill="#8B7355"/>
  <line x1="0" y1="320" x2="500" y2="320" stroke="#6B5335" stroke-width="3"/>
  
  <!-- Bicycle - Back Wheel -->
  <circle cx="150" cy="280" r="60" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="150" cy="280" r="55" fill="none" stroke="#666" stroke-width="1"/>
  <!-- Spokes back wheel -->
  <line x1="150" y1="220" x2="150" y2="340" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="280" x2="210" y2="280" stroke="#555" stroke-width="1.5"/>
  <line x1="108" y1="238" x2="192" y2="322" stroke="#555" stroke-width="1.5"/>
  <line x1="192" y1="238" x2="108" y2="322" stroke="#555" stroke-width="1.5"/>
  <circle cx="150" cy="280" r="8" fill="#333"/>
  
  <!-- Bicycle - Front Wheel -->
  <circle cx="350" cy="280" r="60" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="350" cy="280" r="55" fill="none" stroke="#666" stroke-width="1"/>
  <!-- Spokes front wheel -->
  <line x1="350" y1="220" x2="350" y2="340" stroke="#555" stroke-width="1.5"/>
  <line x1="290" y1="280" x2="410" y2="280" stroke="#555" stroke-width="1.5"/>
  <line x1="308" y1="238" x2="392" y2="322" stroke="#555" stroke-width="1.5"/>
  <line x1="392" y1="238" x2="308" y2="322" stroke="#555" stroke-width="1.5"/>
  <circle cx="350" cy="280" r="8" fill="#333"/>
  
  <!-- Bicycle Frame -->
  <!-- Main triangle -->
  <line x1="150" y1="280" x2="230" y2="180" stroke="#CC2222" stroke-width="5" stroke-linecap="round"/>
  <line x1="230" y1="180" x2="270" y2="180" stroke="#CC2222" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="180" x2="310" y2="240" stroke="#CC2222" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="280" x2="310" y2="240" stroke="#CC2222" stroke-width="5" stroke-linecap="round"/>
  <!-- Down tube to front hub -->
  <line x1="310" y1="240" x2="350" y2="280" stroke="#CC2222" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat post -->
  <line x1="230" y1="180" x2="220" y2="155" stroke="#CC2222" stroke-width="4" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="270" y1="180" x2="290" y2="140" stroke="#CC2222" stroke-width="4" stroke-linecap="round"/>
  <!-- Handlebars -->
  <path d="M 270 130 Q 290 120 310 135" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M 290 140 L 290 120 Q 290 115 295 115" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <path d="M 290 140 L 290 120 Q 290 115 285 115" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="220" cy="152" rx="20" ry="8" fill="#333"/>
  
  <!-- Pedal crank -->
  <circle cx="230" cy="240" r="15" fill="none" stroke="#555" stroke-width="3"/>
  <line x1="230" y1="240" x2="245" y2="260" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="240" x2="215" y2="220" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Pedals -->
  <rect x="240" y="256" width="16" height="6" rx="2" fill="#333" transform="rotate(20 248 259)"/>
  <rect x="209" y="214" width="16" height="6" rx="2" fill="#333" transform="rotate(20 217 217)"/>
  
  <!-- Pelican Body (white) -->
  <ellipse cx="240" cy="190" rx="45" ry="55" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  
  <!-- Pelican neck (curved) -->
  <path d="M 210 170 Q 200 120 230 95 Q 250 80 270 85" fill="none" stroke="#F5F5F5" stroke-width="22" stroke-linecap="round"/>
  <path d="M 210 170 Q 200 120 230 95 Q 250 80 270 85" fill="none" stroke="#DDD" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Pelican Head -->
  <ellipse cx="275" cy="82" rx="18" ry="16" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  
  <!-- Pelican Eye -->
  <circle cx="278" cy="78" r="4" fill="#111"/>
  <circle cx="279" cy="77" r="1.5" fill="#FFF"/>
  
  <!-- Pelican Beak (large with throat pouch) -->
  <!-- Upper beak -->
  <path d="M 290 75 Q 340 60 355 80 Q 340 78 310 82 Q 295 80 290 75 Z" fill="#FFB347" stroke="#E09530" stroke-width="1"/>
  <!-- Lower beak / throat pouch -->
  <path d="M 290 85 Q 310 100 330 95 Q 350 88 355 82 Q 340 78 310 82 Q 295 83 290 85 Z" fill="#FFCC80" stroke="#E09530" stroke-width="1"/>
  <!-- Pouch detail -->
  <path d="M 310 85 Q 315 95 325 92" fill="none" stroke="#E09530" stroke-width="1" opacity="0.6"/>
  <path d="M 320 86 Q 325 94 332 91" fill="none" stroke="#E09530" stroke-width="1" opacity="0.6"/>
  
  <!-- Pelican Wing (on side, slightly extended for balance) -->
  <path d="M 210 185 Q 180 170 165 195 Q 175 215 205 205 Q 195 195 210 185 Z" fill="#E8E8E8" stroke="#CCC" stroke-width="1.5"/>
  <!-- Wing feather lines -->
  <path d="M 190 188 L 175 200" fill="none" stroke="#CCC" stroke-width="1"/>
  <path d="M 195 192 L 180 204" fill="none" stroke="#CCC" stroke-width="1"/>
  
  <!-- Pelican Legs reaching to pedals -->
  <!-- Right leg (on lower pedal) -->
  <path d="M 235 235 Q 238 245 242 258" fill="none" stroke="#FFB347" stroke-width="5" stroke-linecap="round"/>
  <!-- Right foot -->
  <path d="M 242 258 L 252 262 L 248 258 L 254 256" fill="none" stroke="#FFB347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left leg (on upper pedal) -->
  <path d="M 225 228 Q 220 215 216 220" fill="none" stroke="#FFB347" stroke-width="5" stroke-linecap="round"/>
  <!-- Left foot -->
  <path d="M 216 220 L 206 218 L 210 222 L 204 220" fill="none" stroke="#FFB347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tail feathers -->
  <path d="M 195 200 Q 175 210 170 225 Q 180 215 195 210" fill="#E0E0E0" stroke="#CCC" stroke-width="1"/>
  <path d="M 198 205 Q 180 218 175 232 Q 185 222 200 212" fill="#D8D8D8" stroke="#CCC" stroke-width="1"/>
  
  <!-- Clouds -->
  <ellipse cx="60" cy="60" rx="35" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="85" cy="55" rx="25" ry="15" fill="white" opacity="0.9"/>
  <ellipse cx="40" cy="65" rx="20" ry="12" fill="white" opacity="0.9"/>
  
  <ellipse cx="400" cy="45" rx="30" ry="16" fill="white" opacity="0.85"/>
  <ellipse cx="425" cy="40" rx="22" ry="13" fill="white" opacity="0.85"/>
  <ellipse cx="380" cy="50" rx="18" ry="11" fill="white" opacity="0.85"/>
  
  <ellipse cx="300" cy="80" rx="28" ry="14" fill="white" opacity="0.8"/>
  <ellipse cx="325" cy="75" rx="20" ry="12" fill="white" opacity="0.8"/>
</svg>