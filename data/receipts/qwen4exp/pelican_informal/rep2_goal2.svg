<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="340" cy="60" r="30" fill="#FFD700" opacity="0.9"/>
  <g stroke="#FFD700" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="340" y1="20" x2="340" y2="10"/>
    <line x1="340" y1="100" x2="340" y2="110"/>
    <line x1="300" y1="60" x2="290" y2="60"/>
    <line x1="380" y1="60" x2="390" y2="60"/>
    <line x1="312" y1="32" x2="305" y2="25"/>
    <line x1="368" y1="88" x2="375" y2="95"/>
    <line x1="368" y1="32" x2="375" y2="25"/>
    <line x1="312" y1="88" x2="305" y2="95"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="60" cy="60" rx="25" ry="15"/>
    <ellipse cx="90" cy="65" rx="30" ry="18"/>
    <ellipse cx="120" cy="60" rx="25" ry="12"/>
  </g>
  <g fill="white" opacity="0.6">
    <ellipse cx="250" cy="100" rx="20" ry="10"/>
    <ellipse cx="275" cy="105" rx="25" ry="12"/>
  </g>

  <!-- Ground -->
  <path d="M 0 320 Q 100 310 200 320 T 400 320 L 400 400 L 0 400 Z" fill="#228B22"/>
  
  <!-- Road -->
  <rect x="0" y="330" width="400" height="70" fill="#666"/>
  <!-- Road Dashes -->
  <line x1="20" y1="365" x2="60" y2="365" stroke="#FFF" stroke-width="4" stroke-dasharray="15, 10"/>
  <line x1="100" y1="365" x2="300" y2="365" stroke="#FFF" stroke-width="4" stroke-dasharray="15, 10"/>
  <line x1="340" y1="365" x2="380" y2="365" stroke="#FFF" stroke-width="4" stroke-dasharray="15, 10"/>

  <!-- BICYCLE -->
  <g id="bicycle">
    <!-- Rear Wheel -->
    <circle cx="110" cy="300" r="50" fill="#111" stroke="#333" stroke-width="8"/>
    <circle cx="110" cy="300" r="42" fill="none" stroke="#888" stroke-width="2"/>
    <g stroke="#AAA" stroke-width="2">
      <line x1="110" y1="258" x2="110" y2="342"/>
      <line x1="68" y1="300" x2="152" y2="300"/>
      <line x1="80" y1="270" x2="140" y2="330"/>
      <line x1="80" y1="330" x2="140" y2="270"/>
    </g>

    <!-- Front Wheel -->
    <circle cx="290" cy="300" r="50" fill="#111" stroke="#333" stroke-width="8"/>
    <circle cx="290" cy="300" r="42" fill="none" stroke="#888" stroke-width="2"/>
    <g stroke="#AAA" stroke-width="2">
      <line x1="290" y1="258" x2="290" y2="342"/>
      <line x1="248" y1="300" x2="332" y2="300"/>
      <line x1="260" y1="270" x2="320" y2="330"/>
      <line x1="260" y1="330" x2="320" y2="270"/>
    </g>

    <!-- Chainring -->
    <circle cx="200" cy="300" r="18" fill="none" stroke="#444" stroke-width="4"/>

    <!-- Frame (Crimson) -->
    <!-- Chainstay -->
    <line x1="110" y1="300" x2="200" y2="300" stroke="#C41E3A" stroke-width="6" stroke-linecap="round"/>
    <!-- Seat stay -->
    <line x1="110" y1="300" x2="175" y2="190" stroke="#C41E3A" stroke-width="6" stroke-linecap="round"/>
    <!-- Seat tube -->
    <line x1="200" y1="300" x2="175" y2="190" stroke="#C41E3A" stroke-width="6" stroke-linecap="round"/>
    <!-- Top tube -->
    <line x1="175" y1="190" x2="275" y2="195" stroke="#C41E3A" stroke-width="6" stroke-linecap="round"/>
    <!-- Down tube -->
    <line x1="200" y1="300" x2="275" y2="195" stroke="#C41E3A" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Seat -->
    <line x1="175" y1="190" x2="170" y2="180" stroke="#444" stroke-width="6"/>
    <path d="M 155 180 L 185 180 Q 190 170 185 168 L 158 170 Z" fill="#444"/>

    <!-- Handlebar Stem & Bar -->
    <line x1="275" y1="195" x2="270" y2="165" stroke="#444" stroke-width="6"/>
    <path d="M 255 160 Q 270 150 285 160" fill="none" stroke="#444" stroke-width="6" stroke-linecap="round"/>

    <!-- Crank Arm (Right) -->
    <line x1="200" y1="300" x2="212" y2="320" stroke="#666" stroke-width="5"/>
    <!-- Pedal -->
    <line x1="205" y1="320" x2="220" y2="320" stroke="#222" stroke-width="5" stroke-linecap="round"/>

    <!-- Crank Arm (Left) -->
    <line x1="200" y1="300" x2="188" y2="280" stroke="#666" stroke-width="5"/>
    <line x1="180" y1="280" x2="195" y2="280" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- PELICAN -->
  <g id="pelican">
    <!-- Tail -->
    <path d="M 150 160 L 125 150 L 130 140 L 125 130 L 155 140 Z" fill="#E8DCC8" stroke="#D4C4A8" stroke-width="1.5"/>

    <!-- Back Leg (Left) -->
    <path d="M 170 200 L 190 240 L 188 280" fill="none" stroke="#FF8C00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="192" cy="280" rx="10" ry="4" fill="#FF8C00"/>

    <!-- Body -->
    <path d="M 145 170 C 145 120 245 120 245 170 C 245 210 145 210 145 170 Z" fill="#F5F5DC" stroke="#D4C4A8" stroke-width="2"/>
    
    <!-- Neck (S-Curve) -->
    <path d="M 210 135 Q 240 90 195 65" fill="none" stroke="#F5F5DC" stroke-width="20" stroke-linecap="round"/>
    <path d="M 210 135 Q 240 90 195 65" fill="none" stroke="#E8DCC8" stroke-width="15" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="195" cy="65" r="18" fill="#F5F5DC"/>

    <!-- Beak & Pouch -->
    <!-- Throat Pouch (Huge) -->
    <path d="M 198 68 Q 210 100 240 115 Q 260 115 275 72" fill="#FFB347" stroke="#E09000" stroke-width="1.5"/>
    <path d="M 215 90 Q 230 105 250 100" fill="none" stroke="#D49500" stroke-width="2" opacity="0.5"/>
    
    <!-- Upper Beak -->
    <path d="M 195 60 Q 250 45 275 70 Q 272 73 270 72 Q 245 55 195 65 Z" fill="#FFA500" stroke="#E09000" stroke-width="1"/>
    <!-- Lower Beak Edge -->
    <path d="M 198 68 L 275 70" stroke="#E09000" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="190" cy="60" r="4" fill="#111"/>
    <circle cx="189" cy="59" r="1.5" fill="#FFF"/>

    <!-- Wing (Folded) -->
    <path d="M 160 140 Q 200 140 230 180 Q 200 205 170 170 Z" fill="#E8DCC8" stroke="#D4C4A8" stroke-width="1.5"/>
    <!-- Feathers detail -->
    <path d="M 175 155 Q 195 170 215 185" fill="none" stroke="#D4C4A8" stroke-width="1"/>
    <path d="M 170 165 Q 190 180 210 195" fill="none" stroke="#D4C4A8" stroke-width="1"/>

    <!-- Front Wing (Reaching for handlebars) -->
    <path d="M 180 135 Q 225 130 265 160 Q 275 165 270 155 Q 240 120 185 125 Z" fill="#F5F5DC" stroke="#D4C4A8" stroke-width="1.5"/>

    <!-- Front Leg (Right) -->
    <path d="M 185 205 L 205 250 L 212 320" fill="none" stroke="#FFA500" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="214" cy="320" rx="10" ry="4" fill="#FFA500" transform="rotate(-10 214 320)"/>
  </g>
</svg>