<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background Sky -->
  <rect width="800" height="600" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="700" cy="100" r="50" fill="#FFD700" opacity="0.8"/>

  <!-- Ground -->
  <rect x="0" y="480" width="800" height="120" fill="#8B4513"/>
  <rect x="0" y="480" width="800" height="10" fill="#556B2F"/> <!-- Grass edge -->

  <!-- BICYCLE -->
  <g stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Back Wheel -->
    <circle cx="250" cy="380" r="90" fill="none" stroke="#333" stroke-width="8"/>
    <circle cx="250" cy="380" r="85" fill="none" stroke="#888" stroke-width="2"/>
    <!-- Spokes Back -->
    <line x1="250" y1="290" x2="250" y2="470" stroke="#AAA" stroke-width="2"/>
    <line x1="160" y1="380" x2="340" y2="380" stroke="#AAA" stroke-width="2"/>
    <line x1="186" y1="316" x2="314" y2="444" stroke="#AAA" stroke-width="2"/>
    <line x1="314" y1="316" x2="186" y2="444" stroke="#AAA" stroke-width="2"/>
    <circle cx="250" cy="380" r="12" fill="#333"/>

    <!-- Front Wheel -->
    <circle cx="550" cy="380" r="90" fill="none" stroke="#333" stroke-width="8"/>
    <circle cx="550" cy="380" r="85" fill="none" stroke="#888" stroke-width="2"/>
    <!-- Spokes Front -->
    <line x1="550" y1="290" x2="550" y2="470" stroke="#AAA" stroke-width="2"/>
    <line x1="460" y1="380" x2="640" y2="380" stroke="#AAA" stroke-width="2"/>
    <line x1="486" y1="316" x2="614" y2="444" stroke="#AAA" stroke-width="2"/>
    <line x1="614" y1="316" x2="486" y2="444" stroke="#AAA" stroke-width="2"/>
    <circle cx="550" cy="380" r="12" fill="#333"/>

    <!-- Frame (Red) -->
    <path d="M 250 380 L 350 240 L 550 380" fill="none" stroke="#E74C3C" stroke-width="10"/>
    <path d="M 350 240 L 450 240 L 500 340 L 250 380" fill="none" stroke="#E74C3C" stroke-width="8"/>
    <path d="M 450 240 L 550 380" fill="none" stroke="#E74C3C" stroke-width="10"/>
    
    <!-- Chainring area -->
    <circle cx="350" cy="320" r="25" fill="none" stroke="#555" stroke-width="4"/>
    <line x1="350" y1="320" x2="350" y2="380" stroke="#333" stroke-width="6"/> <!-- Seat tube bottom part visual -->
    
    <!-- Crank arms -->
    <line x1="350" y1="320" x2="370" y2="350" stroke="#333" stroke-width="6"/>
    <line x1="350" y1="320" x2="330" y2="290" stroke="#333" stroke-width="6"/>
    
    <!-- Pedals -->
    <rect x="360" y="345" width="30" height="10" fill="#222" transform="rotate(20 375 350)"/>
    <rect x="320" y="285" width="30" height="10" fill="#222" transform="rotate(20 335 290)"/>

    <!-- Seat Post -->
    <line x1="350" y1="240" x2="340" y2="200" stroke="#333" stroke-width="6"/>
    <!-- Seat -->
    <path d="M 310 200 Q 340 190 370 200 Q 340 210 310 200 Z" fill="#333"/>

    <!-- Handlebar Stem -->
    <line x1="450" y1="240" x2="460" y2="180" stroke="#333" stroke-width="6"/>
    <!-- Handlebars -->
    <path d="M 440 180 Q 460 160 480 180" fill="none" stroke="#333" stroke-width="6"/>
  </g>

  <!-- PELICAN -->
  <g>
    <!-- Tail Feathers -->
    <path d="M 280 280 Q 200 250 180 220 Q 210 240 290 260 Z" fill="#F0F0F0" stroke="#CCC"/>
    <path d="M 285 290 Q 200 270 170 250 Q 210 265 295 280 Z" fill="#E0E0E0" stroke="#CCC"/>

    <!-- Left Leg (Back leg, on top pedal) -->
    <!-- Thigh to knee -->
    <path d="M 320 260 Q 310 280 325 290" fill="none" stroke="#FFB347" stroke-width="12" stroke-linecap="round"/>
    <!-- Shin to foot -->
    <path d="M 325 290 L 335 290" fill="none" stroke="#FFB347" stroke-width="10" stroke-linecap="round"/>

    <!-- Pelican Body (Main torso) -->
    <ellipse cx="340" cy="220" rx="60" ry="70" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>
    
    <!-- Wing (Left side, tucked) -->
    <path d="M 310 200 Q 280 230 300 270 Q 330 250 340 210 Z" fill="#F5F5F5" stroke="#CCC"/>
    <path d="M 315 220 L 295 245 M 325 230 L 305 255" fill="none" stroke="#DDD" stroke-width="2"/>

    <!-- Right Leg (Front leg, on bottom pedal) -->
    <path d="M 340 250 Q 350 280 365 345" fill="none" stroke="#FFB347" stroke-width="12" stroke-linecap="round"/>
    <path d="M 365 345 L 385 350" fill="none" stroke="#FFB347" stroke-width="10" stroke-linecap="round"/>

    <!-- Neck -->
    <!-- Curving up and right -->
    <path d="M 370 180 Q 380 100 430 90" fill="none" stroke="#FFFFFF" stroke-width="35" stroke-linecap="round"/>
    <!-- Neck shadow/outline detail -->
    <path d="M 370 180 Q 380 100 430 90" fill="none" stroke="#EEE" stroke-width="1" opacity="0.5"/>

    <!-- Head -->
    <circle cx="440" cy="90" r="25" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>
    
    <!-- Eye -->
    <circle cx="445" cy="85" r="5" fill="#111"/>
    <circle cx="446" cy="84" r="1.5" fill="#FFF"/>

    <!-- Beak Upper -->
    <path d="M 450 85 Q 520 80 530 95 Q 510 90 455 95 Z" fill="#FF9F43" stroke="#E17055" stroke-width="1"/>
    <!-- Beak Hook -->
    <path d="M 525 92 Q 530 98 525 98 Q 520 95 525 92 Z" fill="#E17055"/>
    
    <!-- Beak Lower & Pouch -->
    <path d="M 450 95 Q 500 130 525 95 Q 510 100 460 100 Z" fill="#FFBE76" stroke="#E17055" stroke-width="1"/>
    
    <!-- Pouch Texture Lines -->
    <path d="M 470 100 Q 480 115 490 105" fill="none" stroke="#E17055" stroke-width="1" opacity="0.5"/>
    <path d="M 485 102 Q 495 112 505 100" fill="none" stroke="#E17055" stroke-width="1" opacity="0.5"/>

    <!-- Wing (Right side, holding handlebar) -->
    <path d="M 360 190 Q 400 190 440 175 Q 420 210 370 210 Z" fill="#F0F0F0" stroke="#CCC"/>
    <!-- Feathers on holding wing -->
    <path d="M 430 178 L 445 178" stroke="#CCC" stroke-width="1"/>
  </g>

  <!-- Speed Lines (Motion) -->
  <path d="M 150 300 L 100 300 M 160 320 L 110 320 M 150 340 L 90 340" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 140 280 L 80 280 M 150 260 L 90 260" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>