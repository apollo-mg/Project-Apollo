<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Background -->
  <rect width="400" height="350" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="280" width="400" height="70" fill="#8B7355"/>
  
  <!-- Road -->
  <rect x="0" y="280" width="400" height="8" fill="#555"/>
  
  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="120" cy="250" r="35" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="120" cy="250" r="30" fill="none" stroke="#555" stroke-width="1"/>
  <!-- Spokes rear -->
  <line x1="120" y1="215" x2="120" y2="285" stroke="#666" stroke-width="1"/>
  <line x1="85" y1="250" x2="155" y2="250" stroke="#666" stroke-width="1"/>
  <line x1="95" y1="225" x2="145" y2="275" stroke="#666" stroke-width="1"/>
  <line x1="95" y1="275" x2="145" y2="225" stroke="#666" stroke-width="1"/>
  
  <!-- Front wheel -->
  <circle cx="280" cy="250" r="35" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="280" cy="250" r="30" fill="none" stroke="#555" stroke-width="1"/>
  <!-- Spokes front -->
  <line x1="280" y1="215" x2="280" y2="285" stroke="#666" stroke-width="1"/>
  <line x1="245" y1="250" x2="315" y2="250" stroke="#666" stroke-width="1"/>
  <line x1="255" y1="225" x2="305" y2="275" stroke="#666" stroke-width="1"/>
  <line x1="255" y1="275" x2="305" y2="225" stroke="#666" stroke-width="1"/>
  
  <!-- Bicycle frame -->
  <path d="M 120 250 L 170 200 L 230 200 L 280 250" fill="none" stroke="#C41E3A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 170 200 L 200 250" fill="none" stroke="#C41E3A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 230 200 L 200 250" fill="none" stroke="#C41E3A" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Seat post and seat -->
  <line x1="185" y1="200" x2="175" y2="175" stroke="#333" stroke-width="4"/>
  <ellipse cx="172" cy="172" rx="18" ry="8" fill="#222"/>
  
  <!-- Handlebars -->
  <line x1="255" y1="180" x2="270" y2="160" stroke="#333" stroke-width="4"/>
  <line x1="270" y1="160" x2="290" y2="155" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="160" x2="250" y2="155" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pelican body -->
  <!-- Body -->
  <ellipse cx="195" cy="155" rx="35" ry="45" fill="#F5F5DC" stroke="#D4C4A8" stroke-width="2"/>
  
  <!-- Wing on visible side -->
  <path d="M 165 140 Q 150 180 170 200 Q 180 190 185 160 Z" fill="#E8DCC8" stroke="#D4C4A8" stroke-width="1.5"/>
  
  <!-- Tail feathers -->
  <path d="M 160 155 Q 140 140 150 130 Q 160 135 165 150 Z" fill="#E0D5C0" stroke="#D4C4A8" stroke-width="1"/>
  <path d="M 162 160 Q 138 150 145 142 Q 158 145 165 155 Z" fill="#D8CCB8" stroke="#D4C4A8" stroke-width="1"/>
  
  <!-- Neck (curved, pelican-style) -->
  <path d="M 200 120 Q 210 100 215 85 Q 218 70 210 55 Q 205 45 195 40" fill="none" stroke="#F5F5DC" stroke-width="18" stroke-linecap="round"/>
  <path d="M 200 120 Q 210 100 215 85 Q 218 70 210 55 Q 205 45 195 40" fill="none" stroke="#E8DCC8" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="195" cy="38" r="14" fill="#F5F5DC" stroke="#D4C4A8" stroke-width="1.5"/>
  
  <!-- Pelican's large beak with throat pouch -->
  <!-- Upper beak -->
  <path d="M 205 38 Q 235 30 250 28 Q 245 22 235 24 Q 220 28 205 34 Z" fill="#FFA500" stroke="#E09000" stroke-width="1"/>
  <!-- Lower beak / throat pouch -->
  <path d="M 205 38 Q 215 55 225 58 Q 240 52 248 35 Q 250 38 250 28 Q 235 30 205 38 Z" fill="#FFB347" stroke="#E09000" stroke-width="1"/>
  <!-- Pouch detail -->
  <path d="M 210 45 Q 220 52 230 54 Q 240 48 244 38" fill="none" stroke="#D49500" stroke-width="1" opacity="0.6"/>
  
  <!-- Eye -->
  <circle cx="192" cy="35" r="3.5" fill="#111"/>
  <circle cx="193" cy="34" r="1.2" fill="#FFF"/>
  
  <!-- Pelican legs reaching to pedals -->
  <path d="M 185 185 Q 190 210 205 235 Q 210 245 208 250" fill="none" stroke="#FFA500" stroke-width="5" stroke-linecap="round"/>
  <path d="M 195 185 Q 200 210 212 235 Q 215 245 212 250" fill="none" stroke="#FFA500" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Feet on pedals -->
  <ellipse cx="207" cy="252" rx="8" ry="4" fill="#FFA500" stroke="#E09000" stroke-width="1" transform="rotate(-10, 207, 252)"/>
  <ellipse cx="213" cy="252" rx="8" ry="4" fill="#FFA500" stroke="#E09000" stroke-width="1" transform="rotate(-10, 213, 252)"/>
  
  <!-- Wings holding handlebars -->
  <!-- Right wing/arm -->
  <path d="M 210 130 Q 235 140 255 155 Q 260 158 258 160 Q 252 158 248 155 Q 230 145 215 135" fill="#E8DCC8" stroke="#D4C4A8" stroke-width="1.5"/>
  
  <!-- Left wing/arm (partially visible behind body) -->
  <path d="M 205 135 Q 230 145 248 158 Q 245 160 242 158 Q 225 148 210 140" fill="#DDD0BA" stroke="#D4C4A8" stroke-width="1"/>
  
  <!-- Sun -->
  <circle cx="350" cy="40" r="20" fill="#FFD700" opacity="0.9"/>
  <g stroke="#FFD700" stroke-width="2" opacity="0.6">
    <line x1="350" y1="15" x2="350" y2="5"/>
    <line x1="350" y1="65" x2="350" y2="75"/>
    <line x1="325" y1="40" x2="315" y2="40"/>
    <line x1="375" y1="40" x2="385" y2="40"/>
    <line x1="332" y1="22" x2="325" y2="15"/>
    <line x1="368" y1="58" x2="375" y2="65"/>
    <line x1="368" y1="22" x2="375" y2="15"/>
    <line x1="332" y1="58" x2="325" y2="65"/>
  </g>
  
  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="50" cy="50" rx="25" ry="12"/>
    <ellipse cx="70" cy="45" rx="20" ry="10"/>
    <ellipse cx="35" cy="45" rx="18" ry="9"/>
    
    <ellipse cx="300" cy="80" rx="22" ry="10"/>
    <ellipse cx="318" cy="75" rx="18" ry="9"/>
    <ellipse cx="285" cy="75" rx="16" ry="8"/>
  </g>
</svg>