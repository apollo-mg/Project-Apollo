<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <defs>
    <radialGradient id="wheelGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="520" fill="#e8f4fd" rx="12"/>

  <!-- ===== BICYCLE ===== -->
  <!-- Rear Wheel -->
  <circle cx="155" cy="390" r="58" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="155" cy="390" r="4" fill="#555"/>
  <!-- Rear spokes -->
  <line x1="155" y1="332" x2="155" y2="448" stroke="#666" stroke-width="1.5"/>
  <line x1="97" y1="390" x2="213" y2="390" stroke="#666" stroke-width="1.5"/>
  <line x1="114" y1="349" x2="196" y2="431" stroke="#666" stroke-width="1.5"/>
  <line x1="196" y1="349" x2="114" y2="431" stroke="#666" stroke-width="1.5"/>
  <line x1="114" y1="349" x2="196" y2="431" stroke="#666" stroke-width="1"/>
  <line x1="103" y1="364" x2="207" y2="416" stroke="#666" stroke-width="1"/>
  <line x1="103" y1="416" x2="207" y2="364" stroke="#666" stroke-width="1"/>

  <!-- Front Wheel -->
  <circle cx="450" cy="390" r="58" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="450" cy="390" r="4" fill="#555"/>
  <!-- Front spokes -->
  <line x1="450" y1="332" x2="450" y2="448" stroke="#666" stroke-width="1.5"/>
  <line x1="392" y1="390" x2="508" y2="390" stroke="#666" stroke-width="1.5"/>
  <line x1="409" y1="349" x2="491" y2="431" stroke="#666" stroke-width="1.5"/>
  <line x1="491" y1="349" x2="409" y2="431" stroke="#666" stroke-width="1.5"/>
  <line x1="398" y1="364" x2="502" y2="416" stroke="#666" stroke-width="1"/>
  <line x1="398" y1="416" x2="502" y2="364" stroke="#666" stroke-width="1"/>

  <!-- Frame -->
  <!-- Chain stay (rear axle to bottom bracket) -->
  <line x1="155" y1="390" x2="280" y2="375" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat stay (rear axle to seat cluster) -->
  <line x1="155" y1="390" x2="210" y2="265" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat tube (bottom bracket to seat) -->
  <line x1="280" y1="375" x2="210" y2="265" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- Top tube (seat to head tube) -->
  <line x1="210" y1="265" x2="420" y2="255" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- Down tube (head tube to bottom bracket) -->
  <line x1="420" y1="255" x2="280" y2="375" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- Fork (head tube to front axle) -->
  <line x1="420" y1="255" x2="450" y2="390" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <!-- Head tube extension -->
  <line x1="420" y1="255" x2="425" y2="235" stroke="#444" stroke-width="4" stroke-linecap="round"/>

  <!-- Handlebars -->
  <path d="M 425 235 Q 440 220 455 225 Q 468 230 465 245" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- Seat -->
  <ellipse cx="208" cy="258" rx="18" ry="7" fill="#222" transform="rotate(-5 208 258)"/>
  <!-- Seat post -->
  <line x1="210" y1="265" x2="208" y2="258" stroke="#444" stroke-width="3"/>

  <!-- Pedal crank -->
  <circle cx="280" cy="375" r="6" fill="#555" stroke="#333" stroke-width="2"/>
  <!-- Crank arms -->
  <line x1="280" y1="375" x2="295" y2="395" stroke="#444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="280" y1="375" x2="265" y2="355" stroke="#444" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pedals -->
  <rect x="288" y="392" width="18" height="6" rx="2" fill="#333"/>
  <rect x="258" y="350" width="18" height="6" rx="2" fill="#333"/>

  <!-- Chain (simplified) -->
  <path d="M 155 390 Q 200 400 280 381" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- ===== PELICAN ===== -->

  <!-- Tail feathers (behind body) -->
  <path d="M 168 220 Q 140 210 130 195" fill="none" stroke="#8899aa" stroke-width="3" stroke-linecap="round"/>
  <path d="M 170 225 Q 138 220 125 210" fill="none" stroke="#99aabb" stroke-width="3" stroke-linecap="round"/>
  <path d="M 170 230 Q 140 230 128 222" fill="none" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="225" cy="220" rx="55" ry="40" fill="#f5f5f0" stroke="#ccc" stroke-width="1.5"/>

  <!-- Wing (reaching toward handlebars) -->
  <path d="M 250 225 Q 310 235 370 240 Q 395 242 415 237" fill="none" stroke="#8899aa" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <!-- Wing detail feathers -->
  <path d="M 290 232 Q 310 228 320 230" fill="none" stroke="#778899" stroke-width="1.5"/>
  <path d="M 320 235 Q 340 232 350 234" fill="none" stroke="#778899" stroke-width="1.5"/>
  <path d="M 350 237 Q 368 235 380 236" fill="none" stroke="#778899" stroke-width="1.5"/>

  <!-- Legs -->
  <!-- Right leg (on front pedal) -->
  <path d="M 245 252 Q 260 310 295 392" fill="none" stroke="#e8a735" stroke-width="4" stroke-linecap="round"/>
  <!-- Right foot on pedal -->
  <path d="M 292 392 L 305 394" stroke="#e8a735" stroke-width="4" stroke-linecap="round"/>

  <!-- Left leg (on rear pedal) -->
  <path d="M 235 255 Q 250 310 265 352" fill="none" stroke="#d4952b" stroke-width="4" stroke-linecap="round"/>
  <!-- Left foot on pedal -->
  <path d="M 262 352 L 276 354" stroke="#d4952b" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 255 200 Q 268 175 278 155" fill="none" stroke="#f5f5f0" stroke-width="14" stroke-linecap="round"/>
  <path d="M 255 200 Q 268 175 278 155" fill="none" stroke="#eee" stroke-width="12" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="282" cy="148" rx="18" ry="16" fill="#f5f5f0" stroke="#ccc" stroke-width="1"/>

  <!-- Beak (large pelican beak pointing forward-right) -->
  <path d="M 295 142 Q 340 138 390 152 Q 395 154 393 158 Q 340 155 295 150 Z" fill="#e8752a" stroke="#c45a1a" stroke-width="1"/>
  <!-- Upper beak line -->
  <path d="M 295 143 Q 340 140 392 153" fill="none" stroke="#c45a1a" stroke-width="1.5"/>

  <!-- Pouch (the signature pelican gular pouch) -->
  <path d="M 295 150 Q 330 155 390 157 Q 370 185 330 188 Q 300 185 295 165 Z" fill="#f0923a" stroke="#c45a1a" stroke-width="1" opacity="0.85"/>

  <!-- Eye -->
  <circle cx="288" cy="143" r="4" fill="#222"/>
  <circle cx="289.5" cy="142" r="1.5" fill="#fff"/>

  <!-- Nostril (subtle) -->
  <circle cx="298" cy="141" r="1" fill="#c45a1a"/>

  <!-- Head crest detail -->
  <path d="M 272 135 Q 268 128 270 122" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 275 133 Q 273 126 276 120" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body feather details -->
  <path d="M 195 210 Q 200 220 198 230" fill="none" stroke="#ddd" stroke-width="1"/>
  <path d="M 210 205 Q 213 218 210 228" fill="none" stroke="#ddd" stroke-width="1"/>
  <path d="M 225 202 Q 226 215 224 225" fill="none" stroke="#ddd" stroke-width="1"/>

  <!-- Wing covering (on top of body) -->
  <path d="M 185 210 Q 220 200 260 215 Q 270 225 265 235 Q 240 240 200 238 Q 180 230 185 210 Z" fill="#a8b8c8" stroke="#8899aa" stroke-width="1" opacity="0.6"/>
</svg>