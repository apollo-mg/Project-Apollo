<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520">
  <rect width="600" height="520" fill="#eaf6ff"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="120" cy="80" rx="45" ry="18"/>
    <ellipse cx="155" cy="70" rx="35" ry="16"/>
    <ellipse cx="480" cy="50" rx="40" ry="15"/>
    <ellipse cx="510" cy="60" rx="30" ry="13"/>
  </g>

  <!-- ground -->
  <line x1="50" y1="460" x2="550" y2="460" stroke="#9aa78f" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== BICYCLE ===== -->
  <!-- wheels -->
  <g stroke="#2b2b2b" fill="none">
    <circle cx="180" cy="380" r="78" stroke-width="7"/>
    <circle cx="420" cy="380" r="78" stroke-width="7"/>
    <g stroke-width="2" opacity="0.6">
      <line x1="180" y1="302" x2="180" y2="458"/>
      <line x1="102" y1="380" x2="258" y2="380"/>
      <line x1="125" y1="325" x2="235" y2="435"/>
      <line x1="235" y1="325" x2="125" y2="435"/>
      <line x1="420" y1="302" x2="420" y2="458"/>
      <line x1="342" y1="380" x2="498" y2="380"/>
      <line x1="365" y1="325" x2="475" y2="435"/>
      <line x1="475" y1="325" x2="365" y2="435"/>
    </g>
    <circle cx="180" cy="380" r="8" fill="#2b2b2b" stroke="none"/>
    <circle cx="420" cy="380" r="8" fill="#2b2b2b" stroke="none"/>
  </g>

  <!-- frame -->
  <g stroke="#d63b2f" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="180" y1="380" x2="300" y2="380"/>
    <line x1="180" y1="380" x2="252" y2="262"/>
    <line x1="300" y1="380" x2="252" y2="262"/>
    <line x1="252" y1="262" x2="392" y2="272"/>
    <line x1="300" y1="380" x2="392" y2="272"/>
    <line x1="392" y1="272" x2="420" y2="380"/>
    <line x1="252" y1="262" x2="246" y2="240"/>
    <line x1="392" y1="272" x2="378" y2="232"/>
  </g>

  <!-- chainring -->
  <circle cx="300" cy="380" r="16" fill="none" stroke="#2b2b2b" stroke-width="4"/>
  <circle cx="300" cy="380" r="6" fill="#2b2b2b"/>

  <!-- pedals + cranks -->
  <g stroke="#2b2b2b" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="380" x2="322" y2="412"/>
    <line x1="300" y1="380" x2="278" y2="348"/>
  </g>
  <rect x="306" y="406" width="26" height="9" rx="3" fill="#2b2b2b"/>
  <rect x="266" y="342" width="26" height="9" rx="3" fill="#2b2b2b"/>

  <!-- seat -->
  <path d="M 226 242 Q 250 228 274 241 Q 262 253 236 250 Z" fill="#2b2b2b"/>

  <!-- handlebar -->
  <path d="M 378 232 Q 362 220 350 228 Q 344 232 346 240" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== PELICAN ===== -->
  <!-- tail -->
  <path d="M 232 192 L 188 182 L 204 204 L 186 222 L 230 214 Z" fill="#e8eff5" stroke="#c8d3dc" stroke-width="2"/>

  <!-- body -->
  <ellipse cx="285" cy="185" rx="68" ry="48" fill="#ffffff" stroke="#c8d3dc" stroke-width="3" transform="rotate(-12 285 185)"/>

  <!-- neck + head -->
  <path d="M 322 90
           Q 318 150 292 172
           L 335 190
           Q 358 150 378 108
           Q 386 68 350 58
           Q 322 60 322 90 Z"
        fill="#ffffff" stroke="#c8d3dc" stroke-width="3"/>

  <!-- pouch -->
  <path d="M 368 102 Q 420 100 470 104 L 490 96 Q 476 142 420 132 Q 384 122 368 102 Z" fill="#ffc93c" stroke="#e8871e" stroke-width="2"/>
  <!-- upper beak -->
  <path d="M 366 70 Q 430 74 490 96 L 468 106 Q 408 96 366 103 Z" fill="#e8871e"/>

  <!-- eye -->
  <circle cx="357" cy="78" r="4.5" fill="#2b2b2b"/>

  <!-- cheek -->
  <circle cx="360" cy="93" r="7" fill="#f3d9c6" opacity="0.8"/>

  <!-- wing -->
  <path d="M 240 163 Q 300 130 348 205 Q 322 222 264 206 Q 232 185 240 163 Z" fill="#dfe9f0" stroke="#b9c9d6" stroke-width="2.5"/>

  <!-- legs -->
  <g stroke="#f2a33c" stroke-width="9" stroke-linecap="round">
    <line x1="272" y1="215" x2="281" y2="348"/>
    <line x1="300" y1="218" x2="321" y2="410"/>
  </g>

  <!-- webbed feet on pedals -->
  <path d="M 264 342 L 296 342 L 303 351 L 261 351 Z" fill="#f2a33c"/>
  <path d="M 308 404 L 340 404 L 347 413 L 305 413 Z" fill="#f2a33c"/>
</svg>