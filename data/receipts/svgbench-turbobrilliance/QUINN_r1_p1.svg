<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <!-- Background sky -->
  <rect width="520" height="420" fill="#E8F4FD" rx="8"/>
  <!-- Ground -->
  <rect x="0" y="385" width="520" height="35" fill="#8BC34A" rx="0"/>
  <!-- Road -->
  <rect x="0" y="370" width="520" height="18" fill="#666" rx="0"/>
  <line x1="20" y1="379" x2="60" y2="379" stroke="#fff" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="100" y1="379" x2="140" y2="379" stroke="#fff" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="180" y1="379" x2="220" y2="379" stroke="#fff" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="260" y1="379" x2="300" y2="379" stroke="#fff" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="340" y1="379" x2="380" y2="379" stroke="#fff" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="420" y1="379" x2="460" y2="379" stroke="#fff" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="480" y1="379" x2="510" y2="379" stroke="#fff" stroke-width="2" stroke-dasharray="12,8"/>

  <!-- === BICYCLE === -->
  <!-- Back wheel -->
  <circle cx="130" cy="320" r="58" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="130" cy="320" r="52" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="130" cy="320" r="6" fill="#444"/>
  <!-- Spokes back -->
  <line x1="130" y1="320" x2="130" y2="264" stroke="#777" stroke-width="1"/>
  <line x1="130" y1="320" x2="186" y2="320" stroke="#777" stroke-width="1"/>
  <line x1="130" y1="320" x2="130" y2="376" stroke="#777" stroke-width="1"/>
  <line x1="130" y1="320" x2="74" y2="320" stroke="#777" stroke-width="1"/>
  <line x1="130" y1="320" x2="170" y2="280" stroke="#777" stroke-width="1"/>
  <line x1="130" y1="320" x2="90" y2="280" stroke="#777" stroke-width="1"/>
  <line x1="130" y1="320" x2="170" y2="360" stroke="#777" stroke-width="1"/>
  <line x1="130" y1="320" x2="90" y2="360" stroke="#777" stroke-width="1"/>

  <!-- Front wheel -->
  <circle cx="380" cy="320" r="58" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="380" cy="320" r="52" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="380" cy="320" r="6" fill="#444"/>
  <!-- Spokes front -->
  <line x1="380" y1="320" x2="380" y2="264" stroke="#777" stroke-width="1"/>
  <line x1="380" y1="320" x2="436" y2="320" stroke="#777" stroke-width="1"/>
  <line x1="380" y1="320" x2="380" y2="376" stroke="#777" stroke-width="1"/>
  <line x1="380" y1="320" x2="324" y2="320" stroke="#777" stroke-width="1"/>
  <line x1="380" y1="320" x2="420" y2="280" stroke="#777" stroke-width="1"/>
  <line x1="380" y1="320" x2="340" y2="280" stroke="#777" stroke-width="1"/>
  <line x1="380" y1="320" x2="420" y2="360" stroke="#777" stroke-width="1"/>
  <line x1="380" y1="320" x2="340" y2="360" stroke="#777" stroke-width="1"/>

  <!-- Frame: seat tube -->
  <line x1="200" y1="248" x2="248" y2="320" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
  <!-- Frame: top tube -->
  <line x1="200" y1="248" x2="365" y2="240" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
  <!-- Frame: down tube -->
  <line x1="365" y1="240" x2="248" y2="320" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
  <!-- Frame: chain stay -->
  <line x1="130" y1="320" x2="248" y2="320" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <!-- Frame: seat stay -->
  <line x1="130" y1="320" x2="200" y2="248" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <!-- Frame: fork -->
  <line x1="380" y1="320" x2="365" y2="240" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>

  <!-- Seat post -->
  <line x1="200" y1="248" x2="195" y2="228" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="193" cy="225" rx="22" ry="7" fill="#222"/>

  <!-- Handlebars -->
  <line x1="365" y1="240" x2="370" y2="218" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <path d="M 358 218 Q 370 208 382 218" fill="none" stroke="#444" stroke-width="4" stroke-linecap="round"/>

  <!-- Crank -->
  <circle cx="248" cy="320" r="10" fill="#555"/>
  <circle cx="248" cy="320" r="4" fill="#888"/>
  <!-- Chainring hint -->
  <circle cx="248" cy="320" r="18" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Chain -->
  <line x1="130" y1="316" x2="248" y2="316" stroke="#999" stroke-width="2"/>
  <line x1="130" y1="324" x2="248" y2="324" stroke="#999" stroke-width="2"/>

  <!-- Pedals -->
  <line x1="248" y1="320" x2="260" y2="345" stroke="#444" stroke-width="3" stroke-linecap="round"/>
  <rect x="252" y="342" width="18" height="5" rx="2" fill="#333"/>
  <line x1="248" y1="320" x2="236" y2="295" stroke="#444" stroke-width="3" stroke-linecap="round"/>
  <rect x="228" y="291" width="18" height="5" rx="2" fill="#333"/>

  <!-- === PELICAN === -->
  <!-- Tail feathers -->
  <path d="M 148 195 Q 120 180 105 165 Q 115 185 108 195 Q 118 190 125 198 Q 135 192 148 195" fill="#DDD" stroke="#BBB" stroke-width="1"/>

  <!-- Body -->
  <ellipse cx="205" cy="195" rx="58" ry="42" fill="#F5F5F5" stroke="#CCC" stroke-width="1.5"/>

  <!-- Wing -->
  <path d="M 185 185 Q 170 175 160 190 Q 155 205 168 210 Q 180 212 190 205 Q 188 192 185 185Z" fill="#E0E0E0" stroke="#BBB" stroke-width="1"/>
  <path d="M 168 195 Q 175 198 185 197" fill="none" stroke="#CCC" stroke-width="1"/>
  <path d="M 165 202 Q 173 205 183 203" fill="none" stroke="#CCC" stroke-width="1"/>

  <!-- Leg 1 (on pedal) -->
  <line x1="215" y1="228" x2="260" y2="343" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>
  <!-- Foot 1 -->
  <path d="M 255 343 L 270 345 L 258 340Z" fill="#E8943E"/>

  <!-- Leg 2 (other pedal) -->
  <line x1="220" y1="225" x2="236" y2="293" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>
  <!-- Foot 2 -->
  <path d="M 232 293 L 248 295 L 236 288Z" fill="#E8943E"/>

  <!-- Neck -->
  <path d="M 240 175 Q 248 155 252 140 Q 254 130 255 125" fill="none" stroke="#F5F5F5" stroke-width="22" stroke-linecap="round"/>
  <path d="M 240 175 Q 248 155 252 140 Q 254 130 255 125" fill="none" stroke="#E8E8E8" stroke-width="18" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="258" cy="118" r="28" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="268" cy="108" r="7" fill="#FFF"/>
  <circle cx="270" cy="107" r="4" fill="#222"/>
  <circle cx="271.5" cy="105.5" r="1.5" fill="#FFF"/>

  <!-- THE BEAK / POUCH -->
  <!-- Upper beak -->
  <path d="M 275 112 Q 310 108 330 115 Q 335 118 330 122 Q 310 120 275 118Z" fill="#F5A623" stroke="#D4881E" stroke-width="1"/>
  <!-- Lower beak / POUCH -->
  <path d="M 275 120 Q 290 122 320 125 Q 345 130 340 150 Q 335 170 310 172 Q 285 170 275 155 Q 270 140 275 120Z" fill="#F7B733" stroke="#D4881E" stroke-width="1.5"/>
  <!-- Pouch crease -->
  <path d="M 280 130 Q 305 135 325 145" fill="none" stroke="#E09A20" stroke-width="1" opacity="0.6"/>
  <path d="M 278 142 Q 300 148 318 158" fill="none" stroke="#E09A20" stroke-width="1" opacity="0.5"/>

  <!-- Fish in the pouch! -->
  <ellipse cx="305" cy="148" rx="14" ry="7" fill="#7EC8E3" stroke="#5BA8C8" stroke-width="1"/>
  <path d="M 319 148 L 326 143 L 326 153Z" fill="#5BA8C8"/>
  <circle cx="296" cy="146" r="1.5" fill="#333"/>

  <!-- Head crest (little tuft) -->
  <path d="M 250 93 Q 245 82 252 78 Q 258 82 256 90" fill="#F5A623" stroke="#D4881E" stroke-width="0.8"/>

  <!-- Motion lines behind -->
  <line x1="80" y1="180" x2="50" y2="178" stroke="#AAA" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="75" y1="195" x2="42" y2="195" stroke="#AAA" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="78" y1="210" x2="50" y2="213" stroke="#AAA" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Little "speed" lines near back wheel -->
  <line x1="60" y1="310" x2="35" y2="308" stroke="#999" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="62" y1="325" x2="30" y2="325" stroke="#999" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>