<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <!-- Background -->
  <rect width="520" height="420" fill="#E8F4FD" rx="8"/>

  <!-- ===== BICYCLE ===== -->
  <!-- Rear wheel -->
  <circle cx="140" cy="320" r="58" fill="none" stroke="#2C2C2C" stroke-width="4"/>
  <circle cx="140" cy="320" r="54" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="140" cy="320" r="6" fill="#444"/>
  <!-- Rear spokes -->
  <line x1="140" y1="320" x2="140" y2="266" stroke="#888" stroke-width="1.2"/>
  <line x1="140" y1="320" x2="140" y2="374" stroke="#888" stroke-width="1.2"/>
  <line x1="140" y1="320" x2="86" y2="320" stroke="#888" stroke-width="1.2"/>
  <line x1="140" y1="320" x2="194" y2="320" stroke="#888" stroke-width="1.2"/>
  <line x1="140" y1="320" x2="102" y2="282" stroke="#888" stroke-width="1.2"/>
  <line x1="140" y1="320" x2="178" y2="282" stroke="#888" stroke-width="1.2"/>
  <line x1="140" y1="320" x2="102" y2="358" stroke="#888" stroke-width="1.2"/>
  <line x1="140" y1="320" x2="178" y2="358" stroke="#888" stroke-width="1.2"/>

  <!-- Front wheel -->
  <circle cx="380" cy="320" r="58" fill="none" stroke="#2C2C2C" stroke-width="4"/>
  <circle cx="380" cy="320" r="54" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="380" cy="320" r="6" fill="#444"/>
  <!-- Front spokes -->
  <line x1="380" y1="320" x2="380" y2="266" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="320" x2="380" y2="374" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="320" x2="326" y2="320" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="320" x2="434" y2="320" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="320" x2="342" y2="282" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="320" x2="418" y2="282" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="320" x2="342" y2="358" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="320" x2="418" y2="358" stroke="#888" stroke-width="1.2"/>

  <!-- Frame -->
  <g stroke="#C0392B" stroke-width="5" stroke-linecap="round" fill="none">
    <!-- Seat tube -->
    <line x1="220" y1="205" x2="258" y2="320"/>
    <!-- Top tube -->
    <line x1="220" y1="210" x2="365" y2="215"/>
    <!-- Down tube -->
    <line x1="365" y1="215" x2="258" y2="320"/>
    <!-- Seat stay -->
    <line x1="140" y1="320" x2="220" y2="210"/>
    <!-- Chain stay -->
    <line x1="140" y1="320" x2="258" y2="320"/>
    <!-- Fork -->
    <line x1="380" y1="320" x2="367" y2="225"/>
    <!-- Head tube -->
    <line x1="365" y1="215" x2="367" y2="200"/>
  </g>

  <!-- Seat post -->
  <line x1="220" y1="205" x2="218" y2="182" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <!-- Saddle -->
  <ellipse cx="218" cy="178" rx="18" ry="6" fill="#2C2C2C"/>

  <!-- Handlebar stem -->
  <line x1="366" y1="200" x2="366" y2="182" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <!-- Handlebars (curved) -->
  <path d="M 350 182 Q 366 172 382 182" fill="none" stroke="#444" stroke-width="4" stroke-linecap="round"/>

  <!-- Crank / chainring -->
  <circle cx="258" cy="320" r="14" fill="none" stroke="#555" stroke-width="2.5"/>
  <circle cx="258" cy="320" r="4" fill="#555"/>

  <!-- Crank arms and pedals -->
  <line x1="258" y1="320" x2="242" y2="342" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="258" y1="320" x2="274" y2="298" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <rect x="234" y="340" width="16" height="5" rx="2" fill="#333"/>
  <rect x="268" y="294" width="16" height="5" rx="2" fill="#333"/>

  <!-- Chain (simplified) -->
  <path d="M 140 320 L 258 320" stroke="#666" stroke-width="2" stroke-dasharray="3,2"/>
  <path d="M 140 320 L 244 342" stroke="#666" stroke-width="2" stroke-dasharray="3,2"/>
  <path d="M 258 320 L 274 298" stroke="#666" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- ===== PELICAN ===== -->
  <!-- Tail feathers (behind body) -->
  <path d="M 168 138 L 140 118 L 148 140 L 135 128 L 148 148 L 155 140 Z" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="1"/>

  <!-- Body (large oval) -->
  <ellipse cx="245" cy="140" rx="72" ry="46" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="2"/>

  <!-- Wing (folded on body) -->
  <path d="M 200 128 Q 240 118 285 135 Q 270 155 240 158 Q 210 155 200 140 Z" fill="#E8E8E8" stroke="#B0B0B0" stroke-width="1.5"/>
  <!-- Wing feather details -->
  <path d="M 215 132 Q 235 126 265 134" fill="none" stroke="#C8C8C8" stroke-width="1"/>
  <path d="M 218 140 Q 240 134 270 140" fill="none" stroke="#C8C8C8" stroke-width="1"/>

  <!-- Legs (pelican standing on pedals) -->
  <!-- Left leg (far pedal - lower) -->
  <path d="M 225 175 L 238 260 L 242 340" fill="none" stroke="#E8A317" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left foot -->
  <path d="M 234 340 L 252 340 L 248 344 L 234 344 Z" fill="#E8A317" stroke="#C48A12" stroke-width="1"/>

  <!-- Right leg (near pedal - higher) -->
  <path d="M 245 172 L 258 255 L 274 296" fill="none" stroke="#E8A317" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right foot -->
  <path d="M 266 294 L 284 294 L 280 298 L 266 298 Z" fill="#E8A317" stroke="#C48A12" stroke-width="1"/>

  <!-- Neck (S-curve from body to head) -->
  <path d="M 295 118 Q 310 100 308 82" fill="none" stroke="#B0B0B0" stroke-width="2"/>
  <path d="M 290 120 Q 305 102 303 82" fill="#FFFFFF" stroke="none"/>
  <ellipse cx="302" cy="95" rx="10" ry="20" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1.5" transform="rotate(-8 302 95)"/>

  <!-- Head -->
  <circle cx="310" cy="82" r="22" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="318" cy="76" r="4" fill="#2C2C2C"/>
  <circle cx="319" cy="75" r="1.5" fill="#FFF"/>

  <!-- Beak - upper mandible (long, straight, slightly angled down) -->
  <path d="M 325 80 L 408 92 L 406 96 L 325 88 Z" fill="#F5A623" stroke="#C48A12" stroke-width="1"/>

  <!-- Beak - lower pouch (the distinctive expandable throat pouch) -->
  <path d="M 325 88 Q 340 100 360 104 Q 380 106 400 96 L 406 96 Q 404 104 388 110 Q 360 116 335 104 Q 327 98 325 92 Z" fill="#F07B5A" stroke="#D4604A" stroke-width="1"/>

  <!-- Beak ridge line -->
  <path d="M 330 84 L 404 93" fill="none" stroke="#D4880F" stroke-width="0.8" opacity="0.5"/>

  <!-- Nostril hint -->
  <circle cx="340" cy="83" r="1" fill="#C48A12" opacity="0.6"/>

  <!-- Small motion lines behind rear wheel -->
  <line x1="70" y1="305" x2="55" y2="305" stroke="#B0C4DE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="68" y1="315" x2="48" y2="315" stroke="#B0C4DE" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="72" y1="325" x2="58" y2="325" stroke="#B0C4DE" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Ground shadow -->
  <ellipse cx="260" cy="382" rx="180" ry="8" fill="#00000010"/>
</svg>