<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Sky background -->
  <rect width="600" height="400" fill="#B3E0F2"/>
  
  <!-- Ground -->
  <rect y="350" width="600" height="50" fill="#5CB85C"/>
  <rect y="350" width="600" height="5" fill="#4CAF50"/>
  
  <!-- Bicycle: Back wheel -->
  <circle cx="140" cy="290" r="70" fill="none" stroke="#2C3E50" stroke-width="6"/>
  <circle cx="140" cy="290" r="8" fill="#2C3E50"/>
  <line x1="140" y1="225" x2="140" y2="355" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="80" y1="255" x2="200" y2="325" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="80" y1="325" x2="200" y2="255" stroke="#7F8C8D" stroke-width="2"/>
  
  <!-- Bicycle: Front wheel -->
  <circle cx="420" cy="290" r="70" fill="none" stroke="#2C3E50" stroke-width="6"/>
  <circle cx="420" cy="290" r="8" fill="#2C3E50"/>
  <line x1="420" y1="225" x2="420" y2="355" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="360" y1="255" x2="480" y2="325" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="360" y1="325" x2="480" y2="255" stroke="#7F8C8D" stroke-width="2"/>
  
  <!-- Bicycle: Frame -->
  <path d="M 140 290 L 180 190 L 270 290 Z" fill="none" stroke="#E74C3C" stroke-width="6" stroke-linejoin="round"/>
  <line x1="180" y1="190" x2="400" y2="170" stroke="#E74C3C" stroke-width="6"/>
  <line x1="400" y1="170" x2="420" y2="290" stroke="#E74C3C" stroke-width="6"/>
  <line x1="270" y1="290" x2="400" y2="170" stroke="#E74C3C" stroke-width="6"/>
  
  <!-- Handlebar post -->
  <line x1="400" y1="170" x2="405" y2="135" stroke="#2C3E50" stroke-width="5"/>
  <!-- Handlebars -->
  <path d="M 385 135 Q 405 125 425 135" fill="none" stroke="#2C3E50" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Seat post and seat -->
  <line x1="175" y1="195" x2="172" y2="175" stroke="#2C3E50" stroke-width="5"/>
  <ellipse cx="172" cy="170" rx="22" ry="8" fill="#2C3E50"/>
  
  <!-- Crank and pedals -->
  <circle cx="270" cy="290" r="10" fill="#2C3E50"/>
  <line x1="270" y1="290" x2="290" y2="315" stroke="#2C3E50" stroke-width="4"/>
  <rect x="280" y="312" width="22" height="7" rx="3" fill="#555"/>
  
  <!-- Pelican: Body -->
  <ellipse cx="215" cy="155" rx="58" ry="48" fill="#FDF6E3"/>
  
  <!-- Pelican: Tail feathers -->
  <path d="M 160 175 Q 135 185 125 200 Q 140 195 150 190 Q 140 200 135 210 Q 155 200 165 192" fill="#E8DFCC"/>
  
  <!-- Pelican: Wing -->
  <ellipse cx="225" cy="160" rx="40" ry="28" fill="#EDE4D0" transform="rotate(-5, 225, 160)"/>
  
  <!-- Pelican: Neck -->
  <path d="M 260 125 Q 280 100 290 80 Q 295 68 298 75" fill="none" stroke="#FDF6E3" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Pelican: Head -->
  <circle cx="298" cy="72" r="24" fill="#FDF6E3"/>
  
  <!-- Pelican: Eye -->
  <circle cx="305" cy="65" r="5" fill="#2C3E50"/>
  <circle cx="306.5" cy="63.5" r="1.8" fill="#FFFFFF"/>
  
  <!-- Pelican: Upper beak -->
  <path d="M 315 68 Q 355 63 398 80 Q 405 83 400 88 L 315 80 Z" fill="#F0A050"/>
  
  <!-- Pelican: Lower beak with pouch -->
  <path d="M 315 80 Q 355 82 395 88 Q 402 98 390 105 Q 365 102 335 95 Q 320 90 315 83 Z" fill="#ED9140"/>
  
  <!-- Pelican: Wing reaching to handlebars -->
  <path d="M 250 130 Q 310 115 385 130 Q 390 136 385 140 Q 310 125 250 138 Z" fill="#EDE4D0"/>
  <path d="M 380 132 Q 390 130 395 135 Q 390 140 382 138 Z" fill="#E0D5C0"/>
  
  <!-- Pelican: Leg to pedal -->
  <path d="M 215 192 Q 218 235 235 265 Q 255 295 280 313" fill="none" stroke="#F0A050" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Pelican: Foot on pedal -->
  <path d="M 278 310 Q 285 308 292 312 Q 296 318 288 320 Q 280 320 276 315 Z" fill="#F0A050"/>
</svg>