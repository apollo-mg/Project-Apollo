<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#B0E0E6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  
  <!-- Road -->
  <rect y="510" width="800" height="90" fill="#555"/>
  <rect y="505" width="800" height="8" fill="#666"/>
  <line x1="0" y1="550" x2="800" y2="550" stroke="#fff" stroke-width="3" stroke-dasharray="40,20" opacity="0.7"/>
  
  <!-- Clouds -->
  <g fill="white" opacity="0.9">
    <ellipse cx="120" cy="80" rx="60" ry="30"/>
    <ellipse cx="170" cy="75" rx="55" ry="28"/>
    <ellipse cx="220" cy="85" rx="50" ry="25"/>
    
    <ellipse cx="650" cy="60" rx="70" ry="32"/>
    <ellipse cx="700" cy="55" rx="55" ry="26"/>
    <ellipse cx="600" cy="65" rx="45" ry="22"/>
  </g>
  
  <!-- Bicycle -->
  <g stroke="#2c2c2c" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Rear wheel -->
    <circle cx="190" cy="460" r="70"/>
    <circle cx="190" cy="460" r="8" fill="#444"/>
    <!-- Rear spokes -->
    <g stroke-width="2" stroke="#666">
      <line x1="190" y1="460" x2="190" y2="392"/>
      <line x1="190" y1="460" x2="238" y2="412"/>
      <line x1="190" y1="460" x2="258" y2="460"/>
      <line x1="190" y1="460" x2="238" y2="508"/>
      <line x1="190" y1="460" x2="190" y2="528"/>
      <line x1="190" y1="460" x2="142" y2="508"/>
      <line x1="190" y1="460" x2="122" y2="460"/>
      <line x1="190" y1="460" x2="142" y2="412"/>
      <line x1="190" y1="460" x2="220" y2="400"/>
      <line x1="190" y1="460" x2="220" y2="520"/>
      <line x1="190" y1="460" x2="160" y2="520"/>
      <line x1="190" y1="460" x2="160" y2="400"/>
    </g>
    
    <!-- Front wheel -->
    <circle cx="580" cy="460" r="70"/>
    <circle cx="580" cy="460" r="8" fill="#444"/>
    <!-- Front spokes -->
    <g stroke-width="2" stroke="#666">
      <line x1="580" y1="460" x2="580" y2="392"/>
      <line x1="580" y1="460" x2="628" y2="412"/>
      <line x1="580" y1="460" x2="648" y2="460"/>
      <line x1="580" y1="460" x2="628" y2="508"/>
      <line x1="580" y1="460" x2="580" y2="528"/>
      <line x1="580" y1="460" x2="532" y2="508"/>
      <line x1="580" y1="460" x2="512" y2="460"/>
      <line x1="580" y1="460" x2="532" y2="412"/>
      <line x1="580" y1="460" x2="610" y2="400"/>
      <line x1="580" y1="460" x2="610" y2="520"/>
      <line x1="580" y1="460" x2="550" y2="520"/>
      <line x1="580" y1="460" x2="550" y2="400"/>
    </g>
    
    <!-- Frame -->
    <!-- Chain stays: rear axle to BB -->
    <line x1="190" y1="460" x2="390" y2="450"/>
    <!-- Seat stays: rear axle to seat -->
    <line x1="190" y1="460" x2="290" y2="300"/>
    <!-- Seat tube: BB to seat -->
    <line x1="390" y1="450" x2="295" y2="280"/>
    <!-- Top tube: seat to head tube -->
    <line x1="290" y1="300" x2="510" y2="280"/>
    <!-- Down tube: head tube to BB -->
    <line x1="510" y1="280" x2="390" y2="450"/>
    <!-- Head tube -->
    <line x1="510" y1="270" x2="520" y2="310"/>
    <line x1="525" y1="275" x2="535" y2="315"/>
    <!-- Fork -->
    <line x1="520" y1="310" x2="580" y2="460"/>
    <line x1="535" y1="315" x2="590" y2="455"/>
    <!-- Stem -->
    <line x1="515" y1="270" x2="510" y2="250"/>
  </g>
  
  <!-- Handlebars -->
  <g stroke="#2c2c2c" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 510,250 Q 495,235 500,220"/>
    <path d="M 510,250 Q 525,235 520,220"/>
  </g>
  
  <!-- Seat post -->
  <line x1="295" y1="280" x2="290" y2="260" stroke="#2c2c2c" stroke-width="5"/>
  
  <!-- Saddle -->
  <ellipse cx="290" cy="255" rx="30" ry="12" fill="#222" transform="rotate(-5, 290, 255)"/>
  
  <!-- BB and Crank -->
  <circle cx="390" cy="450" r="10" fill="#333"/>
  <!-- Crank arms -->
  <line x1="390" y1="450" x2="360" y2="420" stroke="#333" stroke-width="5"/>
  <line x1="390" y1="450" x2="420" y2="480" stroke="#333" stroke-width="5"/>
  <!-- Pedals -->
  <rect x="345" y="412" width="35" height="10" fill="#222" rx="2" transform="rotate(-20, 362, 417)"/>
  <rect x="410" y="477" width="35" height="10" fill="#222" rx="2" transform="rotate(-20, 427, 482)"/>
  
  <!-- Pelican -->
  <g>
    <!-- Legs (behind body) -->
    <g stroke="#FF6600" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M 300,280 Q 330,350 350,430"/>
      <path d="M 310,270 Q 380,360 410,480"/>
    </g>
    <!-- Feet -->
    <g fill="#FF6600">
      <ellipse cx="355" cy="435" rx="18" ry="8" transform="rotate(-20, 355, 435)"/>
      <ellipse cx="415" cy="485" rx="18" ry="8" transform="rotate(-20, 415, 485)"/>
    </g>
    
    <!-- Body -->
    <path d="M 230,250 Q 220,200 260,180 Q 320,160 360,190 Q 380,210 370,250 Q 360,280 320,290 Q 270,295 230,250 Z" 
          fill="#FEFEFE" stroke="#ddd" stroke-width="2"/>
    
    <!-- Wing -->
    <path d="M 240,230 Q 230,200 260,195 Q 300,190 330,210 Q 340,230 310,250 Q 270,260 240,230 Z" 
          fill="#eee" stroke="#ccc" stroke-width="1"/>
    <path d="M 260,220 Q 290,210 320,220" stroke="#ddd" stroke-width="1.5" fill="none"/>
    
    <!-- Tail feathers -->
    <path d="M 230,250 L 200,230 L 220,245 L 195,225 L 225,248 L 215,260 Z" fill="#eee"/>
    
    <!-- Neck -->
    <path d="M 350,190 Q 380,150 400,120 Q 410,100 405,90" 
          stroke="#FEFEFE" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M 350,190 Q 380,150 400,120 Q 410,100 405,90" 
          stroke="#fff" stroke-width="22" fill="none" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="408" cy="85" r="26" fill="#FEFEFE" stroke="#ddd" stroke-width="1"/>
    
    <!-- Eye -->
    <circle cx="420" cy="78" r="6" fill="#222"/>
    <circle cx="422" cy="76" r="2" fill="#fff"/>
    <circle cx="420" cy="80" r="1" fill="#fff"/>
    
    <!-- Beak (upper) -->
    <path d="M 430,80 L 480,98 L 478,106 L 428,90 Z" fill="#FF8C00"/>
    <!-- Beak (lower) -->
    <path d="M 428,90 L 477,100 L 474,110 L 425,94 Z" fill="#FF7500"/>
    
    <!-- Throat pouch -->
    <path d="M 425,92 Q 445,130 475,104" fill="#FFA040" opacity="0.9"/>
    
    <!-- Smile -->
    <path d="M 425,85 Q 432,95 440,92" stroke="#888" stroke-width="1.5" fill="none"/>
    
    <!-- Crest feathers -->
    <path d="M 400,65 Q 405,55 410,58 Q 415,48 420,52" stroke="#eee" stroke-width="2.5" fill="none"/>
  </g>
  
  <!-- Motion lines -->
  <g stroke="#aaa" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 100,300 Q 80,320 100,340"/>
    <path d="M 80,350 Q 60,370 80,390"/>
    <path d="M 120,400 Q 100,420 120,440"/>
  </g>
</svg>