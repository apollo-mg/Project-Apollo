<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420">
  <defs>
    <style>
      .frame { stroke: #c0392b; stroke-width: 5; stroke-linecap: round; }
      .tire { fill: none; stroke: #2c3e50; stroke-width: 5; }
      .spoke { stroke: #7f8c8d; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Rear Wheel -->
  <circle cx="130" cy="330" r="52" class="tire"/>
  <circle cx="130" cy="330" r="4" fill="#555"/>
  <line x1="130" y1="278" x2="130" y2="382" class="spoke"/>
  <line x1="78" y1="330" x2="182" y2="330" class="spoke"/>
  <line x1="93" y1="293" x2="167" y2="367" class="spoke"/>
  <line x1="167" y1="293" x2="93" y2="367" class="spoke"/>
  <line x1="93" y1="367" x2="167" y2="293" class="spoke"/>
  <line x1="167" y1="367" x2="93" y2="293" class="spoke"/>

  <!-- Front Wheel -->
  <circle cx="380" cy="330" r="52" class="tire"/>
  <circle cx="380" cy="330" r="4" fill="#555"/>
  <line x1="380" y1="278" x2="380" y2="382" class="spoke"/>
  <line x1="328" y1="330" x2="432" y2="330" class="spoke"/>
  <line x1="343" y1="293" x2="417" y2="367" class="spoke"/>
  <line x1="417" y1="293" x2="343" y2="367" class="spoke"/>
  <line x1="343" y1="367" x2="417" y2="293" class="spoke"/>
  <line x1="417" y1="367" x2="343" y2="293" class="spoke"/>

  <!-- Bicycle Frame -->
  <!-- Chain stay -->
  <line x1="130" y1="330" x2="250" y2="330" class="frame"/>
  <!-- Seat stay -->
  <line x1="130" y1="330" x2="195" y2="225" class="frame"/>
  <!-- Seat tube -->
  <line x1="195" y1="225" x2="250" y2="330" class="frame"/>
  <!-- Top tube -->
  <line x1="195" y1="225" x2="348" y2="218" class="frame"/>
  <!-- Down tube -->
  <line x1="250" y1="330" x2="348" y2="218" class="frame"/>
  <!-- Fork -->
  <line x1="380" y1="330" x2="348" y2="218" class="frame"/>

  <!-- Seat -->
  <path d="M183,222 Q195,214 210,222" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="348" y1="218" x2="355" y2="200" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
  <path d="M355,200 Q365,192 375,198" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>

  <!-- Crank set -->
  <circle cx="250" cy="330" r="7" fill="none" stroke="#555" stroke-width="3"/>
  <!-- Pedal arms -->
  <line x1="250" y1="330" x2="268" y2="352" stroke="#444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="250" y1="330" x2="232" y2="308" stroke="#444" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pedals -->
  <rect x="262" y="349" width="16" height="6" rx="2" fill="#444"/>
  <rect x="225" y="304" width="16" height="6" rx="2" fill="#444"/>

  <!-- ============ PELICAN ============ -->

  <!-- Back leg (to far pedal) -->
  <path d="M225,200 Q230,260 235,305" fill="none" stroke="#d4a054" stroke-width="5" stroke-linecap="round"/>
  <!-- Foot on back pedal -->
  <path d="M225,304 L242,306" stroke="#d4a054" stroke-width="5" stroke-linecap="round"/>

  <!-- Front leg (to near pedal) -->
  <path d="M230,205 Q250,270 265,348" fill="none" stroke="#e0b060" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Foot on front pedal -->
  <path d="M262,349 L280,351" stroke="#e0b060" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Tail feathers -->
  <path d="M182,190 L152,205 L162,192 Z" fill="#c8c0b0" stroke="#aaa" stroke-width="1"/>
  <path d="M184,195 L155,215 L168,200 Z" fill="#b8b0a0" stroke="#aaa" stroke-width="1"/>

  <!-- Body -->
  <ellipse cx="218" cy="185" rx="42" ry="28" fill="#f7f3e8" stroke="#ccc5b5" stroke-width="1.5" transform="rotate(-8,218,185)"/>

  <!-- Wing -->
  <path d="M195,172 Q225,162 248,178 Q240,198 205,196 Z" fill="#e8e2d5" stroke="#ccc5b5" stroke-width="1.2"/>
  <!-- Wing detail lines -->
  <path d="M205,178 Q225,172 240,180" fill="none" stroke="#bbb5a5" stroke-width="1"/>
  <path d="M200,185 Q220,178 238,185" fill="none" stroke="#bbb5a5" stroke-width="1"/>

  <!-- Neck -->
  <path d="M245,172 Q268,148 285,115" fill="none" stroke="#f7f3e8" stroke-width="20" stroke-linecap="round"/>
  <!-- Neck outline -->
  <path d="M245,162 Q270,138 288,105" fill="none" stroke="#ccc5b5" stroke-width="1"/>
  <path d="M250,180 Q272,158 286,120" fill="none" stroke="#ccc5b5" stroke-width="1"/>

  <!-- Head -->
  <circle cx="292" cy="105" r="15" fill="#f7f3e8" stroke="#ccc5b5" stroke-width="1.2"/>

  <!-- Small crest/feather on head -->
  <path d="M285,92 Q280,82 285,78" fill="none" stroke="#ccc5b5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Upper beak -->
  <path d="M304,102 L362,108 L304,112 Z" fill="#f0a030" stroke="#c87820" stroke-width="1"/>
  <!-- Nostril -->
  <circle cx="320" cy="107" r="1.2" fill="#c87820"/>

  <!-- Pouch (lower beak) -->
  <path d="M304,112 L360,108 Q350,138 308,125 Z" fill="#f5b850" stroke="#c87820" stroke-width="1"/>
  <!-- Pouch detail -->
  <path d="M310,118 Q335,128 352,112" fill="none" stroke="#d4902a" stroke-width="0.8"/>

  <!-- Eye -->
  <circle cx="296" cy="101" r="3.5" fill="#2c2c2c"/>
  <circle cx="297.5" cy="100" r="1.2" fill="white"/>

  <!-- Ground line -->
  <line x1="40" y1="384" x2="480" y2="384" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.5"/>
</svg>