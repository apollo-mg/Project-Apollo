<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Sky -->
  <rect width="800" height="600" fill="#bfe8ff"/>

  <!-- Sun -->
  <circle cx="90" cy="80" r="45" fill="#ffd93b"/>

  <!-- Ground -->
  <rect y="520" width="800" height="80" fill="#7ec850"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#5a9c3a" stroke-width="4"/>

  <!-- ================= BICYCLE ================= -->
  <!-- Rear wheel -->
  <g stroke="#333" stroke-width="5" fill="none">
    <circle cx="250" cy="450" r="70"/>
    <circle cx="550" cy="450" r="70"/>
    <!-- spokes -->
    <g stroke-width="2">
      <line x1="250" y1="380" x2="250" y2="520"/>
      <line x1="180" y1="450" x2="320" y2="450"/>
      <line x1="200" y1="400" x2="300" y2="500"/>
      <line x1="300" y1="400" x2="200" y2="500"/>
      <line x1="550" y1="380" x2="550" y2="520"/>
      <line x1="480" y1="450" x2="620" y2="450"/>
      <line x1="500" y1="400" x2="600" y2="500"/>
      <line x1="600" y1="400" x2="500" y2="500"/>
    </g>
  </g>
  <circle cx="250" cy="450" r="7" fill="#333"/>
  <circle cx="550" cy="450" r="7" fill="#333"/>

  <!-- Frame -->
  <g stroke="#e03131" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="410" y1="440" x2="370" y2="265"/>  <!-- seat tube -->
    <line x1="370" y1="265" x2="525" y2="262"/>  <!-- top tube -->
    <line x1="520" y1="275" x2="410" y2="440"/>  <!-- down tube -->
    <line x1="410" y1="440" x2="250" y2="450"/>  <!-- chainstay -->
    <line x1="250" y1="450" x2="370" y2="265"/>  <!-- seatstay -->
    <line x1="550" y1="450" x2="528" y2="262"/>  <!-- fork -->
  </g>

  <!-- Seat -->
  <path d="M 340 258 q 30 -12 60 0 q -8 12 -30 12 q -22 0 -30 -12" fill="#333"/>
  <rect x="368" y="262" width="8" height="12" fill="#333"/>

  <!-- Handlebars -->
  <g stroke="#333" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="528" y1="262" x2="505" y2="238"/>
    <path d="M 505 238 q -25 -8 -32 12"/>
  </g>

  <!-- Crank and pedals -->
  <circle cx="410" cy="440" r="8" fill="#555"/>
  <line x1="410" y1="440" x2="448" y2="464" stroke="#555" stroke-width="5"/>
  <line x1="410" y1="440" x2="372" y2="416" stroke="#555" stroke-width="5"/>
  <rect x="436" y="460" width="26" height="8" rx="2" fill="#333"/>
  <rect x="358" y="410" width="26" height="8" rx="2" fill="#333"/>

  <!-- ================= PELICAN ================= -->
  <!-- Far leg (behind body, to far pedal) -->
  <line x1="340" y1="240" x2="372" y2="414" stroke="#d98e04" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="371" cy="414" rx="16" ry="7" fill="#d98e04"/>

  <!-- Tail feathers -->
  <path d="M 255 190 l -45 -25 M 255 205 l -50 -10 M 255 218 l -45 8"
        stroke="#999" stroke-width="7" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="330" cy="205" rx="82" ry="58" fill="#fff" stroke="#999" stroke-width="3"/>

  <!-- Wing -->
  <path d="M 285 195 q 60 45 115 8 q -10 40 -60 38 q -40 -2 -55 -46"
        fill="#e8b04b" stroke="#c98d1e" stroke-width="3"/>

  <!-- Neck -->
  <path d="M 372 168 q 45 -55 88 -58" fill="none"
        stroke="#fff" stroke-width="34" stroke-linecap="round"/>
  <path d="M 372 168 q 45 -55 88 -58" fill="none"
        stroke="#999" stroke-width="3" stroke-dasharray="0"/>
  <path d="M 372 168 q 45 -55 88 -58" fill="none"
        stroke="#999" stroke-width="28" stroke-linecap="round" opacity="0" />

  <!-- Head -->
  <circle cx="462" cy="106" r="24" fill="#fff" stroke="#999" stroke-width="3"/>

  <!-- Beak (upper) -->
  <path d="M 474 96 L 584 116 Q 592 121 584 126 L 476 120 Z"
        fill="#f0930f" stroke="#c96f00" stroke-width="2"/>

  <!-- Beak pouch -->
  <path d="M 476 120 Q 530 192 586 125 Q 530 158 476 120 Z"
        fill="#f7a940" stroke="#c96f00" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="466" cy="98" r="4.5" fill="#222"/>
  <circle cx="468" cy="96" r="1.5" fill="#fff"/>

  <!-- Near leg (to near pedal) -->
  <line x1="360" y1="245" x2="446" y2="462" stroke="#f0930f" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="449" cy="464" rx="17" ry="7" fill="#f0930f"/>
</svg>