<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" fill="#87CEEB"/>
  <rect y="350" width="600" height="100" fill="#4CAF50"/>
  <!-- Road -->
  <rect y="330" width="600" height="30" fill="#666"/>
  <line x1="0" y1="345" x2="600" y2="345" stroke="#FFD700" stroke-width="2" stroke-dasharray="20,15"/>

  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="150" cy="300" r="55" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="150" cy="300" r="5" fill="#333"/>
  <!-- Spokes rear -->
  <line x1="150" y1="300" x2="150" y2="245" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="150" y2="355" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="95" y2="300" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="205" y2="300" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="111" y2="261" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="189" y2="339" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="111" y2="339" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="189" y2="261" stroke="#999" stroke-width="1.5"/>

  <!-- Front wheel -->
  <circle cx="430" cy="300" r="55" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="430" cy="300" r="5" fill="#333"/>
  <!-- Spokes front -->
  <line x1="430" y1="300" x2="430" y2="245" stroke="#999" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="430" y2="355" stroke="#999" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="375" y2="300" stroke="#999" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="485" y2="300" stroke="#999" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="391" y2="261" stroke="#999" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="469" y2="339" stroke="#999" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="391" y2="339" stroke="#999" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="469" y2="261" stroke="#999" stroke-width="1.5"/>

  <!-- Frame -->
  <line x1="150" y1="300" x2="250" y2="300" stroke="#E53935" stroke-width="5"/>
  <line x1="250" y1="300" x2="180" y2="200" stroke="#E53935" stroke-width="5"/>
  <line x1="180" y1="200" x2="150" y2="300" stroke="#E53935" stroke-width="5"/>
  <line x1="250" y1="300" x2="400" y2="200" stroke="#E53935" stroke-width="5"/>
  <line x1="400" y1="200" x2="430" y2="300" stroke="#E53935" stroke-width="5"/>

  <!-- Seat post and seat -->
  <line x1="180" y1="200" x2="175" y2="170" stroke="#333" stroke-width="4"/>
  <ellipse cx="175" cy="165" rx="20" ry="8" fill="#333"/>

  <!-- Handlebar post and handlebar -->
  <line x1="400" y1="200" x2="410" y2="160" stroke="#333" stroke-width="4"/>
  <path d="M 395 160 Q 410 145 425 160" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <circle cx="395" cy="160" r="4" fill="#333"/>
  <circle cx="425" cy="160" r="4" fill="#333"/>

  <!-- Chain and pedal crank -->
  <circle cx="250" cy="300" r="15" fill="none" stroke="#555" stroke-width="3"/>
  <line x1="250" y1="300" x2="250" y2="325" stroke="#333" stroke-width="4"/>
  <rect x="240" y="322" width="20" height="6" fill="#333" rx="2"/>
  <line x1="150" y1="300" x2="250" y2="300" stroke="#555" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="220" cy="150" rx="55" ry="45" fill="#FFF8E7" stroke="#E8D5A3" stroke-width="2"/>

  <!-- Wing -->
  <path d="M 180 140 Q 160 160 180 190 Q 200 200 230 180 Q 250 160 230 130 Q 200 120 180 140 Z" fill="#F5E6C8" stroke="#E8D5A3" stroke-width="1.5"/>
  <line x1="200" y1="135" x2="210" y2="170" stroke="#E8D5A3" stroke-width="1"/>
  <line x1="190" y1="140" x2="195" y2="175" stroke="#E8D5A3" stroke-width="1"/>

  <!-- Neck -->
  <path d="M 260 135 Q 280 120 285 90 Q 287 75 280 65" fill="none" stroke="#FFF8E7" stroke-width="25" stroke-linecap="round"/>
  <path d="M 260 135 Q 280 120 285 90 Q 287 75 280 65" fill="none" stroke="#E8D5A3" stroke-width="25" stroke-linecap="round"/>
  <path d="M 260 135 Q 280 120 285 90 Q 287 75 280 65" fill="none" stroke="#FFF8E7" stroke-width="21" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="285" cy="60" r="22" fill="#FFF8E7" stroke="#E8D5A3" stroke-width="2"/>

  <!-- Big pelican beak -->
  <path d="M 300 50 Q 360 45 370 60 Q 360 75 300 70 Z" fill="#FFB74D" stroke="#F57C00" stroke-width="1.5"/>
  <!-- Pouch -->
  <path d="M 305 68 Q 330 100 365 68" fill="#FFB74D" stroke="#F57C00" stroke-width="1.5"/>
  <!-- Beak line -->
  <line x1="300" y1="60" x2="368" y2="60" stroke="#F57C00" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="292" cy="52" r="5" fill="white" stroke="#333" stroke-width="1"/>
  <circle cx="294" cy="52" r="2.5" fill="#333"/>
  <circle cx="295" cy="50" r="1" fill="white"/>

  <!-- Eye patch for pirate pelican -->
  <path d="M 283 48 Q 295 46 300 50 Q 295 58 283 55 Z" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="273" y1="52" x2="292" y2="49" stroke="#333" stroke-width="1.5"/>

  <!-- Leg to pedal -->
  <line x1="210" y1="190" x2="230" y2="260" stroke="#FFB74D" stroke-width="6" stroke-linecap="round"/>
  <line x1="230" y1="260" x2="250" y2="325" stroke="#FFB74D" stroke-width="5" stroke-linecap="round"/>
  <!-- Foot on pedal -->
  <ellipse cx="250" cy="328" rx="12" ry="5" fill="#FFB74D" stroke="#F57C00" stroke-width="1"/>

  <!-- Second leg (up position) -->
  <line x1="200" y1="190" x2="220" y2="240" stroke="#FFB74D" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="240" x2="240" y2="280" stroke="#FFB74D" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="240" cy="283" rx="10" ry="4" fill="#FFB74D" stroke="#F57C00" stroke-width="1"/>

  <!-- Tail feathers -->
  <path d="M 165 165 Q 145 160 135 170" stroke="#E8D5A3" stroke-width="2" fill="none"/>
  <path d="M 165 155 Q 140 155 130 160" stroke="#E8D5A3" stroke-width="2" fill="none"/>
  <path d="M 168 175 Q 150 175 140 185" stroke="#E8D5A3" stroke-width="2" fill="none"/>

  <!-- Sunglasses on head -->
  <path d="M 268 38 Q 280 32 295 35 Q 310 32 318 38" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Small helmet -->
  <ellipse cx="285" cy="40" rx="24" ry="15" fill="#FFD700" stroke="#FFA000" stroke-width="2"/>
  <path d="M 262 42 Q 285 50 308 42" fill="none" stroke="#FFA000" stroke-width="1"/>

  <!-- Basket on front -->
  <path d="M 380 190 L 420 190 L 425 220 L 375 220 Z" fill="#DEB887" stroke="#8B4513" stroke-width="2"/>
  <line x1="385" y1="195" x2="415" y2="195" stroke="#8B4513" stroke-width="1"/>
  <line x1="383" y1="205" x2="417" y2="205" stroke="#8B4513" stroke-width="1"/>
  <line x1="381" y1="215" x2="419" y2="215" stroke="#8B4513" stroke-width="1"/>

  <!-- Fish in basket -->
  <path d="M 388 205 Q 398 198 408 205 Q 398 212 388 205 Z" fill="#4FC3F7" stroke="#0288D1" stroke-width="1"/>
  <circle cx="390" cy="204" r="1.5" fill="#333"/>

  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="40" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="110" cy="55" rx="30" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="500" cy="80" rx="35" ry="15" fill="white" opacity="0.7"/>
  <ellipse cx="525" cy="75" rx="25" ry="12" fill="white" opacity="0.7"/>
</svg>