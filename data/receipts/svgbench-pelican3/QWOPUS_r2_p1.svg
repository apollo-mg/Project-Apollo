<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="700" cy="80" r="50" fill="url(#sun)"/>
  <circle cx="700" cy="80" r="40" fill="#FFF9C4"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.8">
    <ellipse cx="120" cy="80" rx="60" ry="25"/>
    <ellipse cx="160" cy="70" rx="45" ry="22"/>
    <ellipse cx="180" cy="85" rx="40" ry="20"/>
    
    <ellipse cx="450" cy="50" rx="55" ry="22"/>
    <ellipse cx="490" cy="40" rx="45" ry="20"/>
    <ellipse cx="510" cy="55" rx="40" ry="18"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="url(#ground)"/>
  <!-- Grass tufts -->
  <g stroke="#388E3C" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 50 530 Q 52 515 48 525"/>
    <path d="M 60 530 Q 63 512 65 525"/>
    <path d="M 150 525 Q 153 510 150 522"/>
    <path d="M 160 528 Q 164 513 166 524"/>
    <path d="M 600 525 Q 603 510 600 522"/>
    <path d="M 650 530 Q 654 515 657 525"/>
    <path d="M 720 528 Q 723 513 726 524"/>
  </g>

  <!-- ==================== BICYCLE ==================== -->
  <g>
    <!-- Rear wheel -->
    <circle cx="180" cy="460" r="75" fill="none" stroke="#37474F" stroke-width="5"/>
    <circle cx="180" cy="460" r="8" fill="#37474F"/>
    <g stroke="#78909C" stroke-width="1.5">
      <line x1="180" y1="460" x2="180" y2="385"/>
      <line x1="180" y1="460" x2="245" y2="460"/>
      <line x1="180" y1="460" x2="233" y2="513"/>
      <line x1="180" y1="460" x2="127" y2="513"/>
      <line x1="180" y1="460" x2="105" y2="460"/>
      <line x1="180" y1="460" x2="127" y2="407"/>
      <line x1="180" y1="460" x2="233" y2="407"/>
    </g>
    <!-- Tire tread -->
    <circle cx="180" cy="460" r="72" fill="none" stroke="#263238" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Front wheel -->
    <circle cx="560" cy="460" r="75" fill="none" stroke="#37474F" stroke-width="5"/>
    <circle cx="560" cy="460" r="8" fill="#37474F"/>
    <g stroke="#78909C" stroke-width="1.5">
      <line x1="560" y1="460" x2="560" y2="385"/>
      <line x1="560" y1="460" x2="625" y2="460"/>
      <line x1="560" y1="460" x2="613" y2="513"/>
      <line x1="560" y1="460" x2="507" y2="513"/>
      <line x1="560" y1="460" x2="485" y2="460"/>
      <line x1="560" y1="460" x2="507" y2="407"/>
      <line x1="560" y1="460" x2="613" y2="407"/>
    </g>
    <circle cx="560" cy="460" r="72" fill="none" stroke="#263238" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Frame -->
    <g stroke="#B71C1C" stroke-width="5" stroke-linecap="round">
      <!-- Seat tube -->
      <line x1="320" y1="440" x2="298" y2="290"/>
      <!-- Top tube -->
      <line x1="298" y1="290" x2="500" y2="310"/>
      <!-- Down tube -->
      <line x1="500" y1="310" x2="320" y2="440"/>
      <!-- Seat stay -->
      <line x1="180" y1="460" x2="298" y2="290"/>
      <!-- Chain stay -->
      <line x1="180" y1="460" x2="320" y2="440"/>
      <!-- Head tube -->
      <line x1="500" y1="310" x2="515" y2="282"/>
      <!-- Fork -->
      <line x1="515" y1="282" x2="560" y2="460"/>
    </g>
    
    <!-- Handlebar stem -->
    <line x1="515" y1="282" x2="515" y2="258" stroke="#37474F" stroke-width="4"/>
    <!-- Handlebars -->
    <path d="M 515 258 Q 530 240 555 250 Q 575 260 572 285" fill="none" stroke="#37474F" stroke-width="4" stroke-linecap="round"/>
    <!-- Grip -->
    <line x1="570" y1="280" x2="574" y2="292" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>

    <!-- Seat post -->
    <line x1="298" y1="290" x2="295" y2="275" stroke="#37474F" stroke-width="4"/>
    <!-- Seat -->
    <ellipse cx="295" cy="272" rx="22" ry="8" fill="#37474F"/>
    <ellipse cx="295" cy="270" rx="20" ry="6" fill="#455A64"/>

    <!-- Pedal crank area -->
    <circle cx="320" cy="440" r="12" fill="none" stroke="#37474F" stroke-width="3"/>
    <!-- Crank arm (front pedal) -->
    <line x1="320" y1="440" x2="345" y2="468" stroke="#37474F" stroke-width="4"/>
    <!-- Front pedal -->
    <rect x="336" y="464" width="20" height="8" rx="2" fill="#37474F"/>
    
    <!-- Crank arm (rear pedal) -->
    <line x1="320" y1="440" x2="295" y2="420" stroke="#546E7A" stroke-width="4"/>
    <!-- Rear pedal -->
    <rect x="284" y="416" width="20" height="8" rx="2" fill="#546E7A"/>

    <!-- Chain -->
    <line x1="185" y1="455" x2="320" y2="432" stroke="#78909C" stroke-width="2" stroke-dasharray="3 2"/>
    <line x1="185" y1="465" x2="320" y2="448" stroke="#78909C" stroke-width="2" stroke-dasharray="3 2"/>
  </g>

  <!-- ==================== PELICAN ==================== -->
  <g>
    <!-- Body (main) -->
    <ellipse cx="285" cy="240" rx="62" ry="42" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2" transform="rotate(-8 285 240)"/>
    
    <!-- Wing detail -->
    <path d="M 245 250 Q 260 235 290 240 Q 305 245 295 265 Q 280 278 250 268 Q 240 260 245 250" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="1.5"/>
    <path d="M 255 255 Q 270 248 285 252 Q 295 255 288 265 Q 278 272 260 266 Q 252 260 255 255" fill="#E8EAF6" stroke="#B0BEC5" stroke-width="1"/>
    
    <!-- Tail feathers -->
    <path d="M 230 230 L 208 195 L 218 205 L 212 178 L 228 195 L 235 172 L 242 195 Z" 
          fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5"/>
    <path d="M 225 235 L 205 205 L 215 212 L 210 190 L 224 204 L 230 185 L 237 202 Z" 
          fill="#ECEFF1" stroke="#B0BEC5" stroke-width="1"/>

    <!-- Neck -->
    <path d="M 325 215 Q 340 190 355 165 Q 365 150 372 140 Q 378 132 385 135 Q 390 138 385 148 
             Q 375 162 365 180 Q 350 210 335 230" 
          fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="388" cy="133" r="21" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2"/>
    
    <!-- Head feather tuft -->
    <path d="M 380 115 Q 375 105 380 98 Q 385 105 390 100 Q 392 108 397 105 Q 395 112 400 112 Q 396 118 400 120" 
          fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5"/>

    <!-- Eye -->
    <circle cx="395" cy="128" r="5" fill="#FFFFFF" stroke="#37474F" stroke-width="1"/>
    <circle cx="396" cy="128" r="2.5" fill="#37474F"/>
    <circle cx="397" cy="127" r="1" fill="#FFFFFF"/>

    <!-- Upper beak -->
    <path d="M 405 132 L 478 142 Q 485 145 480 150 L 405 143" 
          fill="#FF8F00" stroke="#E65100" stroke-width="1.5"/>
    <!-- Beak ridge -->
    <line x1="405" y1="138" x2="475" y2="148" stroke="#E65100" stroke-width="0.8" opacity="0.5"/>

    <!-- Lower beak / Pouch -->
    <path d="M 405 143 Q 435 178 475 172 Q 485 170 480 150 L 405 143" 
          fill="#FFA726" stroke="#E65100" stroke-width="1.5"/>
    <!-- Pouch detail -->
    <path d="M 415 150 Q 440 168 468 164" fill="none" stroke="#FF8F00" stroke-width="1.5" opacity="0.6"/>
    <path d="M 420 155 Q 440 170 462 166" fill="none" stroke="#FF8F00" stroke-width="1.5" opacity="0.4"/>

    <!-- Right leg (far side) - on front pedal -->
    <path d="M 305 268 Q 318 320 330 400 Q 335 420 340 435" 
          fill="none" stroke="#FF8F00" stroke-width="5" stroke-linecap="round"/>
    <!-- Right foot -->
    <path d="M 340 464 Q 345 458 350 464 Q 348 470 340 468 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1"/>

    <!-- Left leg (near side) - on rear pedal -->
    <path d="M 290 272 Q 295 340 293 400 Q 292 415 292 420" 
          fill="none" stroke="#FFA726" stroke-width="6" stroke-linecap="round"/>
    <!-- Left foot -->
    <path d="M 292 416 Q 298 410 302 416 Q 300 422 292 420 Z" fill="#FFA726" stroke="#E65100" stroke-width="1"/>

    <!-- Water drop near beak (fun detail) -->
    <ellipse cx="492" cy="160" rx="2" ry="3" fill="#4FC3F7" opacity="0.6"/>
    <ellipse cx="498" cy="170" rx="1.5" ry="2.5" fill="#4FC3F7" opacity="0.5"/>
  </g>

  <!-- Road/path -->
  <rect x="0" y="518" width="800" height="6" fill="#8D6E63" rx="2"/>
</svg>