<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE5D9" />
      <stop offset="100%" stop-color="#FFF3E0" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4C6" />
      <stop offset="100%" stop-color="#FAD6A5" />
    </linearGradient>
    
    <!-- Pelican Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E6ED" />
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD892" />
      <stop offset="100%" stop-color="#F89B6D" />
    </linearGradient>

    <!-- Bicycle Gradients -->
    <linearGradient id="bikeFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
      <feOffset dx="0" dy="10" />
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)" />
  
  <!-- Sun -->
  <circle cx="650" cy="120" r="60" fill="#FFD166" opacity="0.8" />
  <circle cx="650" cy="120" r="40" fill="#FFD166" />

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="150" cy="100" r="40" />
    <circle cx="200" cy="80" r="50" />
    <circle cx="250" cy="110" r="35" />
    <rect x="150" y="90" width="100" height="55" rx="20" />
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="550" cy="200" r="30" />
    <circle cx="590" cy="180" r="40" />
    <circle cx="630" cy="200" r="25" />
    <rect x="550" y="190" width="80" height="35" rx="15" />
  </g>

  <!-- Ground -->
  <path d="M 0,450 Q 400,420 800,480 L 800,600 L 0,600 Z" fill="url(#groundGrad)" />
  
  <!-- Ground Details / Hills -->
  <path d="M -50,500 Q 300,460 850,550" fill="none" stroke="#F4A6A6" stroke-width="4" opacity="0.6" stroke-linecap="round" />
  <path d="M 100,480 Q 400,450 700,520" fill="none" stroke="#F4A6A6" stroke-width="4" opacity="0.6" stroke-linecap="round" />

  <!-- Cast Shadows -->
  <ellipse cx="400" cy="495" rx="120" ry="15" fill="#000000" opacity="0.15" />

  <!-- Main Bicycle & Pelican Group -->
  <g transform="translate(-5, -35)">
    
    <!-- BICYCLE BACK WHEEL -->
    <g transform="translate(220, 440)">
      <!-- Outer Tire -->
      <circle r="50" fill="none" stroke="#434B54" stroke-width="8" />
      <!-- Inner Rim -->
      <circle r="40" fill="none" stroke="#D64028" stroke-width="4" opacity="0.8" />
      <!-- Spokes -->
      <g stroke="#93A1A8" stroke-width="1.5">
        <line x1="0" y1="-40" x2="0" y2="40" />
        <line x1="-40" y1="0" x2="40" y2="0" />
        <line x1="-28" y1="-28" x2="28" y2="28" />
        <line x1="28" y1="-28" x2="-28" y2="28" />
        <line x1="-38" y1="-12" x2="38" y2="12" />
        <line x1="38" y1="-12" x2="-38" y2="12" />
        <line x1="-12" y1="-38" x2="12" y2="38" />
        <line x1="12" y1="-38" x2="-12" y2="38" />
      </g>
      <!-- Hub -->
      <circle r="8" fill="#93A1A8" stroke="#434B54" stroke-width="2" />
    </g>

    <!-- BICYCLE FRONT WHEEL -->
    <g transform="translate(520, 440)">
      <!-- Outer Tire -->
      <circle r="50" fill="none" stroke="#434B54" stroke-width="8" />
      <!-- Inner Rim -->
      <circle r="40" fill="none" stroke="#D64028" stroke-width="4" opacity="0.8" />
      <!-- Spokes -->
      <g stroke="#93A1A8" stroke-width="1.5">
        <line x1="0" y1="-40" x2="0" y2="40" />
        <line x1="-40" y1="0" x2="40" y2="0" />
        <line x1="-28" y1="-28" x2="28" y2="28" />
        <line x1="28" y1="-28" x2="-28" y2="28" />
        <line x1="-38" y1="-12" x2="38" y2="12" />
        <line x1="38" y1="-12" x2="-38" y2="12" />
        <line x1="-12" y1="-38" x2="12" y2="38" />
        <line x1="12" y1="-38" x2="-12" y2="38" />
      </g>
      <!-- Hub -->
      <circle r="8" fill="#93A1A8" stroke="#434B54" stroke-width="2" />
    </g>

    <!-- BICYCLE FRAME -->
    <!-- Rear Triangle -->
    <path d="M 220,440 L 330,350 L 330,440 Z" fill="none" stroke="url(#bikeFrame)" stroke-width="8" stroke-linejoin="round" />
    <!-- Top Tube -->
    <line x1="330" y1="350" x2="510" y2="350" stroke="url(#bikeFrame)" stroke-width="8" />
    <!-- Down Tube -->
    <line x1="330" y1="350" x2="450" y2="350" stroke="url(#bikeFrame)" stroke-width="12" /> <!-- Thickening slightly for style -->
    <line x1="450" y1="350" x2="520" y2="440" stroke="url(#bikeFrame)" stroke-width="10" />
    <!-- Head Tube -->
    <line x1="510" y1="350" x2="525" y2="440" stroke="url(#bikeFrame)" stroke-width="8" />
    
    <!-- Seatpost -->
    <line x1="330" y1="350" x2="320" y2="300" stroke="#93A1A8" stroke-width="6" />
    <!-- Seat -->
    <path d="M 295,300 Q 320,290 345,300 L 335,310 L 305,310 Z" fill="#434B54" />
    
    <!-- Handlebar Stem -->
    <path d="M 510,350 L 490,300" stroke="#93A1A8" stroke-width="6" />
    <!-- Handlebars -->
    <path d="M 490,300 Q 530,300 520,340" fill="none" stroke="#93A1A8" stroke-width="6" stroke-linecap="round" />

    <!-- Pedal Mechanism -->
    <!-- Crankset Center -->
    <circle cx="330" cy="440" r="15" fill="#93A1A8" stroke="#434B54" stroke-width="2" />
    <circle cx="330" cy="440" r="6" fill="#434B54" />
    
    <!-- Crank Arm 1 (Up) -->
    <line x1="330" y1="440" x2="365" y2="390" stroke="#D64028" stroke-width="6" stroke-linecap="round" />
    <!-- Pedal 1 -->
    <rect x="355" y="385" width="25" height="8" rx="2" fill="#434B54" />
    
    <!-- Crank Arm 2 (Down) -->
    <line x1="330" y1="440" x2="295" y2="490" stroke="#D64028" stroke-width="6" stroke-linecap="round" />
    <!-- Pedal 2 -->
    <rect x="280" y="485" width="30" height="8" rx="2" fill="#434B54" />

    <!-- Chain -->
    <path d="M 220,430 Q 330,410 360,435 L 345,440 Z" fill="none" stroke="#434B54" stroke-width="3" opacity="0.6" />
    <path d="M 220,450 Q 330,470 300,445 L 315,440 Z" fill="none" stroke="#434B54" stroke-width="3" opacity="0.6" />

    <!-- PELICAN (RIDER) -->
    <g transform="rotate(-15 330 280)">
      <!-- Pelican Tail -->
      <path d="M 290,260 L 240,230 L 280,250 Z" fill="url(#bodyGrad)" stroke="#D1D9E0" stroke-width="2" />
      
      <!-- Pelican Body -->
      <path d="M 350,230 C 380,270 350,310 300,290 C 270,280 270,240 300,230 C 320,220 340,220 350,230 Z" fill="url(#bodyGrad)" stroke="#D1D9E0" stroke-width="3" />
      
      <!-- Pelican Wing -->
      <path d="M 310,250 C 340,280 380,270 390,230 C 370,220 350,230 310,250 Z" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="2" />

      <!-- Pelican Head & Beak Assembly -->
      <g transform="rotate(-5 360 210)">
        <!-- Neck / Head -->
        <circle cx="360" cy="210" r="22" fill="url(#bodyGrad)" stroke="#D1D9E0" stroke-width="3" />
        
        <!-- Eye -->
        <circle cx="365" cy="205" r="4" fill="#434B54" />
        <circle cx="366" cy="204" r="1" fill="#FFFFFF" />

        <!-- Beak Top -->
        <path d="M 375,205 Q 450,215 480,230 L 465,230 Q 400,215 375,205 Z" fill="url(#beakGrad)" stroke="#E77B46" stroke-width="1" />
        
        <!-- Beak Bottom (Gape) -->
        <path d="M 370,225 Q 440,240 480,230 Q 460,235 420,230 Q 390,225 370,225 Z" fill="#E77B46" stroke="#D35F35" stroke-width="1" />
        
        <!-- Smile line -->
        <path d="M 370,225 Q 420,235 480,230" fill="none" stroke="#D35F35" stroke-width="1.5" />

        <!-- Sunglasses (Riding chic!) -->
        <path d="M 345,200 Q 360,200 370,205 L 370,210 Q 360,210 350,205 Z" fill="#2C3E50" opacity="0.8" />
        <line x1="345" y1="200" x2="335" y2="195" stroke="#2C3E50" stroke-width="2" />
      </g>

      <!-- Legs -->
      <!-- Left Leg (Pedaling up) -->
      <path d="M 330,290 Q 350,340 365,390" fill="none" stroke="#D1D9E0" stroke-width="8" stroke-linecap="round" />
      <circle cx="365" cy="390" r="6" fill="#434B54" />

      <!-- Right Leg (Pedaling down) -->
      <path d="M 330,290 Q 310,390 295,490" fill="none" stroke="#D1D9E0" stroke-width="8" stroke-linecap="round" />
      <circle cx="295" cy="490" r="6" fill="#434B54" />
    </g>
    
    <!-- Pelican Arm (Over handlebars) -->
    <path d="M 350,250 Q 420,220 505,305" fill="none" stroke="#D1D9E0" stroke-width="8" stroke-linecap="round" />
    
    <!-- Pelican Wing Detail / Fold -->
    <path d="M 380,235 Q 390,260 350,280" fill="none" stroke="#D1D9E0" stroke-width="2" opacity="0.5" />

  </g>
</svg>