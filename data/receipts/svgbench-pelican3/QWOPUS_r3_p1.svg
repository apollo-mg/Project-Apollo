<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
 <!-- Background sky -->
 <rect width="800" height="600" fill="#87CEEB"/>
 
 <!-- Sun -->
 <circle cx="700" cy="80" r="50" fill="#FFD700"/>
 
 <!-- Clouds -->
 <ellipse cx="150" cy="80" rx="60" ry="30" fill="white" opacity="0.9"/>
 <ellipse cx="190" cy="70" rx="50" ry="25" fill="white" opacity="0.9"/>
 <ellipse cx="110" cy="75" rx="45" ry="22" fill="white" opacity="0.9"/>
 
 <ellipse cx="500" cy="120" rx="55" ry="25" fill="white" opacity="0.8"/>
 <ellipse cx="540" cy="110" rx="45" ry="22" fill="white" opacity="0.8"/>
 
 <!-- Ground / Road -->
 <rect x="0" y="480" width="800" height="120" fill="#8B4513"/>
 <rect x="0" y="480" width="800" height="5" fill="#A0522D"/>
 
 <!-- Road line -->
 <line x1="0" y1="520" x2="800" y2="520" stroke="white" stroke-width="3" stroke-dasharray="20,15"/>
 
 <!-- Bicycle shadow -->
 <ellipse cx="400" cy="500" rx="120" ry="10" fill="rgba(0,0,0,0.2)"/>
 
 <!-- Bicycle Frame -->
 <g stroke="#222" stroke-width="4" fill="none" stroke-linecap="round">
 <!-- Bottom bracket to crank -->
 <circle cx="400" cy="450" r="5" fill="#222"/>
 <!-- Chain ring -->
 <circle cx="400" cy="450" r="25" stroke="#444" stroke-width="3" fill="none"/>
 <circle cx="400" cy="450" r="15" stroke="#444" stroke-width="2" fill="none"/>
 
 <!-- Down tube - from seat tube to bottom bracket -->
 <line x1="350" y1="370" x2="400" y2="450"/>
 <!-- Top tube - from seat tube to head tube -->
 <line x1="350" y1="370" x2="480" y2="370"/>
 <!-- Seat tube - from seat to bottom bracket -->
 <line x1="350" y1="370" x2="400" y2="450"/>
 <!-- Head tube -->
 <line x1="480" y1="370" x2="490" y2="350"/>
 <!-- Fork -->
 <line x1="490" y1="350" x2="520" y2="450"/>
 <!-- Seat stay -->
 <line x1="350" y1="370" x2="320" y2="330"/>
 <!-- Chain stay -->
 <line x1="400" y1="450" x2="320" y2="450"/>
 
 <!-- Rear wheel hub to seat stay -->
 <line x1="320" y1="330" x2="320" y2="450"/>
 </g>
 
 <!-- Seat -->
 <line x1="320" y1="330" x2="310" y2="300" stroke="#222" stroke-width="4"/>
 <ellipse cx="305" cy="295" rx="18" ry="6" fill="#333"/>
 
 <!-- Handlebars -->
 <line x1="490" y1="350" x2="510" y2="320" stroke="#222" stroke-width="4"/>
 <path d="M 510 320 Q 530 310 535 325" stroke="#222" stroke-width="4" fill="none"/>
 <circle cx="535" cy="325" r="3" fill="#222"/>
 
 <!-- Front wheel -->
 <circle cx="520" cy="450" r="50" stroke="#333" stroke-width="4" fill="none"/>
 <circle cx="520" cy="450" r="5" fill="#333"/>
 <!-- Spokes front wheel -->
 <line x1="520" y1="400" x2="520" y2="500" stroke="#666" stroke-width="1"/>
 <line x1="470" y1="450" x2="570" y2="450" stroke="#666" stroke-width="1"/>
 <line x1="485" y1="415" x2="555" y2="485" stroke="#666" stroke-width="1"/>
 <line x1="485" y1="485" x2="555" y2="415" stroke="#666" stroke-width="1"/>
 <line x1="495" y1="405" x2="545" y2="495" stroke="#666" stroke-width="1"/>
 <line x1="545" y1="405" x2="495" y2="495" stroke="#666" stroke-width="1"/>
 
 <!-- Rear wheel -->
 <circle cx="320" cy="450" r="50" stroke="#333" stroke-width="4" fill="none"/>
 <circle cx="320" cy="450" r="5" fill="#333"/>
 <!-- Spokes rear wheel -->
 <line x1="320" y1="400" x2="320" y2="500" stroke="#666" stroke-width="1"/>
 <line x1="270" y1="450" x2="370" y2="450" stroke="#666" stroke-width="1"/>
 <line x1="285" y1="415" x2="355" y2="485" stroke="#666" stroke-width="1"/>
 <line x1="285" y1="485" x2="355" y2="415" stroke="#666" stroke-width="1"/>
 <line x1="295" y1="405" x2="345" y2="495" stroke="#666" stroke-width="1"/>
 <line x1="345" y1="405" x2="295" y2="495" stroke="#666" stroke-width="1"/>
 
 <!-- Pedals and Cranks -->
 <line x1="400" y1="450" x2="370" y2="470" stroke="#333" stroke-width="3"/>
 <line x1="400" y1="450" x2="430" y2="430" stroke="#333" stroke-width="3"/>
 <rect x="360" y="465" width="20" height="8" rx="2" fill="#333"/>
 <rect x="425" y="425" width="20" height="8" rx="2" fill="#333"/>
 
 <!-- PELICAN BODY -->
 <g>
 <!-- Tail -->
 <path d="M 280 280 Q 260 260 270 240 Q 280 260 300 270 Z" fill="#FFF8DC" stroke="#DAA520" stroke-width="1"/>
 
 <!-- Body -->
 <ellipse cx="340" cy="270" rx="60" ry="45" fill="#FFF8DC" stroke="#DAA520" stroke-width="2"/>
 
 <!-- Wing -->
 <path d="M 300 260 Q 330 240 360 255 Q 340 265 310 270 Z" fill="#F5DEB3" stroke="#DAA520" stroke-width="1"/>
 
 <!-- Neck -->
 <path d="M 380 240 Q 400 200 390 160 Q 380 140 400 130" fill="none" stroke="#FFF8DC" stroke-width="18" stroke-linecap="round"/>
 <path d="M 380 240 Q 400 200 390 160 Q 380 140 400 130" fill="none" stroke="#DAA520" stroke-width="2"/>
 
 <!-- Head -->
 <ellipse cx="410" cy="120" rx="25" ry="20" fill="#FFF8DC" stroke="#DAA520" stroke-width="2"/>
 
 <!-- Eye -->
 <circle cx="420" cy="115" r="4" fill="#333"/>
 <circle cx="421" cy="114" r="1.5" fill="white"/>
 
 <!-- Beak - upper -->
 <path d="M 430 115 L 490 120 Q 495 122 490 125 L 430 120 Z" fill="#FF8C00" stroke="#E67E22" stroke-width="1"/>
 <!-- Beak - pouch -->
 <path d="M 430 120 L 490 125 Q 480 140 460 140 Q 440 138 430 125 Z" fill="#FFA07A" stroke="#E67E22" stroke-width="1"/>
 <line x1="440" y1="122" x2="480" y2="128" stroke="#E67E22" stroke-width="0.5"/>
 <line x1="445" y1="124" x2="475" y2="132" stroke="#E67E22" stroke-width="0.5"/>
 
 <!-- Legs (feet on pedals) -->
 <line x1="330" y1="300" x2="330" y2="370" stroke="#FF8C00" stroke-width="5" stroke-linecap="round"/>
 <line x1="330" y1="370" x2="330" y2="430" stroke="#FF8C00" stroke-width="4" stroke-linecap="round"/>
 <!-- Feet -->
 <ellipse cx="370" cy="470" rx="10" ry="5" fill="#FF8C00" stroke="#E67E22" stroke-width="1" transform="rotate(-15, 370, 470)"/>
 <ellipse cx="430" cy="430" rx="10" ry="5" fill="#FF8C00" stroke="#E67E22" stroke-width="1" transform="rotate(15, 430, 430)"/>
 
 <!-- Second leg (behind) -->
 <line x1="360" y1="300" x2="380" y2="370" stroke="#FF8C00" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
 <line x1="380" y1="370" x2="420" y2="440" stroke="#FF8C00" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
 </g>
 
 <!-- Helmet (fun touch) -->
 <ellipse cx="410" cy="105" rx="20" ry="12" fill="#FF6B6B" stroke="#E63946" stroke-width="1.5"/>
 <path d="M 390 108 Q 410 95 430 108" fill="none" stroke="#E63946" stroke-width="1"/>
 
 <!-- Motion lines -->
 <g stroke="#87CEEB" stroke-width="2" opacity="0.6">
 <line x1="200" y1="300" x2="250" y2="300"/>
 <line x1="190" y1="320" x2="240" y2="320"/>
 <line x1="210" y1="340" x2="255" y2="340"/>
 </g>
</svg>