<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky background -->
  <rect width="800" height="600" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="500" width="800" height="100" fill="#7CB342"/>
  <rect x="0" y="500" width="800" height="8" fill="#558B2F"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="60" ry="25" fill="white" opacity="0.9"/>
  <ellipse cx="190" cy="75" rx="45" ry="22" fill="white" opacity="0.9"/>
  <ellipse cx="120" cy="75" rx="40" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="600" cy="100" rx="50" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="640" cy="95" rx="40" ry="18" fill="white" opacity="0.9"/>
  
  <!-- Sun -->
  <circle cx="700" cy="70" r="40" fill="#FFD700"/>
  
  <!-- === BICYCLE === -->
  
  <!-- Rear wheel -->
  <circle cx="280" cy="450" r="75" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="280" cy="450" r="72" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="280" cy="450" r="8" fill="#888"/>
  <!-- Rear spokes -->
  <line x1="280" y1="378" x2="280" y2="522" stroke="#999" stroke-width="2"/>
  <line x1="208" y1="450" x2="352" y2="450" stroke="#999" stroke-width="2"/>
  <line x1="229" y1="399" x2="331" y2="501" stroke="#999" stroke-width="2"/>
  <line x1="229" y1="501" x2="331" y2="399" stroke="#999" stroke-width="2"/>
  
  <!-- Front wheel -->
  <circle cx="520" cy="450" r="75" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="520" cy="450" r="72" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="520" cy="450" r="8" fill="#888"/>
  <!-- Front spokes -->
  <line x1="520" y1="378" x2="520" y2="522" stroke="#999" stroke-width="2"/>
  <line x1="448" y1="450" x2="592" y2="450" stroke="#999" stroke-width="2"/>
  <line x1="469" y1="399" x2="571" y2="501" stroke="#999" stroke-width="2"/>
  <line x1="469" y1="501" x2="571" y2="399" stroke="#999" stroke-width="2"/>
  
  <!-- Frame -->
  <!-- Down tube -->
  <line x1="520" y1="450" x2="400" y2="310" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="280" y1="450" x2="340" y2="300" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="340" y1="300" x2="460" y2="310" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
  <!-- Chain stay -->
  <line x1="280" y1="450" x2="400" y2="310" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="280" y1="450" x2="340" y2="300" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="520" y1="450" x2="470" y2="280" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Seat post -->
  <line x1="340" y1="300" x2="330" y2="260" stroke="#555" stroke-width="5"/>
  <!-- Seat -->
  <ellipse cx="335" cy="258" rx="28" ry="8" fill="#333"/>
  
  <!-- Handlebar post -->
  <line x1="470" y1="280" x2="465" y2="240" stroke="#555" stroke-width="5"/>
  <!-- Handlebars -->
  <path d="M 440 240 Q 465 225 490 240" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Chainring and pedal -->
  <circle cx="400" cy="310" r="18" fill="none" stroke="#666" stroke-width="3"/>
  <circle cx="400" cy="310" r="4" fill="#666"/>
  
  <!-- Rear gear -->
  <circle cx="280" cy="450" r="12" fill="none" stroke="#666" stroke-width="3"/>
  
  <!-- Chain (simplified) -->
  <path d="M 400 292 Q 340 350 280 438" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 400 328 Q 340 420 280 462" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- Pedals -->
  <line x1="400" y1="310" x2="385" y2="345" stroke="#444" stroke-width="4"/>
  <rect x="375" y="340" width="22" height="6" fill="#333" rx="2"/>
  
  <!-- === PELICAN === -->
  
  <!-- Pelican body (white) -->
  <ellipse cx="380" cy="240" rx="55" ry="65" fill="#FFF8E7" transform="rotate(-10, 380, 240)"/>
  
  <!-- Pelican chest -->
  <ellipse cx="400" cy="260" rx="40" ry="50" fill="#FFFFFF"/>
  
  <!-- Neck -->
  <path d="M 420 230 Q 450 210 470 170 Q 475 155 465 145" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
  <path d="M 420 230 Q 450 210 470 170 Q 475 155 465 145" fill="none" stroke="#FFF8E7" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Head -->
  <ellipse cx="468" cy="135" rx="32" ry="30" fill="#FFFFFF"/>
  
  <!-- Back -->
  <path d="M 340 200 Q 350 220 345 250" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  
  <!-- Tail feathers -->
  <path d="M 330 250 L 290 240 L 295 260 Z" fill="#FFFFFF"/>
  <path d="M 332 245 L 285 255 L 300 265 Z" fill="#F5F5F0"/>
  <path d="M 335 240 L 290 230 L 298 245 Z" fill="#F0F0EA"/>
  
  <!-- Wing (folded on body) -->
  <path d="M 350 220 Q 370 210 400 225 Q 410 235 395 250 Q 370 260 345 245 Z" fill="#E8E4D8"/>
  <path d="M 355 225 Q 375 218 395 230" fill="none" stroke="#D0CCC0" stroke-width="2"/>
  
  <!-- Wing on handlebar -->
  <path d="M 410 235 Q 440 220 460 245" fill="none" stroke="#FFF8E7" stroke-width="14" stroke-linecap="round"/>
  <path d="M 460 245 Q 468 248 472 242" fill="none" stroke="#FFF8E7" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Eye -->
  <circle cx="478" cy="128" r="7" fill="#FFF"/>
  <circle cx="479" cy="127" r="4" fill="#333"/>
  <circle cx="480" cy="126" r="1.5" fill="#FFF"/>
  
  <!-- Beak (upper) -->
  <path d="M 490 138 Q 530 140 565 148 Q 570 150 568 152 Q 530 148 492 148 Z" fill="#FFB74D"/>
  
  <!-- Beak (lower with pouch) -->
  <path d="M 492 148 Q 530 150 568 152 Q 560 175 540 180 Q 510 185 490 160 Z" fill="#FF9800"/>
  
  <!-- Beak line -->
  <line x1="490" y1="148" x2="568" y2="152" stroke="#F57C00" stroke-width="1.5"/>
  
  <!-- Leg to pedal -->
  <line x1="390" y1="290" x2="385" y2="335" stroke="#FFB74D" stroke-width="6" stroke-linecap="round"/>
  <!-- Pelican foot on pedal -->
  <path d="M 378 340 L 395 340 L 390 345 L 380 345 Z" fill="#FF9800"/>
  
  <!-- Back leg (behind) -->
  <line x1="370" y1="295" x2="350" y2="340" stroke="#FFB74D" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Motion lines -->
  <line x1="220" y1="380" x2="180" y2="380" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="200" y1="400" x2="150" y2="400" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="210" y1="420" x2="170" y2="420" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  
</svg>