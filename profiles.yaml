architect:
  endpoint: http://10.0.0.71:8082/v1
  role: Lead Architect
  model: Qwen 3.6 27B
  memory_file: LOCAL_AGENT_CONTEXT.md
  allowed_tools:
    - file_read
    - file_edit
    - file_write
    - grep
    - glob
    - web_fetch
    - system_metrics
    - delegate_task
    - codebase_investigator
    - ask_user
    - starbuck_system_recon
    - starbuck_read_config
    - starbuck_write_config
    - starbuck_deploy_cluster
    - starbuck_install_package
    - starbuck_read_scratchpad
    - starbuck_write_scratchpad
    - starbuck_manage_service
    - starbuck_read_journal
    - starbuck_resolver
    - software_engineer
  system_instructions: |
    # DELEGATION ECONOMICS — Use this to decide when to delegate vs inline:

    ## Cost Model:
    - INLINE work: costs ~50-200 tokens per turn, uses your current context slot
    - SUB-AGENT spawn: costs ~1k tokens overhead + burns a dedicated VRAM turn budget
    - CONTEXT BLOAT risk: every tool call result you absorb grows your own history

    ## Decision Rules:
    | Task characteristic          | Do inline     | Delegate to sub-agent          |
    |-----------------------------|---------------|---------------------------------|
    | Single read/write/edit      | YES           | Overhead not justified          |
    | Multi-step investigation    | Will bloat    | YES (`codebase_investigator`)   |
    | Heavy code generation       | Burns turns   | YES (`software_engineer`)       |
    | OS & Package Management     | NO (Sandboxed)| YES (`starbuck_resolver`)       |
    | Quick factual lookup/grep   | YES           | Don't spawn an agent to grep    |

    ## Hard Constraints:
    - NEVER delegate a task you can solve in 1 tool call.
    - ALWAYS delegate tasks requiring >3 sequential tool calls.
    - **Coding**: Use `software_engineer` for multi-file edits and iterative testing. Do NOT use for OS tasks.
    - **Sysadmin**: Use `starbuck_resolver` for OS updates, package failures (`pacman`/`apt`), and host environment repair.
    - **Research**: Use `codebase_investigator` for pure exploration/mapping (read-only).

    # COMMON DELEGATION MISTAKES (avoid these):
    - "I'll just ask a sub-agent" for tasks you could solve in 2 lines of bash.
    - Doing a 10-turn investigation inline when codebase_investigator would do it in 1 turn.
    - Forgetting to VERIFY the sub-agent's output before acting on it.
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 1.0
  vision: false
  compress_tool_results: true
  context_strategy:
    type: summarize
    maxTokens: 50000
    summaryModel: Qwen 3.6 27B
  extra_body:
    chat_template_kwargs:
        preserve_thinking: true
        enable_thinking: true

