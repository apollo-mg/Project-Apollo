  - ask_user
  - starbuck_system_recon
  - starbuck_read_config
  - starbuck_write_config
  - starbuck_deploy_cluster
  - starbuck_install_package
  - starbuck_read_scratchpad
  - starbuck_write_scratchpad
  - starbuck_manage_service
  - starbuck_read_journal
  - starbuck_resolver
  - software_engineer
  system_instructions: "# DELEGATION ECONOMICS \u2014 Use this to decide when to delegate\
    \ vs inline:\n\n## Cost Model:\n- INLINE work: costs ~50-200 tokens per turn,\
    \ uses your current context slot\n- SUB-AGENT spawn: costs ~1k tokens overhead\
    \ + burns a dedicated VRAM turn budget\n- CONTEXT BLOAT risk: every tool call\
    \ result you absorb grows your own history\n\n## Decision Rules:\n| Task characteristic\
    \          | Do inline     | Delegate to sub-agent          |\n|-----------------------------|---------------|---------------------------------|\n\
    | Single read/write/edit      | YES           | Overhead not justified       \
    \   |\n| Multi-step investigation    | Will bloat    | YES (`codebase_investigator`)\
    \   |\n| Heavy code generation       | Burns turns   | YES (`software_engineer`)\
    \       |\n| OS & Package Management     | NO (Sandboxed)| YES (`starbuck_resolver`)\
    \       |\n| Quick factual lookup/grep   | YES           | Don't spawn an agent\
    \ to grep    |\n\n## Hard Constraints:\n- NEVER delegate a task you can solve\
    \ in 1 tool call.\n- ALWAYS delegate tasks requiring >3 sequential tool calls.\n\
    - **Coding**: Use `software_engineer` for multi-file edits and iterative testing.\
    \ Do NOT use for OS tasks.\n- **Sysadmin**: Use `starbuck_resolver` for OS updates,\
    \ package failures (`pacman`/`apt`), and host environment repair.\n- **Research**:\
    \ Use `codebase_investigator` for pure exploration/mapping (read-only).\n\n# COMMON\
    \ DELEGATION MISTAKES (avoid these):\n- \"I'll just ask a sub-agent\" for tasks\
    \ you could solve in 2 lines of bash.\n- Doing a 10-turn investigation inline\
    \ when codebase_investigator would do it in 1 turn.\n- Forgetting to VERIFY the\
    \ sub-agent's output before acting on it.\n"
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 1.0
  vision: false
  compress_tool_results: true
  context_strategy:
    type: summarize
    maxTokens: 50000
    summaryModel: FastContext-1.0-4B-RL-Q8_0
    summaryEndpoint: http://127.0.0.1:8083/v1
  extra_body:
    chat_template_kwargs:
      preserve_thinking: true
      enable_thinking: true
      auto_disable_thinking_with_tools: false
